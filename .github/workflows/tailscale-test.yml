name: CloudCraft MinIO Test

on:
  workflow_dispatch:

jobs:
  minio-test:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner

      - name: Check Tailscale
        run: |
          tailscale status

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Test MinIO
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 ls \
            --endpoint-url "${{ secrets.MINIO_ENDPOINT }}"

      - name: Upload test file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Hello from CloudCraft GitHub Actions!" > hello.txt

          aws s3 cp hello.txt \
            s3://cloudcraft/test/hello.txt \
            --endpoint-url "${{ secrets.MINIO_ENDPOINT }}"

      - name: Verify uploaded file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 ls \
            s3://cloudcraft/test/ \
            --endpoint-url "${{ secrets.MINIO_ENDPOINT }}"
