name: CloudCraft

on:
  workflow_dispatch:

# ============================================================
# CLOUDCRAFT
#
# GitHub Actions runner
#       ?
# Tailscale
#       ?
# MinIO persistent storage
#       ?
# TLauncher
#       ?
# Minecraft
#       ?
# Xvfb :99
#       ?
# x11vnc :5900
#       ?
# noVNC :6080
#       ?
# Cloudflare Quick Tunnel
#       ?
# Browser
# ============================================================

permissions:
  contents: read

env:
  # ----------------------------------------------------------
  # Minecraft / TLauncher
  # ----------------------------------------------------------

  JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64

  TLAUNCHER_URL: "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip"

  TLAUNCHER_DIR: "${HOME}/tlauncher"

  # Keep Minecraft data in the normal location.
  MINECRAFT_DIR: "${HOME}/.minecraft"

  # ----------------------------------------------------------
  # Virtual display
  # ----------------------------------------------------------

  DISPLAY: ":99"

  SCREEN_WIDTH: "1280"
  SCREEN_HEIGHT: "720"
  SCREEN_DEPTH: "24"

  # ----------------------------------------------------------
  # noVNC / VNC
  # ----------------------------------------------------------

  VNC_PORT: "5900"
  NOVNC_PORT: "6080"

  # ----------------------------------------------------------
  # CloudCraft paths
  # ----------------------------------------------------------

  CLOUDCRAFT_DIR: "${HOME}/cloudcraft"

  LOG_DIR: "${HOME}/cloudcraft/logs"

  # ----------------------------------------------------------
  # MinIO
  #
  # These are supplied through GitHub Secrets.
  # ----------------------------------------------------------

  MINIO_BUCKET: "cloudcraft"

  # ----------------------------------------------------------
  # Tailscale
  # ----------------------------------------------------------

  TAILSCALE_TAG: "tag:cloudcraft-runner"


jobs:

  # ==========================================================
  # MAIN CLOUDCRAFT JOB
  # ==========================================================

  cloudcraft:

    runs-on: ubuntu-latest

    # Don't let GitHub terminate the runner while we're doing
    # initialization forever.
    #
    # This is NOT a guarantee that the runner can stay forever.
    # GitHub-hosted runners are temporary.
    timeout-minutes: 350

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout CloudCraft
        uses: actions/checkout@v4


      # ========================================================
      # 2. SYSTEM INFORMATION
      # ========================================================

      - name: Check system
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CloudCraft system information"
          echo "=========================================="

          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "=========================================="


      # ========================================================
      # 3. JAVA 21
      #
      # We intentionally DO NOT use actions/setup-java here.
      #
      # Previous setup-java invocation attempted to scan the
      # repository for Gradle files and produced:
      #
      # "No file in ... CloudCraft matched ..."
      #
      # GitHub's Ubuntu image already contains Java 21.
      # ========================================================

      - name: Setup Java 21
        shell: bash
        run: |
          set -e

          echo "Available Java installations:"
          ls -la /usr/lib/jvm/ || true

          # Find Java 21 automatically.
          JAVA21="$(find /usr/lib/jvm -maxdepth 1 -type d \
            \( -name '*21*' -o -name '*temurin-21*' \) \
            | head -n 1)"

          if [ -z "$JAVA21" ]; then
            echo "Java 21 was not found."
            echo "Installed Java:"
            java -version || true
            exit 1
          fi

          echo "Using Java:"
          echo "$JAVA21"

          echo "JAVA_HOME=$JAVA21" >> "$GITHUB_ENV"

          echo "$JAVA21/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA21"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo
          java -version


      # ========================================================
      # 4. INSTALL GUI / X11 DEPENDENCIES
      #
      # IMPORTANT:
      #
      # We DO NOT install libgl1-mesa-glx.
      #
      # That package caused:
      #
      # Package 'libgl1-mesa-glx' has no installation candidate
      #
      # On current Ubuntu, use Mesa's current packages instead.
      # ========================================================

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb \
            x11vnc \
            x11-utils \
            x11-xserver-utils \
            xdotool \
            openbox \
            mesa-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-xinerama0 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shm0 \
            libxcb-keysyms1 \
            libxcb-image0 \
            libxcb-icccm4 \
            libxcb-xfixes0 \
            libxrandr2 \
            libxinerama1 \
            libxcursor1 \
            libxfixes3 \
            libxi6 \
            libxrender1 \
            libxext6 \
            libxtst6 \
            libasound2t64 \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            unzip \
            curl \
            wget \
            git \
            jq \
            procps \
            net-tools \
            ca-certificates

          echo
          echo "GUI dependencies installed."


      # ========================================================
      # 5. PREPARE CLOUDCRAFT DIRECTORY
      # ========================================================

      - name: Prepare CloudCraft directories
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/cloudcraft"
          mkdir -p "$HOME/cloudcraft/logs"

          mkdir -p "$HOME/.minecraft"
          mkdir -p "$HOME/.tlauncher"

          echo "Directories:"
          find "$HOME/cloudcraft" -maxdepth 2 -type d || true


      # ========================================================
      # 6. TAILSCALE
      #
      # Required GitHub Secrets:
      #
      # TS_OAUTH_CLIENT_ID
      # TS_OAUTH_SECRET
      #
      # OAuth credential should have:
      #
      # Devices ? Core ? Write
      # Keys ? Auth Keys ? Write
      #
      # and tag:
      #
      # tag:cloudcraft-runner
      # ========================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner


      # ========================================================
      # 7. VERIFY TAILSCALE
      # ========================================================

      - name: Verify Tailscale
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Tailscale status"
          echo "=========================================="

          tailscale status || true

          echo
          echo "Local Tailscale IP:"
          tailscale ip -4 || true

          echo
          echo "Tailscale DNS:"
          tailscale dns status || true

          echo
          echo "=========================================="


      # ========================================================
      # 8. VERIFY MINIO
      #
      # MinIO endpoint should be reachable through Tailscale.
      #
      # GitHub Secret:
      #
      # MINIO_ENDPOINT
      #
      # Example:
      #
      # http://100.x.x.x:9000
      #
      # IMPORTANT:
      # Do NOT put this directly in the YAML if it exposes
      # your private topology.
      # ========================================================

      - name: Verify MinIO connection
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e

          export AWS_EC2_METADATA_DISABLED=true

          echo "Testing MinIO endpoint:"
          echo "$MINIO_ENDPOINT"

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            "$MINIO_ENDPOINT/minio/health/live"

          echo
          echo "MinIO is reachable."


      # ========================================================
      # 9. CHECK AWS CLI
      #
      # Current GitHub Ubuntu images already contain AWS CLI.
      #
      # We only install it if it is unexpectedly missing.
      # This avoids the previous:
      #
      # "Package awscli has no installation candidate"
      #
      # problem.
      # ========================================================

      - name: Verify AWS CLI
        shell: bash
        run: |
          set -e

          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed:"
            aws --version
            exit 0
          fi

          echo "AWS CLI missing. Installing official AWS CLI v2..."

          cd "$RUNNER_TEMP"

          curl -fsSL \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o awscliv2.zip

          rm -rf aws

          unzip -q awscliv2.zip

          sudo ./aws/install --update

          aws --version


      # ========================================================
      # 10. CONFIGURE AWS CLI FOR MINIO
      # ========================================================

      - name: Configure MinIO S3 client
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e

          export AWS_EC2_METADATA_DISABLED=true

          mkdir -p "$HOME/.aws"

          aws configure set aws_access_key_id \
            "$AWS_ACCESS_KEY_ID"

          aws configure set aws_secret_access_key \
            "$AWS_SECRET_ACCESS_KEY"

          aws configure set default.region \
            us-east-1

          aws configure set default.s3.addressing_style \
            path

          aws configure set default.s3.signature_version \
            s3v4

          echo "AWS CLI configured for MinIO."


      # ========================================================
      # 11. VERIFY BUCKET
      # ========================================================

      - name: Verify CloudCraft MinIO bucket
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e

          export AWS_EC2_METADATA_DISABLED=true

          echo "Checking bucket:"
          echo "$MINIO_BUCKET"

          aws s3api head-bucket \
            --bucket "$MINIO_BUCKET" \
            --endpoint-url "$MINIO_ENDPOINT"

          echo "Bucket exists."


      # ========================================================
      # 12. RESTORE PERSISTENT DATA
      #
      # Stored layout:
      #
      # s3://cloudcraft/
      #
      #   minecraft/
      #   tlauncher/
      #
      # We restore both.
      # ========================================================

      - name: Restore CloudCraft data from MinIO
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e

          export AWS_EC2_METADATA_DISABLED=true

          echo "=========================================="
          echo "Restoring Minecraft data..."
          echo "=========================================="

          aws s3 sync \
            "s3://${MINIO_BUCKET}/minecraft/" \
            "$HOME/.minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          echo
          echo "=========================================="
          echo "Restoring TLauncher data..."
          echo "=========================================="

          aws s3 sync \
            "s3://${MINIO_BUCKET}/tlauncher/" \
            "$HOME/.tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          echo
          echo "Restore complete."

          echo
          echo "Minecraft files:"
          du -sh "$HOME/.minecraft" || true

          echo
          echo "TLauncher files:"
          du -sh "$HOME/.tlauncher" || true


      # ========================================================
      # 13. START Xvfb
      # ========================================================

      - name: Start virtual display
        shell: bash
        run: |
          set -e

          rm -f /tmp/.X99-lock

          Xvfb "$DISPLAY" \
            -screen 0 "${SCREEN_WIDTH}x${SCREEN_HEIGHT}x${SCREEN_DEPTH}" \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > "$LOG_DIR/xvfb.log" 2>&1 &

          XVFB_PID=$!

          echo "$XVFB_PID" > "$CLOUDCRAFT_DIR/xvfb.pid"

          sleep 3

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "Xvfb failed to start."
            cat "$LOG_DIR/xvfb.log" || true
            exit 1
          fi

          echo "Xvfb running with PID $XVFB_PID"


      # ========================================================
      # 14. START OPENBOX
      #
      # A lightweight window manager keeps TLauncher/Minecraft
      # windows manageable without wasting CPU.
      # ========================================================

      - name: Start window manager
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          openbox \
            > "$LOG_DIR/openbox.log" 2>&1 &

          OPENBOX_PID=$!

          echo "$OPENBOX_PID" > "$CLOUDCRAFT_DIR/openbox.pid"

          sleep 2

          echo "Openbox running."


      # ========================================================
      # 15. VERIFY DISPLAY
      # ========================================================

      - name: Check virtual display
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          xdpyinfo >/dev/null

          echo "Virtual display is working."

          xdpyinfo | grep -E \
            'dimensions|depth of root window' || true


      # ========================================================
      # 16. CHECK OPENGL
      #
      # GitHub runner normally has software rendering through
      # Mesa/llvmpipe.
      #
      # This isn't a physical GPU, but it allows Minecraft to
      # render in the virtual X display.
      # ========================================================

      - name: Check OpenGL
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          glxinfo -B || true

          echo
          echo "OpenGL renderer:"
          glxinfo -B 2>/dev/null \
            | grep -E \
            'OpenGL vendor|OpenGL renderer|OpenGL version' \
            || true


      # ========================================================
      # 17. GENERATE VNC PASSWORD
      #
      # We use x11vnc's storepasswd directly.
      #
      # This avoids the previous "Broken pipe" problem.
      # ========================================================

      - name: Generate VNC password
        shell: bash
        run: |
          set -e

          VNC_PASSWORD_FILE="$CLOUDCRAFT_DIR/vnc-password.txt"

          # Generate a 12-character password.
          VNC_PASSWORD="$(
            tr -dc 'A-Za-z0-9' </dev/urandom \
            | head -c 12
          )"

          # Save the plaintext password privately for the job.
          printf '%s\n' "$VNC_PASSWORD" \
            > "$CLOUDCRAFT_DIR/vnc-password-plain.txt"

          chmod 600 \
            "$CLOUDCRAFT_DIR/vnc-password-plain.txt"

          # Generate x11vnc-compatible password file.
          x11vnc \
            -storepasswd \
            "$VNC_PASSWORD" \
            "$VNC_PASSWORD_FILE"

          chmod 600 "$VNC_PASSWORD_FILE"

          echo "VNC password generated."


      # ========================================================
      # 18. START x11vnc
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT use:
      #
      # -encodings tight
      #
      # because the installed x11vnc version rejected it.
      #
      # noVNC/websockify handles the browser WebSocket side.
      # ========================================================

      - name: Start x11vnc
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          x11vnc \
            -display "$DISPLAY" \
            -rfbport "$VNC_PORT" \
            -rfbauth "$CLOUDCRAFT_DIR/vnc-password.txt" \
            -forever \
            -shared \
            -noxdamage \
            -noxrecord \
            -noxfixes \
            -cursor arrow \
            -repeat \
            -wait 5 \
            -defer 5 \
            -threads \
            > "$LOG_DIR/x11vnc.log" 2>&1 &

          X11VNC_PID=$!

          echo "$X11VNC_PID" \
            > "$CLOUDCRAFT_DIR/x11vnc.pid"

          sleep 3

          if ! kill -0 "$X11VNC_PID" 2>/dev/null; then
            echo "x11vnc failed to start."
            cat "$LOG_DIR/x11vnc.log" || true
            exit 1
          fi

          echo "x11vnc running."
          echo "PID: $X11VNC_PID"


      # ========================================================
      # 19. DOWNLOAD noVNC
      #
      # We use the official noVNC repository.
      #
      # novnc_proxy is located at:
      #
      # utils/novnc_proxy
      #
      # This fixes the previous:
      #
      # "novnc_proxy: command not found"
      # ========================================================

      - name: Install noVNC
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/noVNC"

          git clone \
            --depth 1 \
            https://github.com/novnc/noVNC.git \
            "$HOME/noVNC"

          test -x "$HOME/noVNC/utils/novnc_proxy"

          echo "noVNC installed."


      # ========================================================
      # 20. START noVNC
      #
      # Browser:
      #
      # http://127.0.0.1:6080
      #
      # Cloudflare later exposes this.
      # ========================================================

      - name: Start noVNC
        shell: bash
        run: |
          set -e

          "$HOME/noVNC/utils/novnc_proxy" \
            --vnc "127.0.0.1:${VNC_PORT}" \
            --listen "127.0.0.1:${NOVNC_PORT}" \
            > "$LOG_DIR/novnc.log" 2>&1 &

          NOVNC_PID=$!

          echo "$NOVNC_PID" \
            > "$CLOUDCRAFT_DIR/novnc.pid"

          sleep 3

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
            echo "noVNC failed to start."
            cat "$LOG_DIR/novnc.log" || true
            exit 1
          fi

          echo "noVNC running."
          echo "PID: $NOVNC_PID"


      # ========================================================
      # 21. VERIFY noVNC
      # ========================================================

      - name: Verify noVNC is ready
        shell: bash
        run: |
          set -e

          echo "Checking noVNC..."

          for i in $(seq 1 30); do

            if curl \
              --fail \
              --silent \
              --max-time 3 \
              "http://127.0.0.1:${NOVNC_PORT}/" \
              >/dev/null 2>&1; then

              echo "noVNC is ready!"
              exit 0
            fi

            echo "Waiting for noVNC... ($i/30)"

            sleep 1
          done

          echo
          echo "noVNC did not start correctly."

          echo
          echo "Listening ports:"
          ss -ltnp || true

          echo
          echo "noVNC log:"
          cat "$LOG_DIR/novnc.log" || true

          echo
          echo "x11vnc log:"
          cat "$LOG_DIR/x11vnc.log" || true

          exit 1


      # ========================================================
      # 22. CREATE CONNECTION SUMMARY
      #
      # This summary contains:
      #
      # - Local noVNC
      # - VNC password
      # - Tailscale IP
      # ========================================================

      - name: Create connection information
        shell: bash
        run: |
          set -e

          VNC_PASSWORD="$(
            cat "$CLOUDCRAFT_DIR/vnc-password-plain.txt"
          )"

          TS_IP="$(
            tailscale ip -4 2>/dev/null \
            | head -n 1 \
            || true
          )"

          {
            echo "# ? CloudCraft"
            echo
            echo "## ?? Browser Access"
            echo
            echo "The local noVNC server is:"
            echo
            echo "\`http://127.0.0.1:${NOVNC_PORT}/\`"
            echo
            echo "Cloudflare URL will appear below after the tunnel starts."
            echo
            echo "## ? VNC Password"
            echo
            echo "\`$VNC_PASSWORD\`"
            echo
            echo "## ?? Tailscale"
            echo
            echo "Runner Tailscale IPv4:"
            echo
            echo "\`$TS_IP\`"
            echo
            echo "Tag:"
            echo
            echo "\`tag:cloudcraft-runner\`"
          } >> "$GITHUB_STEP_SUMMARY"


      # ========================================================
      # 23. DOWNLOAD TLAUNCHER
      # ========================================================

      - name: Download TLauncher v17
        shell: bash
        run: |
          set -e

          cd "$HOME"

          rm -f TLauncher.v17.zip

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            "$TLAUNCHER_URL" \
            -o TLauncher.v17.zip

          ls -lh TLauncher.v17.zip


      # ========================================================
      # 24. EXTRACT TLAUNCHER
      # ========================================================

      - name: Extract TLauncher
        shell: bash
        run: |
          set -e

          rm -rf "$TLAUNCHER_DIR"

          mkdir -p "$TLAUNCHER_DIR"

          unzip -q \
            "$HOME/TLauncher.v17.zip" \
            -d "$TLAUNCHER_DIR"

          echo "TLauncher files:"
          find "$TLAUNCHER_DIR" \
            -maxdepth 3 \
            -type f \
            | head -n 50


      # ========================================================
      # 25. FIND TLAUNCHER JAR
      # ========================================================

      - name: Find TLauncher JAR
        shell: bash
        run: |
          set -e

          TLAUNCHER_JAR="$(
            find "$TLAUNCHER_DIR" \
              -type f \
              -iname '*.jar' \
              | grep -Ei 'tlauncher' \
              | head -n 1
          )"

          if [ -z "$TLAUNCHER_JAR" ]; then
            TLAUNCHER_JAR="$(
              find "$TLAUNCHER_DIR" \
                -type f \
                -iname '*.jar' \
                | head -n 1
            )"
          fi

          if [ -z "$TLAUNCHER_JAR" ]; then
            echo "No TLauncher JAR found."
            find "$TLAUNCHER_DIR" -type f
            exit 1
          fi

          echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" \
            >> "$GITHUB_ENV"

          echo "Found:"
          echo "$TLAUNCHER_JAR"


      # ========================================================
      # 26. START TLAUNCHER
      #
      # TLauncher itself is used as the Minecraft launcher.
      #
      # We intentionally don't use the external Fabric installer.
      #
      # Since your TLauncher already provides:
      #
      # Fabric 1.21.11
      #
      # you can select it directly in the TLauncher GUI.
      # ========================================================

      - name: Start TLauncher
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          cd "$TLAUNCHER_DIR"

          echo "Starting TLauncher:"
          echo "$TLAUNCHER_JAR"

          nohup "$JAVA_HOME/bin/java" \
            -Xms512M \
            -Xmx2048M \
            -Djava.awt.headless=false \
            -jar "$TLAUNCHER_JAR" \
            > "$LOG_DIR/tlauncher.log" 2>&1 &

          TLAUNCHER_PID=$!

          echo "$TLAUNCHER_PID" \
            > "$CLOUDCRAFT_DIR/tlauncher.pid"

          echo "TLauncher PID:"
          echo "$TLAUNCHER_PID"

          sleep 8

          if ! kill -0 "$TLAUNCHER_PID" 2>/dev/null; then
            echo "TLauncher exited."

            echo
            echo "TLauncher log:"
            cat "$LOG_DIR/tlauncher.log" || true

            exit 1
          fi

          echo "TLauncher is running."


      # ========================================================
      # 27. CLOUDCRAFT TUNING
      #
      # These JVM properties help avoid unnecessary rendering
      # overhead in the virtual environment.
      #
      # The actual Minecraft JVM may be selected by TLauncher.
      # ========================================================

      - name: Prepare CloudCraft runtime
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          # Disable screen blanking.
          xset s off || true
          xset -dpms || true
          xset s noblank || true

          echo "CloudCraft runtime prepared."


      # ========================================================
      # 28. START CLOUDflare QUICK TUNNEL
      #
      # Target:
      #
      # http://127.0.0.1:6080
      #
      # IMPORTANT:
      #
      # Quick Tunnel creates a random:
      #
      # https://xxxxx.trycloudflare.com
      #
      # URL.
      #
      # We capture BOTH stdout and stderr.
      #
      # We also wait up to 90 seconds.
      # ========================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -e

          if command -v cloudflared >/dev/null 2>&1; then
            echo "cloudflared already installed:"
            cloudflared --version
            exit 0
          fi

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64)
              PACKAGE_ARCH="amd64"
              ;;
            arm64)
              PACKAGE_ARCH="arm64"
              ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          cd "$RUNNER_TEMP"

          curl \
            --fail \
            --location \
            --retry 5 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${PACKAGE_ARCH}.deb" \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version


      # ========================================================
      # 29. START CLOUDFLARE QUICK TUNNEL
      # ========================================================

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -e

          CLOUDFLARED_LOG="$LOG_DIR/cloudflared.log"
          CLOUDFLARE_URL_FILE="$CLOUDCRAFT_DIR/cloudflare-url.txt"

          rm -f "$CLOUDFLARED_LOG"
          rm -f "$CLOUDFLARE_URL_FILE"

          echo "Checking noVNC before Cloudflare..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            "http://127.0.0.1:${NOVNC_PORT}/" \
            >/dev/null

          echo
          echo "noVNC is available."
          echo
          echo "Starting Cloudflare Quick Tunnel..."

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url "http://127.0.0.1:${NOVNC_PORT}" \
            > "$CLOUDFLARED_LOG" 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" \
            > "$CLOUDCRAFT_DIR/cloudflared.pid"

          echo
          echo "cloudflared PID:"
          echo "$CLOUDFLARED_PID"

          FOUND_URL=""

          # Wait up to 120 seconds.
          for i in $(seq 1 120); do

            sleep 1

            # If process exited, don't immediately fail.
            # Sometimes the process can write its URL and then
            # change state during startup.
            if [ -f "$CLOUDFLARED_LOG" ]; then

              FOUND_URL="$(
                grep \
                  -oE \
                  'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                  "$CLOUDFLARED_LOG" \
                  | head -n 1 \
                  || true
              )"

            fi

            if [ -n "$FOUND_URL" ]; then
              break
            fi

            echo "Waiting for Cloudflare tunnel... ($i/120)"

          done

          echo
          echo "=========================================="
          echo "Cloudflare log"
          echo "=========================================="

          cat "$CLOUDFLARED_LOG" || true

          echo
          echo "=========================================="

          if [ -z "$FOUND_URL" ]; then

            echo "::error::Cloudflare Quick Tunnel URL was not detected."

            echo
            echo "cloudflared process:"
            ps aux | grep '[c]loudflared' || true

            echo
            echo "Listening ports:"
            ss -ltnp || true

            echo
            echo "Connectivity test:"
            curl \
              --max-time 10 \
              -I \
              https://api.trycloudflare.com \
              || true

            exit 1
          fi

          printf '%s\n' "$FOUND_URL" \
            > "$CLOUDFLARE_URL_FILE"

          echo
          echo "=========================================="
          echo "?? CLOUDFLARE QUICK TUNNEL READY"
          echo "=========================================="
          echo
          echo "Browser URL:"
          echo "$FOUND_URL"
          echo
          echo "=========================================="


      # ========================================================
      # 30. CLOUDFLARE SUMMARY
      # ========================================================

      - name: Publish CloudCraft connection information
        shell: bash
        run: |
          set -e

          CLOUDFLARE_URL="$(
            cat "$CLOUDCRAFT_DIR/cloudflare-url.txt"
          )"

          VNC_PASSWORD="$(
            cat "$CLOUDCRAFT_DIR/vnc-password-plain.txt"
          )"

          {
            echo
            echo "# ? CloudCraft is ONLINE"
            echo
            echo "## ? Browser"
            echo
            echo "### [Open CloudCraft](<${CLOUDFLARE_URL}/vnc.html>)"
            echo
            echo "**Cloudflare Quick Tunnel:**"
            echo
            echo "$CLOUDFLARE_URL"
            echo
            echo "## ? VNC Password"
            echo
            echo "\`$VNC_PASSWORD\`"
            echo
            echo "## ? Minecraft"
            echo
            echo "TLauncher is running."
            echo
            echo "Use the TLauncher GUI to select:"
            echo
            echo "\`Fabric 1.21.11\`"
            echo
            echo "then launch Minecraft."
            echo
            echo "## ? Current streaming path"
            echo
            echo "\`Minecraft ? Xvfb ? x11vnc ? noVNC/WebSocket ? Cloudflare\`"
            echo
            echo "> WebRTC is NOT used yet. It will be a separate low-latency streaming layer."
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "=========================================="
          echo "CLOUDCRAFT READY"
          echo "=========================================="
          echo
          echo "URL:"
          echo "$CLOUDFLARE_URL/vnc.html"
          echo
          echo "VNC PASSWORD:"
          echo "$VNC_PASSWORD"
          echo
          echo "=========================================="


      # ========================================================
      # 31. INITIAL SAVE
      #
      # Save once after TLauncher starts.
      # ========================================================

      - name: Initial CloudCraft backup
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set +e

          export AWS_EC2_METADATA_DISABLED=true

          echo "Starting initial backup..."

          aws s3 sync \
            "$HOME/.minecraft/" \
            "s3://${MINIO_BUCKET}/minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          aws s3 sync \
            "$HOME/.tlauncher/" \
            "s3://${MINIO_BUCKET}/tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          echo "Initial backup complete."


      # ========================================================
      # 32. BACKGROUND AUTO-SAVE
      #
      # Every 5 minutes.
      #
      # NOTE:
      #
      # This is a best-effort backup while Minecraft is running.
      # A live Minecraft world can change while files are being
      # copied, so this is not equivalent to a transactional
      # database snapshot.
      #
      # The final backup is done during cleanup.
      # ========================================================

      - name: Start automatic MinIO backup
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e

          export AWS_EC2_METADATA_DISABLED=true

          BACKUP_SCRIPT="$CLOUDCRAFT_DIR/autosave.sh"

          cat > "$BACKUP_SCRIPT" <<'SCRIPT'
          #!/usr/bin/env bash

          export AWS_EC2_METADATA_DISABLED=true

          while true; do

            sleep 300

            echo
            echo "=========================================="
            echo "CloudCraft periodic backup"
            date
            echo "=========================================="

            aws s3 sync \
              "$HOME/.minecraft/" \
              "s3://${MINIO_BUCKET}/minecraft/" \
              --endpoint-url "$MINIO_ENDPOINT" \
              --only-show-errors \
              || true

            aws s3 sync \
              "$HOME/.tlauncher/" \
              "s3://${MINIO_BUCKET}/tlauncher/" \
              --endpoint-url "$MINIO_ENDPOINT" \
              --only-show-errors \
              || true

            echo "Periodic backup finished."

          done
          SCRIPT

          chmod +x "$BACKUP_SCRIPT"

          nohup "$BACKUP_SCRIPT" \
            > "$LOG_DIR/autosave.log" 2>&1 &

          AUTOSAVE_PID=$!

          echo "$AUTOSAVE_PID" \
            > "$CLOUDCRAFT_DIR/autosave.pid"

          echo "Auto-save PID:"
          echo "$AUTOSAVE_PID"


      # ========================================================
      # 33. KEEP CLOUDCRAFT ALIVE
      #
      # This keeps the workflow alive while you use the browser.
      #
      # The job timeout is 350 minutes.
      # ========================================================

      - name: Keep CloudCraft running
        shell: bash
        run: |
          set +e

          echo
          echo "=========================================="
          echo "      CLOUDCRAFT IS RUNNING"
          echo "=========================================="
          echo

          echo "Cloudflare URL:"
          cat "$CLOUDCRAFT_DIR/cloudflare-url.txt" || true

          echo
          echo "VNC password:"
          cat "$CLOUDCRAFT_DIR/vnc-password-plain.txt" || true

          echo
          echo "=========================================="
          echo

          while true; do

            sleep 60

            echo
            echo "[$(date)] CloudCraft heartbeat"

            # Check TLauncher.
            if [ -f "$CLOUDCRAFT_DIR/tlauncher.pid" ]; then

              PID="$(cat "$CLOUDCRAFT_DIR/tlauncher.pid")"

              if kill -0 "$PID" 2>/dev/null; then
                echo "TLauncher: RUNNING"
              else
                echo "TLauncher: STOPPED"
              fi

            fi

            # Check noVNC.
            if curl \
              --silent \
              --max-time 3 \
              "http://127.0.0.1:${NOVNC_PORT}/" \
              >/dev/null 2>&1; then

              echo "noVNC: RUNNING"

            else

              echo "noVNC: NOT RESPONDING"

            fi

            # Check Cloudflare.
            if [ -f "$CLOUDCRAFT_DIR/cloudflared.pid" ]; then

              PID="$(cat "$CLOUDCRAFT_DIR/cloudflared.pid")"

              if kill -0 "$PID" 2>/dev/null; then
                echo "Cloudflare: RUNNING"
              else
                echo "Cloudflare: STOPPED"
              fi

            fi

          done


      # ========================================================
      # 34. FINAL BACKUP
      #
      # Runs if the job reaches normal completion.
      # ========================================================

      - name: Final CloudCraft backup
        if: always()
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set +e

          export AWS_EC2_METADATA_DISABLED=true

          echo "Performing final CloudCraft backup..."

          aws s3 sync \
            "$HOME/.minecraft/" \
            "s3://${MINIO_BUCKET}/minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors \
            || true

          aws s3 sync \
            "$HOME/.tlauncher/" \
            "s3://${MINIO_BUCKET}/tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors \
            || true

          echo "Final backup finished."


      # ========================================================
      # 35. COLLECT LOGS
      # ========================================================

      - name: Collect CloudCraft logs
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "=========================================="
          echo "CloudCraft logs"
          echo "=========================================="

          for FILE in \
            "$LOG_DIR/xvfb.log" \
            "$LOG_DIR/openbox.log" \
            "$LOG_DIR/x11vnc.log" \
            "$LOG_DIR/novnc.log" \
            "$LOG_DIR/tlauncher.log" \
            "$LOG_DIR/cloudflared.log" \
            "$LOG_DIR/autosave.log"
          do

            if [ -f "$FILE" ]; then

              echo
              echo "=========================================="
              echo "$FILE"
              echo "=========================================="

              tail -n 100 "$FILE"

            fi

          done


      # ========================================================
      # 36. CLEANUP
      # ========================================================

      - name: Cleanup CloudCraft
        if: always()
        shell: bash
        run: |
          set +e

          echo "Stopping CloudCraft processes..."

          # Stop autosave.
          if [ -f "$CLOUDCRAFT_DIR/autosave.pid" ]; then
            kill "$(cat "$CLOUDCRAFT_DIR/autosave.pid")" 2>/dev/null || true
          fi

          # Stop Cloudflare.
          if [ -f "$CLOUDCRAFT_DIR/cloudflared.pid" ]; then
            kill "$(cat "$CLOUDCRAFT_DIR/cloudflared.pid")" 2>/dev/null || true
          fi

          # Stop TLauncher.
          if [ -f "$CLOUDCRAFT_DIR/tlauncher.pid" ]; then
            kill "$(cat "$CLOUDCRAFT_DIR/tlauncher.pid")" 2>/dev/null || true
          fi

          # Stop noVNC.
          if [ -f "$CLOUDCRAFT_DIR/novnc.pid" ]; then
            kill "$(cat "$CLOUDCRAFT_DIR/novnc.pid")" 2>/dev/null || true
          fi

          # Stop x11vnc.
          if [ -f "$CLOUDCRAFT_DIR/x11vnc.pid" ]; then
            kill "$(cat "$CLOUDCRAFT_DIR/x11vnc.pid")" 2>/dev/null || true
          fi

          # Stop Openbox.
          if [ -f "$CLOUDCRAFT_DIR/openbox.pid" ]; then
            kill "$(cat "$CLOUDCRAFT_DIR/openbox.pid")" 2>/dev/null || true
          fi

          # Stop Xvfb.
          if [ -f "$CLOUDCRAFT_DIR/xvfb.pid" ]; then
            kill "$(cat "$CLOUDCRAFT_DIR/xvfb.pid")" 2>/dev/null || true
          fi

          echo "CloudCraft cleanup complete."
