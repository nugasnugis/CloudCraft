name: CloudCraft WebRTC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudcraft
  cancel-in-progress: false

jobs:
  cloudcraft:
    runs-on: ubuntu-24.04

    # GitHub-hosted runners have a 6-hour maximum job execution time.
    # We deliberately stop a little before that so the final MinIO
    # backup has time to finish.
    timeout-minutes: 350

    env:
      DISPLAY: ":99"
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "720"
      SCREEN_DEPTH: "24"

      CLOUDCRAFT_DIR: "${{ github.workspace }}/cloudcraft"
      TLAUNCHER_DIR: "${{ github.workspace }}/cloudcraft/tlauncher"

      # Selkies
      SELKIES_PORT: "8080"
      SELKIES_USER: "cloudcraft"

      # MinIO
      MINIO_ALIAS: "cloudcraft"
      MINIO_BUCKET: "cloudcraft"

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================

    - name: Checkout repository
      uses: actions/checkout@v4

    # ============================================================
    # 2. BASIC SYSTEM CHECK
    # ============================================================

    - name: Check system
      shell: bash
      run: |
        set -e

        echo "=== SYSTEM ==="
        uname -a

        echo
        echo "=== CPU ==="
        nproc
        lscpu | grep -E 'Model name|CPU\(s\)' || true

        echo
        echo "=== MEMORY ==="
        free -h

        echo
        echo "=== DISK ==="
        df -h /

        echo
        echo "=== GPU / OPENGL ==="
        lspci | grep -Ei 'vga|3d|display' || true

    # ============================================================
    # 3. JAVA 21
    # ============================================================

    - name: Setup Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: "gradle"

    - name: Verify Java
      shell: bash
      run: |
        java -version
        javac -version

    # ============================================================
    # 4. INSTALL GUI / X11 / AUDIO DEPENDENCIES
    #
    # IMPORTANT:
    # We intentionally do NOT install:
    #   x11vnc
    #   noVNC
    #   websockify
    #
    # CloudCraft now uses Selkies WebRTC directly.
    # ============================================================

    - name: Install GUI dependencies
      shell: bash
      run: |
        set -e

        sudo apt-get update

        sudo DEBIAN_FRONTEND=noninteractive apt-get install \
          -y \
          --no-install-recommends \
          xvfb \
          xserver-xorg-core \
          x11-utils \
          x11-xkb-utils \
          x11-xserver-utils \
          libx11-xcb1 \
          libxcb-dri3-0 \
          libxkbcommon0 \
          libxdamage1 \
          libxfixes3 \
          libxtst6 \
          libxext6 \
          libpulse0 \
          pulseaudio \
          pulseaudio-utils \
          dbus-x11 \
          mesa-utils \
          curl \
          wget \
          jq \
          unzip \
          zip \
          psmisc \
          procps \
          ca-certificates \
          python3 \
          python3-pip \
          python3-dev

        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    # ============================================================
    # 5. CREATE CLOUDCRAFT DIRECTORIES
    # ============================================================

    - name: Create CloudCraft directories
      shell: bash
      run: |
        set -e

        mkdir -p "$CLOUDCRAFT_DIR"
        mkdir -p "$CLOUDCRAFT_DIR/logs"
        mkdir -p "$CLOUDCRAFT_DIR/tmp"
        mkdir -p "$TLAUNCHER_DIR"

        echo "CloudCraft directory:"
        find "$CLOUDCRAFT_DIR" -maxdepth 2 -type d -print

    # ============================================================
    # 6. CONNECT TO TAILSCALE
    #
    # OAuth credentials created earlier.
    #
    # Tag:
    #   tag:cloudcraft-runner
    # ============================================================

    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:cloudcraft-runner

    - name: Verify Tailscale
      shell: bash
      run: |
        set -e

        echo "=== TAILSCALE ==="

        tailscale status || true
        echo

        tailscale ip -4 || true

    # ============================================================
    # 7. INSTALL MINIO CLIENT
    # ============================================================

    - name: Install MinIO client
      shell: bash
      run: |
        set -e

        mkdir -p "$HOME/bin"

        curl -fsSL \
          https://dl.min.io/client/mc/release/linux-amd64/mc \
          -o "$HOME/bin/mc"

        chmod +x "$HOME/bin/mc"

        echo "$HOME/bin" >> "$GITHUB_PATH"

        "$HOME/bin/mc" --version

    # ============================================================
    # 8. CONFIGURE MINIO
    #
    # Required GitHub Secrets:
    #
    # MINIO_ENDPOINT
    # MINIO_ACCESS_KEY
    # MINIO_SECRET_KEY
    #
    # Example endpoint:
    #
    # http://100.x.x.x:9000
    #
    # Use your Raspberry Pi's Tailscale IP.
    # ============================================================

    - name: Configure MinIO
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
        MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      run: |
        set -e

        if [ -z "$MINIO_ENDPOINT" ]; then
          echo "ERROR: MINIO_ENDPOINT is missing."
          exit 1
        fi

        if [ -z "$MINIO_ACCESS_KEY" ]; then
          echo "ERROR: MINIO_ACCESS_KEY is missing."
          exit 1
        fi

        if [ -z "$MINIO_SECRET_KEY" ]; then
          echo "ERROR: MINIO_SECRET_KEY is missing."
          exit 1
        fi

        mc alias set \
          "$MINIO_ALIAS" \
          "$MINIO_ENDPOINT" \
          "$MINIO_ACCESS_KEY" \
          "$MINIO_SECRET_KEY" \
          --api S3v4

        echo "MinIO configured."

        mc admin info "$MINIO_ALIAS" || true

    # ============================================================
    # 9. CREATE / VERIFY BUCKET
    # ============================================================

    - name: Verify MinIO bucket
      shell: bash
      run: |
        set -e

        if ! mc ls "$MINIO_ALIAS/$MINIO_BUCKET" >/dev/null 2>&1; then
          echo "Bucket does not exist. Creating..."

          mc mb \
            "$MINIO_ALIAS/$MINIO_BUCKET"
        fi

        echo
        echo "=== BUCKET ==="
        mc ls "$MINIO_ALIAS/$MINIO_BUCKET" || true

    # ============================================================
    # 10. RESTORE MINECRAFT / TLAUNCHER DATA
    #
    # MinIO layout:
    #
    # cloudcraft/
    #   tlauncher/
    #   minecraft/
    #
    # ============================================================

    - name: Restore CloudCraft data
      shell: bash
      run: |
        set -e

        mkdir -p "$HOME/.minecraft"
        mkdir -p "$HOME/.tlauncher"

        echo "=== Restore TLauncher ==="

        mc mirror \
          "$MINIO_ALIAS/$MINIO_BUCKET/tlauncher" \
          "$HOME/.tlauncher" \
          --overwrite \
          --preserve || true

        echo "=== Restore Minecraft ==="

        mc mirror \
          "$MINIO_ALIAS/$MINIO_BUCKET/minecraft" \
          "$HOME/.minecraft" \
          --overwrite \
          --preserve || true

        echo
        echo "=== Restored sizes ==="

        du -sh "$HOME/.minecraft" || true
        du -sh "$HOME/.tlauncher" || true

    # ============================================================
    # 11. START Xvfb
    #
    # Minecraft will run on DISPLAY=:99
    #
    # No VNC.
    # No x11vnc.
    # No noVNC.
    # ============================================================

    - name: Start virtual display
      shell: bash
      run: |
        set -e

        mkdir -p "$CLOUDCRAFT_DIR/logs"

        rm -f /tmp/.X99-lock || true

        Xvfb "$DISPLAY" \
          -screen 0 "${SCREEN_WIDTH}x${SCREEN_HEIGHT}x${SCREEN_DEPTH}" \
          +extension GLX \
          +extension RANDR \
          +extension MIT-SHM \
          -nolisten tcp \
          -noreset \
          > "$CLOUDCRAFT_DIR/logs/xvfb.log" 2>&1 &

        XVFB_PID=$!

        echo "$XVFB_PID" \
          > "$CLOUDCRAFT_DIR/xvfb.pid"

        echo "Xvfb PID: $XVFB_PID"

        for i in $(seq 1 30); do
          if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
            echo "Virtual display is ready."
            break
          fi

          sleep 1
        done

        xdpyinfo -display "$DISPLAY" >/dev/null

    # ============================================================
    # 12. START PULSEAUDIO
    # ============================================================

    - name: Start PulseAudio
      shell: bash
      run: |
        set -e

        export XDG_RUNTIME_DIR="/tmp/cloudcraft-runtime"

        mkdir -p "$XDG_RUNTIME_DIR"
        chmod 700 "$XDG_RUNTIME_DIR"

        export PULSE_RUNTIME_PATH="$XDG_RUNTIME_DIR/pulse"

        mkdir -p "$PULSE_RUNTIME_PATH"

        pulseaudio \
          --start \
          --exit-idle-time=-1 \
          --log-target=file:"$CLOUDCRAFT_DIR/logs/pulseaudio.log"

        sleep 2

        pactl info || true

    # ============================================================
    # 13. CHECK OPENGL
    # ============================================================

    - name: Check OpenGL
      shell: bash
      run: |
        set +e

        DISPLAY="$DISPLAY" glxinfo -B \
          > "$CLOUDCRAFT_DIR/logs/opengl.log" 2>&1

        cat "$CLOUDCRAFT_DIR/logs/opengl.log"

        exit 0

    # ============================================================
    # 14. DOWNLOAD TLAUNCHER v17
    #
    # User-provided TLauncher v17 URL.
    #
    # We are using TLauncher as the Minecraft client.
    # Authentication/licensing behavior is left to TLauncher.
    # ============================================================

    - name: Download TLauncher v17
      shell: bash
      run: |
        set -e

        cd "$TLAUNCHER_DIR"

        curl -fL \
          --retry 5 \
          --retry-all-errors \
          --connect-timeout 20 \
          --max-time 300 \
          "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip" \
          -o TLauncher.v17.zip

        file TLauncher.v17.zip

        unzip -o TLauncher.v17.zip \
          -d "$TLAUNCHER_DIR/app"

        echo
        echo "=== TLauncher files ==="

        find "$TLAUNCHER_DIR/app" \
          -maxdepth 3 \
          -type f \
          | head -100

    # ============================================================
    # 15. FIND TLAUNCHER JAR
    # ============================================================

    - name: Find TLauncher JAR
      shell: bash
      run: |
        set -e

        TLAUNCHER_JAR="$(
          find "$TLAUNCHER_DIR/app" \
            -type f \
            -iname 'TLauncher.jar' \
            | head -n 1
        )"

        if [ -z "$TLAUNCHER_JAR" ]; then
          echo "ERROR: TLauncher.jar not found."
          find "$TLAUNCHER_DIR/app" -type f | head -200
          exit 1
        fi

        echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" \
          >> "$GITHUB_ENV"

        echo "TLauncher JAR:"
        echo "$TLAUNCHER_JAR"

    # ============================================================
    # 16. START TLAUNCHER
    #
    # MANUAL MINECRAFT START:
    #
    # We DO NOT automatically launch Minecraft.
    #
    # TLauncher GUI will be available in the browser.
    #
    # User chooses Fabric 1.21.11 manually.
    # ============================================================

    - name: Start TLauncher
      shell: bash
      run: |
        set -e

        mkdir -p "$CLOUDCRAFT_DIR/logs"

        export DISPLAY="$DISPLAY"

        cd "$TLAUNCHER_DIR/app"

        nohup java \
          -Xms512M \
          -Xmx4G \
          -Dfile.encoding=UTF-8 \
          -jar "$TLAUNCHER_JAR" \
          > "$CLOUDCRAFT_DIR/logs/tlauncher.log" 2>&1 &

        TLAUNCHER_PID=$!

        echo "$TLAUNCHER_PID" \
          > "$CLOUDCRAFT_DIR/tlauncher.pid"

        echo "TLauncher PID: $TLAUNCHER_PID"

        sleep 8

        if kill -0 "$TLAUNCHER_PID" 2>/dev/null; then
          echo "TLauncher is running."
        else
          echo "TLauncher exited."
          cat "$CLOUDCRAFT_DIR/logs/tlauncher.log" || true
          exit 1
        fi

    # ============================================================
    # 17. INSTALL SELKIES
    #
    # Selkies provides:
    #
    #   HTML5 client
    #   screen capture
    #   H.264 encoding
    #   keyboard
    #   mouse
    #   gamepad
    #   WebRTC
    #
    # No VNC/noVNC.
    # ============================================================

    - name: Install Selkies
      shell: bash
      run: |
        set -e

        SELKIES_VERSION="$(
          curl -fsSL \
            "https://api.github.com/repos/selkies-project/selkies/releases/latest" \
            | jq -r '.tag_name' \
            | sed 's/^v//'
        )"

        echo "Selkies version: $SELKIES_VERSION"

        cd /tmp

        curl -fL \
          --retry 5 \
          --retry-all-errors \
          "https://github.com/selkies-project/selkies/releases/download/v${SELKIES_VERSION}/selkies-${SELKIES_VERSION}-py3-none-any.whl" \
          -o "selkies-${SELKIES_VERSION}.whl"

        sudo PIP_BREAK_SYSTEM_PACKAGES=1 \
          pip3 install \
          --no-cache-dir \
          --force-reinstall \
          "selkies-${SELKIES_VERSION}.whl"

        rm -f "selkies-${SELKIES_VERSION}.whl"

        selkies --help | head -60

    # ============================================================
    # 18. START SELKIES WEBRTC
    #
    # REQUIRED:
    #
    # SELKIES_PASSWORD
    #
    # OPTIONAL / HIGHLY RECOMMENDED:
    #
    # SELKIES_TURN_HOST
    # SELKIES_TURN_PORT
    # SELKIES_TURN_USERNAME
    # SELKIES_TURN_PASSWORD
    #
    # Without TURN, WebRTC may fail depending on GitHub runner
    # NAT/firewall conditions.
    # ============================================================

    - name: Start Selkies WebRTC
      shell: bash
      env:
        SELKIES_PASSWORD: ${{ secrets.SELKIES_PASSWORD }}

        SELKIES_TURN_HOST: ${{ secrets.SELKIES_TURN_HOST }}
        SELKIES_TURN_PORT: ${{ secrets.SELKIES_TURN_PORT }}
        SELKIES_TURN_USERNAME: ${{ secrets.SELKIES_TURN_USERNAME }}
        SELKIES_TURN_PASSWORD: ${{ secrets.SELKIES_TURN_PASSWORD }}
      run: |
        set -e

        if [ -z "$SELKIES_PASSWORD" ]; then
          echo "ERROR: SELKIES_PASSWORD secret is missing."
          exit 1
        fi

        export DISPLAY="$DISPLAY"

        export XDG_RUNTIME_DIR="/tmp/cloudcraft-runtime"
        export PULSE_RUNTIME_PATH="$XDG_RUNTIME_DIR/pulse"
        export PULSE_SERVER="unix:$PULSE_RUNTIME_PATH/native"

        SELKIES_ARGS=(
          "--addr=127.0.0.1"
          "--port=${SELKIES_PORT}"
          "--mode=webrtc"
          "--enable-https=false"
          "--enable-basic-auth=true"
          "--basic-auth-user=${SELKIES_USER}"
          "--basic-auth-password=${SELKIES_PASSWORD}"
          "--encoder-rtc=h264enc"
          "--enable-resize=true"
        )

        # --------------------------------------------------------
        # TURN configuration
        # --------------------------------------------------------

        if [ -n "$SELKIES_TURN_HOST" ]; then
          echo "TURN server configured."

          export SELKIES_TURN_HOST
          export SELKIES_TURN_PORT
          export SELKIES_TURN_USERNAME
          export SELKIES_TURN_PASSWORD

          # Selkies reads these environment variables for WebRTC
          # ICE configuration.
        else
          echo "WARNING:"
          echo "No TURN server configured."
          echo "WebRTC may fail if the GitHub runner NAT/firewall"
          echo "does not allow a direct ICE connection."
        fi

        nohup selkies \
          "${SELKIES_ARGS[@]}" \
          > "$CLOUDCRAFT_DIR/logs/selkies.log" 2>&1 &

        SELKIES_PID=$!

        echo "$SELKIES_PID" \
          > "$CLOUDCRAFT_DIR/selkies.pid"

        echo "Selkies PID: $SELKIES_PID"

        sleep 5

        if ! kill -0 "$SELKIES_PID" 2>/dev/null; then
          echo "ERROR: Selkies exited."
          cat "$CLOUDCRAFT_DIR/logs/selkies.log" || true
          exit 1
        fi

        echo "Selkies WebRTC is running."

    # ============================================================
    # 19. CHECK SELKIES LOCAL WEB SERVER
    # ============================================================

    - name: Verify Selkies
      shell: bash
      run: |
        set -e

        for i in $(seq 1 20); do
          if curl -fsS \
            "http://127.0.0.1:${SELKIES_PORT}/" \
            >/dev/null 2>&1; then

            echo "Selkies HTTP interface is ready."
            break
          fi

          sleep 1
        done

        curl -I \
          "http://127.0.0.1:${SELKIES_PORT}/" \
          || true

    # ============================================================
    # 20. CLOUDFLARE QUICK TUNNEL
    #
    # Quick Tunnel exposes ONLY Selkies' HTTP/signaling endpoint.
    #
    # WebRTC media itself is handled by ICE/TURN.
    # ============================================================

    - name: Install cloudflared
      shell: bash
      run: |
        set -e

        cd /tmp

        curl -fL \
          --retry 5 \
          --retry-all-errors \
          "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb" \
          -o cloudflared.deb

        sudo dpkg -i cloudflared.deb

        cloudflared --version

    # ============================================================
    # 21. START CLOUDFLARE QUICK TUNNEL
    # ============================================================

    - name: Start Cloudflare Quick Tunnel
      shell: bash
      run: |
        set -e

        mkdir -p "$CLOUDCRAFT_DIR/logs"

        rm -f \
          "$CLOUDCRAFT_DIR/cloudflare-url.txt"

        nohup cloudflared tunnel \
          --no-autoupdate \
          --url "http://127.0.0.1:${SELKIES_PORT}" \
          > "$CLOUDCRAFT_DIR/logs/cloudflared.log" 2>&1 &

        CLOUDFLARED_PID=$!

        echo "$CLOUDFLARED_PID" \
          > "$CLOUDCRAFT_DIR/cloudflared.pid"

        echo "cloudflared PID: $CLOUDFLARED_PID"

        echo "Waiting for Cloudflare Quick Tunnel..."

        for i in $(seq 1 60); do

          URL="$(
            grep -Eo \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$CLOUDCRAFT_DIR/logs/cloudflared.log" \
              | head -n 1 \
              || true
          )

          if [ -n "$URL" ]; then
            echo "$URL" \
              > "$CLOUDCRAFT_DIR/cloudflare-url.txt"

            echo
            echo "=========================================="
            echo "       CLOUDFLARE QUICK TUNNEL"
            echo "=========================================="
            echo
            echo "$URL"
            echo
            echo "=========================================="
            break
          fi

          sleep 2
        done

        if [ ! -s "$CLOUDCRAFT_DIR/cloudflare-url.txt" ]; then
          echo "ERROR: Cloudflare URL not found."
          echo
          cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"
          exit 1
        fi

    # ============================================================
    # 22. GITHUB ACTIONS SUMMARY
    # ============================================================

    - name: CloudCraft connection information
      shell: bash
      env:
        SELKIES_PASSWORD: ${{ secrets.SELKIES_PASSWORD }}
      run: |
        URL="$(cat "$CLOUDCRAFT_DIR/cloudflare-url.txt")"

        {
          echo "# 🚀 CloudCraft"
          echo
          echo "## Browser"
          echo
          echo "**CloudCraft URL:**"
          echo
          echo "$URL"
          echo
          echo "## Connection"
          echo
          echo "- Transport: **WebRTC**"
          echo "- Display: **Xvfb :99**"
          echo "- Streaming: **H.264**"
          echo "- Client: **TLauncher**"
          echo "- Minecraft: **manual launch**"
          echo "- Target: **Fabric 1.21.11**"
          echo
          echo "## Login"
          echo
          echo "Username: \`$SELKIES_USER\`"
          echo
          echo "Password: stored in GitHub Secret \`SELKIES_PASSWORD\`"
          echo
          echo "## Important"
          echo
          echo "Open the CloudCraft URL above."
          echo
          echo "Then use TLauncher normally."
          echo
          echo "Select Fabric 1.21.11 manually."
          echo
        } >> "$GITHUB_STEP_SUMMARY"

    # ============================================================
    # 23. SHOW IMPORTANT LOGS
    # ============================================================

    - name: Show CloudCraft logs
      shell: bash
      run: |
        echo "=== TLauncher ==="
        tail -n 50 \
          "$CLOUDCRAFT_DIR/logs/tlauncher.log" \
          || true

        echo
        echo "=== Selkies ==="
        tail -n 100 \
          "$CLOUDCRAFT_DIR/logs/selkies.log" \
          || true

        echo
        echo "=== Cloudflare ==="
        tail -n 50 \
          "$CLOUDCRAFT_DIR/logs/cloudflared.log" \
          || true

    # ============================================================
    # 24. KEEP CLOUDCRAFT ALIVE
    #
    # IMPORTANT:
    # This is deliberately manual.
    #
    # When you want to stop CloudCraft, cancel the workflow.
    #
    # We do NOT auto-launch Minecraft.
    # ============================================================

    - name: Keep CloudCraft alive
      shell: bash
      run: |
        set +e

        echo
        echo "=============================================="
        echo "          CLOUDCRAFT IS READY"
        echo "=============================================="
        echo

        echo "Browser URL:"
        cat "$CLOUDCRAFT_DIR/cloudflare-url.txt"

        echo
        echo "TLauncher is running."
        echo "Minecraft launch is MANUAL."
        echo
        echo "Use TLauncher -> Fabric 1.21.11."
        echo
        echo "The job will intentionally remain running."
        echo "Cancel the workflow when finished."
        echo

        while true; do

          echo
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] CloudCraft alive"

          if [ -f "$TLAUNCHER_DIR/app/TLauncher.jar" ]; then
            echo "TLauncher installation: OK"
          fi

          if pgrep -f 'TLauncher.jar' >/dev/null 2>&1; then
            echo "TLauncher: RUNNING"
          else
            echo "TLauncher: NOT RUNNING"
          fi

          if pgrep -f 'selkies' >/dev/null 2>&1; then
            echo "Selkies: RUNNING"
          else
            echo "Selkies: NOT RUNNING"
          fi

          if pgrep -f 'cloudflared.*tunnel' >/dev/null 2>&1; then
            echo "Cloudflare: RUNNING"
          else
            echo "Cloudflare: NOT RUNNING"
          fi

          sleep 60

        done

    # ============================================================
    # 25. FINAL MINIO BACKUP
    #
    # Runs when the job is cancelled/fails.
    #
    # IMPORTANT:
    # GitHub can terminate a job at its hard limit.
    # Therefore we keep timeout below the 6-hour ceiling.
    # ============================================================

    - name: Final MinIO backup
      if: always()
      shell: bash
      run: |
        set +e

        echo
        echo "=============================================="
        echo "          FINAL CLOUDCRAFT BACKUP"
        echo "=============================================="

        if ! command -v mc >/dev/null 2>&1; then
          echo "mc unavailable. Skipping backup."
          exit 0
        fi

        if [ ! -d "$HOME/.minecraft" ]; then
          echo "Minecraft directory does not exist."
        else
          echo "Backing up Minecraft..."

          mc mirror \
            "$HOME/.minecraft" \
            "$MINIO_ALIAS/$MINIO_BUCKET/minecraft" \
            --overwrite \
            --preserve \
            || true
        fi

        if [ ! -d "$HOME/.tlauncher" ]; then
          echo "TLauncher directory does not exist."
        else
          echo "Backing up TLauncher..."

          mc mirror \
            "$HOME/.tlauncher" \
            "$MINIO_ALIAS/$MINIO_BUCKET/tlauncher" \
            --overwrite \
            --preserve \
            || true
        fi

        echo
        echo "Backup completed."

    # ============================================================
    # 26. UPLOAD LOGS AS ARTIFACT
    # ============================================================

    - name: Upload CloudCraft logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cloudcraft-logs-${{ github.run_id }}
        path: |
          cloudcraft/logs/
        if-no-files-found: ignore
        retention-days: 1
