name: CloudCraft Minecraft Client

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DISPLAY: :99
  SCREEN_SIZE: 1280x720x24
  CLOUDCRAFT_DIR: ${{ github.workspace }}/cloudcraft
  MINIO_BUCKET: cloudcraft
  TLAUNCHER_URL: "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip"
  MINECRAFT_VERSION: "1.21.11"
  VNC_PORT: "5900"
  NOVNC_PORT: "6080"
  AWS_RETRY_MODE: standard
  AWS_MAX_ATTEMPTS: "10"
  AWS_S3_MAX_CONCURRENT_REQUESTS: "4"
  AWS_S3_MULTIPART_THRESHOLD: "64MB"
  AWS_S3_MULTIPART_CHUNKSIZE: "16MB"

jobs:
  cloudcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check system
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          echo "CPU: $(nproc)"
          free -h
          df -h
          lspci | grep -Ei 'vga|3d|display' || true

      - name: Install Java 21
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-21-jdk
          java -version

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11vnc fluxbox xterm mesa-utils \
            libgl1-mesa-dri libglx-mesa0 libglu1-mesa \
            libx11-6 libxext6 libxrender1 libxrandr2 libxi6 \
            libxfixes3 libxcursor1 libxinerama1 libxdamage1 \
            libxcomposite1 libxtst6 libxkbcommon0 libxkbcommon-x11-0 \
            libasound2t64 libpulse0 unzip zip curl wget git \
            ca-certificates python3 python3-venv jq openssl zstd tar

      - name: Prepare CloudCraft directories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CLOUDCRAFT_DIR"/{logs,state,tlauncher,novnc,tmp}
          touch "$CLOUDCRAFT_DIR/logs/"{xvfb,x11vnc,novnc,cloudflared,fluxbox,tlauncher,backup}.log

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner
          version: latest
          use-cache: true
          log-mode: normal

      - name: Verify Tailscale
        shell: bash
        run: |
          set -euxo pipefail
          tailscale status || true
          tailscale ip -4 || true

      - name: Check MinIO
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euxo pipefail
          curl --fail --silent --show-error --max-time 10 \
            "$MINIO_ENDPOINT/minio/health/live"
          echo "MinIO is reachable."

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euxo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi
          cd "$CLOUDCRAFT_DIR/tmp"
          rm -rf aws awscliv2.zip
          curl --fail --location --retry 5 --retry-delay 2 \
            -o awscliv2.zip \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Configure MinIO credentials
        shell: bash
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.aws"
          cat > "$HOME/.aws/credentials" <<EOF
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat > "$HOME/.aws/config" <<EOF
          [default]
          region=us-east-1
          EOF
          chmod 600 "$HOME/.aws/credentials"

      - name: Prepare MinIO bucket
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euxo pipefail
          aws s3api head-bucket --bucket "$MINIO_BUCKET" \
            --endpoint-url "$MINIO_ENDPOINT" >/dev/null 2>&1 || \
          aws s3api create-bucket --bucket "$MINIO_BUCKET" \
            --endpoint-url "$MINIO_ENDPOINT"

      - name: Restore latest CloudCraft snapshot
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.minecraft" "$HOME/.tlauncher"
          SNAPSHOT=""

          if aws s3 cp "s3://$MINIO_BUCKET/state/latest.txt" - \
            --endpoint-url "$MINIO_ENDPOINT" --only-show-errors \
            > "$CLOUDCRAFT_DIR/state/latest.txt" 2>/dev/null; then
            SNAPSHOT="$(tr -d '\r\n' < "$CLOUDCRAFT_DIR/state/latest.txt")"
          fi

          if [ -n "$SNAPSHOT" ] && aws s3api head-object \
            --bucket "$MINIO_BUCKET" \
            --key "backups/$SNAPSHOT/COMPLETE" \
            --endpoint-url "$MINIO_ENDPOINT" >/dev/null 2>&1; then
            echo "Restoring committed archive snapshot: $SNAPSHOT"
            aws s3 cp "s3://$MINIO_BUCKET/backups/$SNAPSHOT/minecraft.tar.zst" \
              "$CLOUDCRAFT_DIR/tmp/minecraft.tar.zst" \
              --endpoint-url "$MINIO_ENDPOINT" --only-show-errors
            aws s3 cp "s3://$MINIO_BUCKET/backups/$SNAPSHOT/tlauncher.tar.zst" \
              "$CLOUDCRAFT_DIR/tmp/tlauncher.tar.zst" \
              --endpoint-url "$MINIO_ENDPOINT" --only-show-errors

            rm -rf "$HOME/.minecraft" "$HOME/.tlauncher"
            mkdir -p "$HOME/.minecraft" "$HOME/.tlauncher"
            tar --zstd -xf "$CLOUDCRAFT_DIR/tmp/minecraft.tar.zst" -C "$HOME/.minecraft"
            tar --zstd -xf "$CLOUDCRAFT_DIR/tmp/tlauncher.tar.zst" -C "$HOME/.tlauncher"
            echo "Archive restore complete."
          else
            echo "No complete archive snapshot found; starting with existing/empty local state."
          fi

      - name: Start virtual display
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CLOUDCRAFT_DIR/logs"
          pkill Xvfb || true
          Xvfb "$DISPLAY" -screen 0 "$SCREEN_SIZE" -ac \
            +extension GLX +extension RANDR +extension RENDER -noreset \
            > "$CLOUDCRAFT_DIR/logs/xvfb.log" 2>&1 &
          XVFB_PID=$!
          echo "$XVFB_PID" > "$CLOUDCRAFT_DIR/xvfb.pid"
          sleep 3
          kill -0 "$XVFB_PID" 2>/dev/null || { cat "$CLOUDCRAFT_DIR/logs/xvfb.log"; exit 1; }
          xdpyinfo >/dev/null

      - name: Start Fluxbox
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          fluxbox > "$CLOUDCRAFT_DIR/logs/fluxbox.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/fluxbox.pid"
          sleep 2

      - name: Check OpenGL
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          glxinfo -B || true

      - name: Generate VNC password
        shell: bash
        run: |
          set -euo pipefail
          VNC_PASSWORD="$(openssl rand -hex 4)"
          printf '%s\n' "$VNC_PASSWORD" > "$CLOUDCRAFT_DIR/vnc-password.txt"
          chmod 600 "$CLOUDCRAFT_DIR/vnc-password.txt"
          x11vnc -storepasswd "$VNC_PASSWORD" "$CLOUDCRAFT_DIR/vnc-passwd"
          chmod 600 "$CLOUDCRAFT_DIR/vnc-passwd"
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "## CloudCraft VNC"
            echo "**VNC password:** \`$VNC_PASSWORD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start x11vnc
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          pkill x11vnc || true
          x11vnc -display "$DISPLAY" -rfbport "$VNC_PORT" \
            -rfbauth "$CLOUDCRAFT_DIR/vnc-passwd" \
            -forever -shared -repeat \
            -noxdamage -noxfixes -noxrecord -cursor arrow \
            -wait 2 -defer 2 -threads -localhost \
            > "$CLOUDCRAFT_DIR/logs/x11vnc.log" 2>&1 &
          X11VNC_PID=$!
          echo "$X11VNC_PID" > "$CLOUDCRAFT_DIR/x11vnc.pid"
          sleep 3
          kill -0 "$X11VNC_PID" 2>/dev/null || { cat "$CLOUDCRAFT_DIR/logs/x11vnc.log"; exit 1; }

      - name: Install noVNC
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$CLOUDCRAFT_DIR/novnc"
          git clone --depth 1 --branch v1.7.0 \
            https://github.com/novnc/noVNC.git "$CLOUDCRAFT_DIR/novnc"
          test -x "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy"

      - name: Start noVNC
        shell: bash
        run: |
          set -euxo pipefail
          pkill -f 'novnc_proxy.*6080' || true
          "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy" \
            --vnc 127.0.0.1:5900 --listen 127.0.0.1:6080 \
            > "$CLOUDCRAFT_DIR/logs/novnc.log" 2>&1 &
          NOVNC_PID=$!
          echo "$NOVNC_PID" > "$CLOUDCRAFT_DIR/novnc.pid"
          for i in {1..20}; do
            if curl --silent --fail --max-time 3 \
              http://127.0.0.1:6080/vnc.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$CLOUDCRAFT_DIR/logs/novnc.log"
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            -o "$CLOUDCRAFT_DIR/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x "$CLOUDCRAFT_DIR/cloudflared"
          "$CLOUDCRAFT_DIR/cloudflared" --version

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CLOUDCRAFT_DIR/cloudflare-url.txt"
          "$CLOUDCRAFT_DIR/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$CLOUDCRAFT_DIR/logs/cloudflared.log" 2>&1 &
          CLOUDFLARED_PID=$!
          echo "$CLOUDFLARED_PID" > "$CLOUDCRAFT_DIR/cloudflared.pid"
          TUNNEL_URL=""
          for i in {1..60}; do
            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"
              exit 1
            fi
            TUNNEL_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$CLOUDCRAFT_DIR/logs/cloudflared.log" | head -n 1 || true)"
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"
            exit 1
          fi
          printf '%s\n' "$TUNNEL_URL" > "$CLOUDCRAFT_DIR/cloudflare-url.txt"
          {
            echo "## CloudCraft Browser Access"
            echo "[OPEN CLOUDCRAFT]($TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0)"
            echo "**Direct URL:** $TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0"
            echo "**VNC password:** \`$VNC_PASSWORD\`"
            echo "- Tailscale tag: \`tag:cloudcraft-runner\`"
            echo "- Cloudflare Quick Tunnel: enabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download TLauncher v17
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CLOUDCRAFT_DIR/tlauncher"
          curl --fail --location --retry 5 --retry-delay 2 \
            -o TLauncher.v17.zip "$TLAUNCHER_URL"

      - name: Extract TLauncher
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CLOUDCRAFT_DIR/tlauncher"
          rm -rf extracted
          mkdir -p extracted
          unzip -o TLauncher.v17.zip -d extracted

      - name: Find TLauncher JAR
        shell: bash
        run: |
          set -euxo pipefail
          TLAUNCHER_JAR="$(find "$CLOUDCRAFT_DIR/tlauncher/extracted" \
            -type f -iname 'TLauncher.jar' | head -n 1)"
          [ -n "$TLAUNCHER_JAR" ] || { find "$CLOUDCRAFT_DIR/tlauncher/extracted" -type f; exit 1; }
          echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" >> "$GITHUB_ENV"

      - name: Launch TLauncher manually
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          export MESA_GLSL_VERSION_OVERRIDE=450
          mkdir -p "$HOME/.tlauncher" "$HOME/.minecraft"
          cd "$(dirname "$TLAUNCHER_JAR")"
          java -Dfile.encoding=UTF-8 -jar "$TLAUNCHER_JAR" \
            > "$CLOUDCRAFT_DIR/logs/tlauncher.log" 2>&1 &
          TLAUNCHER_PID=$!
          echo "$TLAUNCHER_PID" > "$CLOUDCRAFT_DIR/tlauncher.pid"
          sleep 10
          kill -0 "$TLAUNCHER_PID" 2>/dev/null || { cat "$CLOUDCRAFT_DIR/logs/tlauncher.log"; exit 1; }

      - name: Show TLauncher status
        shell: bash
        run: |
          set +e
          ps aux | grep -i tlauncher | grep -v grep || true
          tail -100 "$CLOUDCRAFT_DIR/logs/tlauncher.log" || true

      - name: Prepare archive-based MinIO backup
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euxo pipefail
          cat > "$CLOUDCRAFT_DIR/backup-once.sh" <<'BACKUP'
          #!/usr/bin/env bash
          set -euo pipefail

          BACKUP_ROOT="s3://$MINIO_BUCKET/backups"
          STATE_ROOT="s3://$MINIO_BUCKET/state"
          LOCK_FILE="$CLOUDCRAFT_DIR/backup.lock"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID:-manual}"
          PREFIX="$BACKUP_ROOT/$STAMP"
          TMP="$CLOUDCRAFT_DIR/tmp/backup-$STAMP"
          mkdir -p "$TMP"

          exec 9>"$LOCK_FILE"
          if ! flock -n 9; then
            echo "[$(date -u)] Backup already running; skipping."
            exit 0
          fi

          echo "[$(date -u)] Starting archive backup $STAMP"
          sync

          # IMPORTANT: Do not use aws s3 sync or ListObjectsV2 here.
          # The current MinIO instance returns InternalError/listPathRaw
          # for ListObjectsV2. We upload a small number of known objects.
          tar --zstd -cf "$TMP/minecraft.tar.zst" \
            --exclude='assets' \
            --exclude='assets/*' \
            --exclude='logs' \
            --exclude='logs/*' \
            --exclude='crash-reports' \
            --exclude='crash-reports/*' \
            -C "$HOME/.minecraft" .

          tar --zstd -cf "$TMP/tlauncher.tar.zst" \
            --exclude='logs' \
            --exclude='logs/*' \
            --exclude='temp' \
            --exclude='temp/*' \
            --exclude='cache' \
            --exclude='cache/*' \
            -C "$HOME/.tlauncher" .

          upload() {
            local file="$1"
            local key="$2"
            local attempt
            for attempt in 1 2 3 4; do
              echo "Upload attempt $attempt: $key"
              if aws s3 cp "$file" "$PREFIX/$key" \
                --endpoint-url "$MINIO_ENDPOINT" --only-show-errors; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            echo "Upload failed: $key"
            return 1
          }

          upload "$TMP/minecraft.tar.zst" minecraft.tar.zst
          upload "$TMP/tlauncher.tar.zst" tlauncher.tar.zst

          printf '%s\n' "$STAMP" > "$TMP/COMPLETE"
          upload "$TMP/COMPLETE" COMPLETE

          # Read the previous pointer directly. No bucket listing required.
          OLD_LATEST=""
          OLD_PREVIOUS=""
          if aws s3 cp "$STATE_ROOT/latest.txt" - \
            --endpoint-url "$MINIO_ENDPOINT" --only-show-errors \
            > "$TMP/old-latest.txt" 2>/dev/null; then
            OLD_LATEST="$(tr -d '\r\n' < "$TMP/old-latest.txt")"
          fi
          if aws s3 cp "$STATE_ROOT/previous.txt" - \
            --endpoint-url "$MINIO_ENDPOINT" --only-show-errors \
            > "$TMP/old-previous.txt" 2>/dev/null; then
            OLD_PREVIOUS="$(tr -d '\r\n' < "$TMP/old-previous.txt")"
          fi

          printf '%s\n' "$STAMP" > "$TMP/latest.txt"
          upload "$TMP/latest.txt" "state/latest.txt"

          if [ -n "$OLD_LATEST" ]; then
            printf '%s\n' "$OLD_LATEST" > "$TMP/previous.txt"
            upload "$TMP/previous.txt" "state/previous.txt"
          fi

          # Keep at most two snapshots. Delete exact known objects instead
          # of `aws s3 rm --recursive`, which would require ListObjectsV2.
          if [ -n "$OLD_PREVIOUS" ] && [ "$OLD_PREVIOUS" != "$STAMP" ] && [ "$OLD_PREVIOUS" != "$OLD_LATEST" ]; then
            for key in minecraft.tar.zst tlauncher.tar.zst COMPLETE; do
              aws s3 rm "$BACKUP_ROOT/$OLD_PREVIOUS/$key" \
                --endpoint-url "$MINIO_ENDPOINT" --only-show-errors || true
            done
          fi

          rm -rf "$TMP"
          echo "[$(date -u)] Backup $STAMP committed successfully."
          BACKUP
          chmod +x "$CLOUDCRAFT_DIR/backup-once.sh"

      - name: Run initial MinIO backup
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euo pipefail
          "$CLOUDCRAFT_DIR/backup-once.sh" >> "$CLOUDCRAFT_DIR/logs/backup.log" 2>&1
          tail -100 "$CLOUDCRAFT_DIR/logs/backup.log" || true

      - name: Start periodic MinIO backup loop
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euo pipefail
          cat > "$CLOUDCRAFT_DIR/backup-loop.sh" <<'LOOP'
          #!/usr/bin/env bash
          set -u
          while true; do
            sleep 300
            {
              echo "===== CloudCraft periodic backup $(date -u) ====="
              "$CLOUDCRAFT_DIR/backup-once.sh"
            } >> "$CLOUDCRAFT_DIR/logs/backup.log" 2>&1 || true
          done
          LOOP
          chmod +x "$CLOUDCRAFT_DIR/backup-loop.sh"
          nohup "$CLOUDCRAFT_DIR/backup-loop.sh" >/dev/null 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/backup.pid"
          echo "Periodic backup loop started. First backup was already completed."

      - name: CloudCraft ready
        shell: bash
        run: |
          set -euo pipefail
          TUNNEL_URL="$(cat "$CLOUDCRAFT_DIR/cloudflare-url.txt")"
          {
            echo "# CloudCraft is READY"
            echo "## Browser"
            echo "[OPEN CLOUDCRAFT]($TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0)"
            echo ""
            echo "**Direct URL:** $TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0"
            echo "**VNC password:** \`$VNC_PASSWORD\`"
            echo ""
            echo "- Tailscale tag: \`tag:cloudcraft-runner\`"
            echo "- Cloudflare Quick Tunnel: enabled"
            echo "- Persistence: archive-based MinIO snapshots"
            echo "- Minecraft assets cache: excluded from backup"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep CloudCraft alive
        shell: bash
        run: |
          set -u
          while true; do
            sleep 300
            echo "===== CloudCraft heartbeat $(date -u) ====="
            ps -eo pid,etime,cmd | grep -E 'java|TLauncher|Xvfb|x11vnc|novnc|cloudflared' | grep -v grep || true
            free -h
            df -h /
            tail -20 "$CLOUDCRAFT_DIR/logs/backup.log" || true
          done
