name: CloudCraft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  cloudcraft:
    name: CloudCraft Minecraft Runtime
    runs-on: ubuntu-latest

    # GitHub-hosted runner maximum is limited by GitHub.
    # Keep this below the hard runner limit so periodic backups have time to run.
    timeout-minutes: 330

    env:

      # ============================================================
      # CloudCraft
      # ============================================================

      CLOUDCRAFT_DIR: ${{ github.workspace }}/cloudcraft

      # Minecraft
      MC_VERSION: "1.21.11"

      # TLauncher
      TLAUNCHER_URL: "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip"

      # Virtual display
      DISPLAY: ":99"

      # Browser VNC
      NOVNC_PORT: "6080"

      # VNC
      VNC_PORT: "5900"

      # MinIO
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}

      # Tailscale
      TS_TAG: "tag:cloudcraft-runner"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout CloudCraft
        uses: actions/checkout@v4


      # ============================================================
      # 2. SYSTEM INFORMATION
      # ============================================================

      - name: Check runner
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CloudCraft Runner"
          echo "========================================"

          uname -a
          echo

          echo "CPU:"
          nproc
          lscpu | grep -E "Model name|CPU\(s\)" || true

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "OS:"
          cat /etc/os-release


      # ============================================================
      # 3. INSTALL JAVA 21
      #
      # IMPORTANT:
      # No cache: gradle
      #
      # We are NOT building a Gradle project.
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java
        shell: bash
        run: |
          set -e

          java -version
          javac -version


      # ============================================================
      # 4. INSTALL GUI / X11 / VNC DEPENDENCIES
      # ============================================================

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb \
            x11vnc \
            x11-utils \
            xdotool \
            xauth \
            x11-xserver-utils \
            fluxbox \
            openbox \
            mesa-utils \
            libgl1-mesa-dri \
            libgl1-mesa-glx \
            libglu1-mesa \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libnss3 \
            libasound2t64 \
            libpulse0 \
            unzip \
            zip \
            curl \
            wget \
            jq \
            openssl \
            python3 \
            python3-pip \
            git \
            procps \
            psmisc \
            net-tools

          echo
          echo "GUI dependencies installed."


      # ============================================================
      # 5. CREATE CLOUDCRAFT DIRECTORY
      # ============================================================

      - name: Prepare CloudCraft directory
        shell: bash
        run: |
          set -e

          mkdir -p "$CLOUDCRAFT_DIR"

          mkdir -p "$CLOUDCRAFT_DIR/minecraft"
          mkdir -p "$CLOUDCRAFT_DIR/tlauncher"
          mkdir -p "$CLOUDCRAFT_DIR/backups"
          mkdir -p "$CLOUDCRAFT_DIR/logs"
          mkdir -p "$CLOUDCRAFT_DIR/novnc"

          echo "CloudCraft directory:"
          find "$CLOUDCRAFT_DIR" -maxdepth 2 -type d


      # ============================================================
      # 6. INSTALL AWS CLI
      #
      # Used for MinIO because MinIO implements the S3 API.
      #
      # We DO NOT use apt install awscli because Ubuntu runner
      # repositories can lack the package / have old versions.
      # ============================================================

      - name: Install AWS CLI
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -rf aws awscliv2.zip

          curl -fsSL \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o awscliv2.zip

          unzip -q awscliv2.zip

          if command -v aws >/dev/null 2>&1; then
            sudo ./aws/install --update
          else
            sudo ./aws/install
          fi

          aws --version


      # ============================================================
      # 7. CONFIGURE S3 / MINIO
      # ============================================================

      - name: Configure MinIO
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e

          mkdir -p "$HOME/.aws"

          cat > "$HOME/.aws/config" <<EOF
          [default]
          region = us-east-1
          s3 =
              endpoint_url = ${MINIO_ENDPOINT}
          EOF

          chmod 600 "$HOME/.aws/config"

          echo "Testing MinIO..."

          aws s3 ls \
            --endpoint-url "$MINIO_ENDPOINT"

          echo "MinIO connection OK."


      # ============================================================
      # 8. RESTORE CLOUDCRAFT DATA
      #
      # Bucket structure:
      #
      # cloudcraft/
      #   minecraft/
      #   tlauncher/
      #   config/
      #
      # ============================================================

      - name: Restore CloudCraft from MinIO
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set +e

          echo "========================================"
          echo "Restoring CloudCraft data"
          echo "========================================"

          mkdir -p "$CLOUDCRAFT_DIR/minecraft"
          mkdir -p "$CLOUDCRAFT_DIR/tlauncher"

          aws s3 sync \
            "s3://${MINIO_BUCKET}/minecraft/" \
            "$CLOUDCRAFT_DIR/minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          aws s3 sync \
            "s3://${MINIO_BUCKET}/tlauncher/" \
            "$CLOUDCRAFT_DIR/tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          echo
          echo "Restore finished."

          du -sh "$CLOUDCRAFT_DIR/minecraft" || true
          du -sh "$CLOUDCRAFT_DIR/tlauncher" || true


      # ============================================================
      # 9. TAILSCALE
      #
      # Uses:
      # tag:cloudcraft-runner
      #
      # Secrets:
      # TS_OAUTH_CLIENT_ID
      # TS_OAUTH_SECRET
      # ============================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner

      - name: Check Tailscale
        shell: bash
        run: |
          set -e

          tailscale status || true
          tailscale ip -4 || true


      # ============================================================
      # 10. START Xvfb
      # ============================================================

      - name: Start virtual display
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          pkill Xvfb || true

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +extension RANDR \
            +extension RENDER \
            -noreset \
            > "$CLOUDCRAFT_DIR/logs/xvfb.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/xvfb.pid"

          sleep 3

          if ! kill -0 "$(cat "$CLOUDCRAFT_DIR/xvfb.pid")" 2>/dev/null; then
            echo "Xvfb failed."
            cat "$CLOUDCRAFT_DIR/logs/xvfb.log"
            exit 1
          fi

          echo "Xvfb running."


      # ============================================================
      # 11. START WINDOW MANAGER
      # ============================================================

      - name: Start window manager
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          fluxbox \
            > "$CLOUDCRAFT_DIR/logs/fluxbox.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/fluxbox.pid"

          sleep 2

          echo "Window manager started."


      # ============================================================
      # 12. CHECK DISPLAY
      # ============================================================

      - name: Check virtual display
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          xdpyinfo >/dev/null

          echo "Virtual display is working."


      # ============================================================
      # 13. CHECK OPENGL
      #
      # GitHub runner has no physical GPU available to the workflow,
      # so Mesa/llvmpipe is expected.
      # ============================================================

      - name: Check OpenGL
        shell: bash
        run: |
          set +e

          export DISPLAY=:99

          glxinfo -B || true


      # ============================================================
      # 14. DOWNLOAD TLAUNCHER
      # ============================================================

      - name: Download TLauncher v17
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -f TLauncher.zip

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "$TLAUNCHER_URL" \
            -o TLauncher.zip

          file TLauncher.zip

          unzip -t TLauncher.zip >/dev/null

          echo "TLauncher archive is valid."


      # ============================================================
      # 15. EXTRACT TLAUNCHER
      # ============================================================

      - name: Extract TLauncher
        shell: bash
        run: |
          set -e

          rm -rf "$CLOUDCRAFT_DIR/tlauncher-runtime"

          mkdir -p "$CLOUDCRAFT_DIR/tlauncher-runtime"

          unzip -q \
            "$RUNNER_TEMP/TLauncher.zip" \
            -d "$CLOUDCRAFT_DIR/tlauncher-runtime"

          echo "TLauncher files:"
          find "$CLOUDCRAFT_DIR/tlauncher-runtime" \
            -maxdepth 3 \
            -type f \
            | head -100


      # ============================================================
      # 16. FIND TLAUNCHER JAR
      # ============================================================

      - name: Find TLauncher JAR
        shell: bash
        run: |
          set -e

          TLAUNCHER_JAR="$(
            find "$CLOUDCRAFT_DIR/tlauncher-runtime" \
              -type f \
              -iname "TLauncher.jar" \
              -print -quit
          )"

          if [ -z "$TLAUNCHER_JAR" ]; then
            echo "TLauncher.jar not found."
            find "$CLOUDCRAFT_DIR/tlauncher-runtime" -type f
            exit 1
          fi

          echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" \
            >> "$GITHUB_ENV"

          echo "TLauncher:"
          echo "$TLAUNCHER_JAR"


      # ============================================================
      # 17. START TLAUNCHER
      #
      # IMPORTANT:
      #
      # TLauncher itself is used as the Minecraft launcher.
      #
      # We do NOT use the external Fabric installer.
      #
      # In TLauncher GUI:
      #
      #   Version:
      #   Fabric 1.21.11
      #
      # ============================================================

      - name: Start TLauncher
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          cd "$(dirname "$TLAUNCHER_JAR")"

          echo "Starting TLauncher..."

          java \
            -Xms512M \
            -Xmx2G \
            -Dfile.encoding=UTF-8 \
            -jar "$TLAUNCHER_JAR" \
            > "$CLOUDCRAFT_DIR/logs/tlauncher.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/tlauncher.pid"

          sleep 8

          if ! kill -0 "$(cat "$CLOUDCRAFT_DIR/tlauncher.pid")" 2>/dev/null; then
            echo "TLauncher exited."

            tail -200 \
              "$CLOUDCRAFT_DIR/logs/tlauncher.log"

            exit 1
          fi

          echo "TLauncher is running."


      # ============================================================
      # 18. START VNC SERVER
      #
      # IMPORTANT:
      #
      # No "-encodings tight"
      #
      # That option caused the previous x11vnc 0.9.16 failure.
      # ============================================================

      - name: Generate VNC password
        shell: bash
        run: |
          set -e

          VNC_PASSWORD_FILE="$CLOUDCRAFT_DIR/vnc-password.txt"

          # Generate a random 8-character password.
          #
          # x11vnc classic password authentication uses only
          # the first 8 characters.
          #
          VNC_PASSWORD="$(
            openssl rand -base64 32 |
            tr -dc 'A-Za-z0-9' |
            head -c 8
          )"

          if [ "${#VNC_PASSWORD}" -lt 8 ]; then
            echo "Failed to generate VNC password."
            exit 1
          fi

          printf '%s' "$VNC_PASSWORD" \
            > "$CLOUDCRAFT_DIR/vnc-password-plain.txt"

          chmod 600 \
            "$CLOUDCRAFT_DIR/vnc-password-plain.txt"

          x11vnc \
            -storepasswd \
            "$VNC_PASSWORD" \
            "$VNC_PASSWORD_FILE" \
            >/dev/null

          chmod 600 "$VNC_PASSWORD_FILE"

          echo "::add-mask::$VNC_PASSWORD"

          echo "CLOUDCRAFT_VNC_PASSWORD=$VNC_PASSWORD" \
            >> "$GITHUB_ENV"

          echo "VNC password generated."


      - name: Start x11vnc
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -rfbport 5900 \
            -rfbauth "$CLOUDCRAFT_DIR/vnc-password.txt" \
            -forever \
            -shared \
            -noxdamage \
            -noxrecord \
            -noxfixes \
            -cursor arrow \
            -repeat \
            -wait 5 \
            -defer 5 \
            -threads \
            > "$CLOUDCRAFT_DIR/logs/x11vnc.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/x11vnc.pid"

          sleep 3

          if ! kill -0 "$(cat "$CLOUDCRAFT_DIR/x11vnc.pid")" 2>/dev/null; then
            echo "x11vnc failed."

            cat "$CLOUDCRAFT_DIR/logs/x11vnc.log"

            exit 1
          fi

          echo "x11vnc running on port 5900."


      # ============================================================
      # 19. INSTALL noVNC
      # ============================================================

      - name: Install noVNC
        shell: bash
        run: |
          set -e

          rm -rf "$CLOUDCRAFT_DIR/novnc"

          git clone \
            --depth 1 \
            https://github.com/novnc/noVNC.git \
            "$CLOUDCRAFT_DIR/novnc"

          cd "$CLOUDCRAFT_DIR/novnc"

          git clone \
            --depth 1 \
            https://github.com/novnc/websockify.git \
            utils/websockify

          chmod +x \
            utils/novnc_proxy

          chmod +x \
            utils/websockify/run

          echo "noVNC installed."


      # ============================================================
      # 20. START noVNC
      # ============================================================

      - name: Start noVNC
        shell: bash
        run: |
          set -e

          cd "$CLOUDCRAFT_DIR/novnc"

          ./utils/novnc_proxy \
            --vnc localhost:5900 \
            --listen 0.0.0.0:6080 \
            > "$CLOUDCRAFT_DIR/logs/novnc.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/novnc.pid"

          sleep 4

          if ! curl -fsS \
            "http://127.0.0.1:6080/" \
            >/dev/null; then

            echo "noVNC failed."

            cat "$CLOUDCRAFT_DIR/logs/novnc.log"

            exit 1
          fi

          echo "noVNC running on port 6080."


      # ============================================================
      # 21. INSTALL CLOUDFLARE CLOUDFLARED
      # ============================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -e

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64)
              CF_ARCH="amd64"
              ;;
            arm64)
              CF_ARCH="arm64"
              ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          curl -L \
            --fail \
            --retry 5 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CF_ARCH}" \
            -o "$RUNNER_TEMP/cloudflared"

          chmod +x "$RUNNER_TEMP/cloudflared"

          sudo mv \
            "$RUNNER_TEMP/cloudflared" \
            /usr/local/bin/cloudflared

          cloudflared version


      # ============================================================
      # 22. START CLOUDFLARE QUICK TUNNEL
      #
      # Cloudflare:
      #
      # browser
      #    ?
      # trycloudflare.com
      #    ?
      # cloudflared
      #    ?
      # localhost:6080
      #    ?
      # noVNC
      #    ?
      # websockify
      #    ?
      # x11vnc
      #    ?
      # Xvfb
      #    ?
      # TLauncher / Minecraft
      #
      # ============================================================

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -e

          cloudflared \
            tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$CLOUDCRAFT_DIR/logs/cloudflared.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/cloudflared.pid"

          echo "Waiting for Cloudflare tunnel..."

          for i in {1..30}; do

            URL="$(
              grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              "$CLOUDCRAFT_DIR/logs/cloudflared.log" \
              | head -1 \
              || true
            )"

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2

          done

          if [ -z "$URL" ]; then
            echo "Cloudflare Quick Tunnel URL not found."

            cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"

            exit 1
          fi

          echo "CLOUDCRAFT_URL=$URL" \
            >> "$GITHUB_ENV"

          echo "CloudCraft URL:"
          echo "$URL"


      # ============================================================
      # 23. DISPLAY CONNECTION INFORMATION
      # ============================================================

      - name: CloudCraft connection information
        shell: bash
        run: |
          echo
          echo "===================================================="
          echo "                 CLOUDCRAFT ONLINE"
          echo "===================================================="
          echo
          echo "Browser:"
          echo "$CLOUDCRAFT_URL"
          echo
          echo "VNC password:"
          echo "$CLOUDCRAFT_VNC_PASSWORD"
          echo
          echo "Minecraft:"
          echo "Fabric 1.21.11"
          echo
          echo "TLauncher:"
          echo "Running"
          echo
          echo "Tailscale:"
          echo "$TS_TAG"
          echo
          echo "===================================================="
          echo
          echo "::notice title=CloudCraft URL::$CLOUDCRAFT_URL"
          echo "::notice title=CloudCraft VNC Password::$CLOUDCRAFT_VNC_PASSWORD"


      # ============================================================
      # 24. INITIAL BACKUP
      # ============================================================

      - name: Initial CloudCraft backup
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set +e

          echo "Performing initial backup..."

          aws s3 sync \
            "$CLOUDCRAFT_DIR/minecraft/" \
            "s3://${MINIO_BUCKET}/minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          aws s3 sync \
            "$CLOUDCRAFT_DIR/tlauncher/" \
            "s3://${MINIO_BUCKET}/tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          echo "Initial backup finished."


      # ============================================================
      # 25. PERIODIC BACKUP
      #
      # This is IMPORTANT.
      #
      # GitHub Actions runner is temporary.
      #
      # Instead of waiting until the final minute, data is uploaded
      # every few minutes.
      #
      # Therefore if the runner suddenly disappears, most recent
      # progress is already in MinIO.
      # ============================================================

      - name: Start automatic MinIO backup
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e

          BACKUP_SCRIPT="$CLOUDCRAFT_DIR/auto-backup.sh"

          cat > "$BACKUP_SCRIPT" <<'EOF'
          #!/usr/bin/env bash

          while true; do

            echo "[$(date -Is)] Automatic backup started."

            aws s3 sync \
              "$CLOUDCRAFT_DIR/minecraft/" \
              "s3://${MINIO_BUCKET}/minecraft/" \
              --endpoint-url "$MINIO_ENDPOINT" \
              --only-show-errors \
              || true

            aws s3 sync \
              "$CLOUDCRAFT_DIR/tlauncher/" \
              "s3://${MINIO_BUCKET}/tlauncher/" \
              --endpoint-url "$MINIO_ENDPOINT" \
              --only-show-errors \
              || true

            echo "[$(date -Is)] Automatic backup finished."

            sleep 300

          done
          EOF

          chmod +x "$BACKUP_SCRIPT"

          nohup "$BACKUP_SCRIPT" \
            > "$CLOUDCRAFT_DIR/logs/auto-backup.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/auto-backup.pid"

          echo "Automatic backup started."


      # ============================================================
      # 26. KEEP RUNNER ALIVE
      #
      # GitHub Actions is not a normal permanent server.
      #
      # We intentionally keep this workflow alive while Minecraft
      # is running.
      #
      # Periodic backup keeps the state safe in MinIO.
      # ============================================================

      - name: CloudCraft runtime
        shell: bash
        run: |
          set +e

          echo
          echo "===================================================="
          echo "             CLOUDCRAFT RUNTIME STARTED"
          echo "===================================================="
          echo
          echo "URL:"
          echo "$CLOUDCRAFT_URL"
          echo
          echo "VNC password:"
          echo "$CLOUDCRAFT_VNC_PASSWORD"
          echo
          echo "Minecraft:"
          echo "Fabric 1.21.11"
          echo
          echo "Automatic MinIO backup:"
          echo "Every 5 minutes"
          echo
          echo "===================================================="
          echo

          while true; do

            echo
            echo "[$(date -Is)] CloudCraft status"

            if [ -f "$CLOUDCRAFT_DIR/tlauncher.pid" ]; then
              if kill -0 \
                "$(cat "$CLOUDCRAFT_DIR/tlauncher.pid")" \
                2>/dev/null; then

                echo "TLauncher: RUNNING"

              else

                echo "TLauncher: STOPPED"

              fi
            fi

            if [ -f "$CLOUDCRAFT_DIR/x11vnc.pid" ]; then
              if kill -0 \
                "$(cat "$CLOUDCRAFT_DIR/x11vnc.pid")" \
                2>/dev/null; then

                echo "x11vnc: RUNNING"

              else

                echo "x11vnc: STOPPED"

              fi
            fi

            if [ -f "$CLOUDCRAFT_DIR/novnc.pid" ]; then
              if kill -0 \
                "$(cat "$CLOUDCRAFT_DIR/novnc.pid")" \
                2>/dev/null; then

                echo "noVNC: RUNNING"

              else

                echo "noVNC: STOPPED"

              fi
            fi

            echo
            echo "CloudCraft URL:"
            echo "$CLOUDCRAFT_URL"

            echo
            echo "Waiting..."

            sleep 60

          done


      # ============================================================
      # 27. FINAL BACKUP
      #
      # Runs when the previous step exits/fails/cancelled as long
      # as GitHub gets enough time to execute post-job steps.
      # ============================================================

      - name: Final CloudCraft backup
        if: always()
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set +e

          echo "Stopping automatic backup..."

          if [ -f "$CLOUDCRAFT_DIR/auto-backup.pid" ]; then
            kill "$(cat "$CLOUDCRAFT_DIR/auto-backup.pid")" \
              2>/dev/null || true
          fi

          echo "Performing final MinIO backup..."

          aws s3 sync \
            "$CLOUDCRAFT_DIR/minecraft/" \
            "s3://${MINIO_BUCKET}/minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors \
            || true

          aws s3 sync \
            "$CLOUDCRAFT_DIR/tlauncher/" \
            "s3://${MINIO_BUCKET}/tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors \
            || true

          echo "Final backup finished."


      # ============================================================
      # 28. UPLOAD LOGS
      # ============================================================

      - name: Upload CloudCraft logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcraft-logs
          path: |
            ${{ github.workspace }}/cloudcraft/logs/
          if-no-files-found: ignore
          retention-days: 3
