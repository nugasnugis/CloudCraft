name: CloudCraft Minecraft Client

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DISPLAY: :99
  SCREEN_SIZE: 1280x720x24

  CLOUDCRAFT_DIR: ${{ github.workspace }}/cloudcraft
  MINIO_BUCKET: cloudcraft

  # TLauncher v17
  TLAUNCHER_URL: "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip"

  # Minecraft
  MINECRAFT_VERSION: "1.21.11"

  # VNC / noVNC
  VNC_PORT: "5900"
  NOVNC_PORT: "6080"

jobs:

  cloudcraft:

    runs-on: ubuntu-latest

    timeout-minutes: 355

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================

    - name: Checkout repository
      uses: actions/checkout@v4


    # ============================================================
    # 2. BASIC SYSTEM INFO
    # ============================================================

    - name: Check system
      shell: bash
      run: |
        set -euxo pipefail

        echo "===== SYSTEM ====="
        uname -a

        echo
        echo "===== CPU ====="
        nproc
        lscpu | grep -E 'Model name|CPU\(s\)|Thread'

        echo
        echo "===== MEMORY ====="
        free -h

        echo
        echo "===== DISK ====="
        df -h

        echo
        echo "===== GPU ====="
        lspci | grep -Ei 'vga|3d|display' || true


    # ============================================================
    # 3. INSTALL JAVA 21
    #
    # IMPORTANT:
    # Do NOT use actions/setup-java cache here.
    # Earlier this caused:
    #
    # "No file in ... matched ... gradle..."
    #
    # because setup-java was trying to find Gradle files.
    # ============================================================

    - name: Install Java 21
      shell: bash
      run: |
        set -euxo pipefail

        sudo apt-get update

        sudo apt-get install -y \
          openjdk-21-jdk

        echo "JAVA_HOME=$JAVA_HOME"

        java -version


    # ============================================================
    # 4. INSTALL GUI / X11 / MESA
    #
    # IMPORTANT:
    # Ubuntu 24.04 no longer uses libgl1-mesa-glx.
    #
    # We intentionally use:
    #   libgl1-mesa-dri
    #   libglx-mesa0
    #   mesa-utils
    #
    # instead.
    # ============================================================

    - name: Install GUI dependencies
      shell: bash
      run: |
        set -euxo pipefail

        sudo apt-get update

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          xvfb \
          x11vnc \
          fluxbox \
          xterm \
          mesa-utils \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libglu1-mesa \
          libx11-6 \
          libxext6 \
          libxrender1 \
          libxrandr2 \
          libxi6 \
          libxfixes3 \
          libxcursor1 \
          libxinerama1 \
          libxdamage1 \
          libxcomposite1 \
          libxtst6 \
          libxkbcommon0 \
          libxkbcommon-x11-0 \
          libasound2t64 \
          libpulse0 \
          unzip \
          zip \
          curl \
          wget \
          git \
          ca-certificates \
          python3 \
          python3-venv \
          jq

        echo "GUI dependencies installed."


    # ============================================================
    # 5. CREATE CLOUDCRAFT DIRECTORIES
    # ============================================================

    - name: Prepare CloudCraft directories
      shell: bash
      run: |
        set -euxo pipefail

        mkdir -p "$CLOUDCRAFT_DIR"

        mkdir -p "$CLOUDCRAFT_DIR/logs"

        mkdir -p "$CLOUDCRAFT_DIR/state"

        mkdir -p "$CLOUDCRAFT_DIR/tlauncher"

        mkdir -p "$CLOUDCRAFT_DIR/novnc"

        mkdir -p "$CLOUDCRAFT_DIR/tmp"

        touch "$CLOUDCRAFT_DIR/logs/xvfb.log"
        touch "$CLOUDCRAFT_DIR/logs/x11vnc.log"
        touch "$CLOUDCRAFT_DIR/logs/novnc.log"
        touch "$CLOUDCRAFT_DIR/logs/cloudflared.log"

        echo "Directories ready."


    # ============================================================
    # 6. TAILSCALE
    #
    # GitHub runner becomes:
    #
    # tag:cloudcraft-runner
    #
    # This allows the runner to reach the Raspberry Pi / MinIO
    # privately without exposing MinIO to the public internet.
    #
    # OAuth client needs:
    #   Keys -> Auth Keys -> Write
    #
    # and tag:
    #   tag:cloudcraft-runner
    #
    # ============================================================

    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:cloudcraft-runner
        version: latest
        use-cache: true
        log-mode: normal


    # ============================================================
    # 7. VERIFY TAILSCALE
    # ============================================================

    - name: Verify Tailscale
      shell: bash
      run: |
        set -euxo pipefail

        echo "===== TAILSCALE STATUS ====="

        tailscale status || true

        echo
        echo "===== TAILSCALE IP ====="

        tailscale ip -4 || true


    # ============================================================
    # 8. CHECK MINIO
    #
    # Required GitHub Secrets:
    #
    # MINIO_ENDPOINT
    # MINIO_ACCESS_KEY
    # MINIO_SECRET_KEY
    #
    # Example endpoint:
    #
    # http://100.x.x.x:9000
    #
    # where 100.x.x.x is Raspberry Pi Tailscale IP.
    # ============================================================

    - name: Check MinIO
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
        MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      run: |
        set -euxo pipefail

        echo "Checking MinIO..."

        curl \
          --fail \
          --silent \
          --show-error \
          --max-time 10 \
          "$MINIO_ENDPOINT/minio/health/live"

        echo

        echo "MinIO is reachable."


    # ============================================================
    # 9. INSTALL AWS CLI
    #
    # Used for S3-compatible MinIO storage.
    #
    # We do NOT apt install awscli because GitHub Ubuntu images
    # may not have a usable candidate.
    # ============================================================

    - name: Install AWS CLI
      shell: bash
      run: |
        set -euxo pipefail

        if command -v aws >/dev/null 2>&1; then
          echo "AWS CLI already installed."
          aws --version
          exit 0
        fi

        cd "$CLOUDCRAFT_DIR/tmp"

        rm -rf aws awscliv2.zip

        curl \
          --fail \
          --location \
          --retry 5 \
          --retry-delay 2 \
          -o awscliv2.zip \
          "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"

        unzip -q awscliv2.zip

        sudo ./aws/install --update

        aws --version


    # ============================================================
    # 10. CONFIGURE AWS CLI FOR MINIO
    # ============================================================

    - name: Configure MinIO credentials
      shell: bash
      env:
        MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
        MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      run: |
        set -euxo pipefail

        mkdir -p "$HOME/.aws"

        cat > "$HOME/.aws/credentials" <<EOF
        [default]
        aws_access_key_id=${MINIO_ACCESS_KEY}
        aws_secret_access_key=${MINIO_SECRET_KEY}
        EOF

        cat > "$HOME/.aws/config" <<EOF
        [default]
        region=us-east-1
        EOF

        chmod 600 "$HOME/.aws/credentials"

        echo "AWS credentials configured."


    # ============================================================
    # 11. CREATE MINIO BUCKET IF NEEDED
    # ============================================================

    - name: Prepare MinIO bucket
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      run: |
        set -euxo pipefail

        aws s3api head-bucket \
          --bucket "$MINIO_BUCKET" \
          --endpoint-url "$MINIO_ENDPOINT" \
          >/dev/null 2>&1 \
        || \
        aws s3api create-bucket \
          --bucket "$MINIO_BUCKET" \
          --endpoint-url "$MINIO_ENDPOINT"

        echo "MinIO bucket ready."


    # ============================================================
    # 12. RESTORE PREVIOUS CLOUDCRAFT DATA
    #
    # This restores:
    #
    # .minecraft
    # .tlauncher
    #
    # from Raspberry Pi / MinIO.
    # ============================================================

    - name: Restore CloudCraft data
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      run: |
        set -euxo pipefail

        mkdir -p "$HOME/.minecraft"
        mkdir -p "$HOME/.tlauncher"

        echo "Restoring Minecraft data..."

        aws s3 sync \
          "s3://$MINIO_BUCKET/minecraft/" \
          "$HOME/.minecraft/" \
          --endpoint-url "$MINIO_ENDPOINT" \
          --no-progress \
          || true

        echo "Restoring TLauncher data..."

        aws s3 sync \
          "s3://$MINIO_BUCKET/tlauncher/" \
          "$HOME/.tlauncher/" \
          --endpoint-url "$MINIO_ENDPOINT" \
          --no-progress \
          || true

        echo
        echo "Restore complete."

        echo "Minecraft files:"
        find "$HOME/.minecraft" -maxdepth 2 -type f 2>/dev/null | head -50 || true

        echo
        echo "TLauncher files:"
        find "$HOME/.tlauncher" -maxdepth 2 -type f 2>/dev/null | head -50 || true


    # ============================================================
    # 13. START Xvfb
    # ============================================================

    - name: Start virtual display
      shell: bash
      run: |
        set -euxo pipefail

        mkdir -p "$CLOUDCRAFT_DIR/logs"

        pkill Xvfb || true

        Xvfb "$DISPLAY" \
          -screen 0 "$SCREEN_SIZE" \
          -ac \
          +extension GLX \
          +extension RANDR \
          +extension RENDER \
          -noreset \
          > "$CLOUDCRAFT_DIR/logs/xvfb.log" 2>&1 &

        XVFB_PID=$!

        echo "$XVFB_PID" > "$CLOUDCRAFT_DIR/xvfb.pid"

        echo "Xvfb PID: $XVFB_PID"

        sleep 3

        if ! kill -0 "$XVFB_PID" 2>/dev/null; then
          echo "Xvfb failed to start."
          cat "$CLOUDCRAFT_DIR/logs/xvfb.log"
          exit 1
        fi

        echo "Virtual display started."


    # ============================================================
    # 14. VERIFY DISPLAY
    # ============================================================

    - name: Verify virtual display
      shell: bash
      run: |
        set -euxo pipefail

        export DISPLAY=:99

        xdpyinfo >/dev/null

        echo "Virtual display is working."


    # ============================================================
    # 15. START FLUXBOX
    #
    # Lightweight window manager.
    # ============================================================

    - name: Start Fluxbox
      shell: bash
      run: |
        set -euxo pipefail

        export DISPLAY=:99

        fluxbox \
          > "$CLOUDCRAFT_DIR/logs/fluxbox.log" 2>&1 &

        echo $! > "$CLOUDCRAFT_DIR/fluxbox.pid"

        sleep 2

        echo "Fluxbox started."


    # ============================================================
    # 16. CHECK OPENGL
    #
    # Mesa llvmpipe is expected because GitHub-hosted runners
    # generally do not provide a physical GPU.
    # ============================================================

    - name: Check OpenGL
      shell: bash
      run: |
        set -euxo pipefail

        export DISPLAY=:99

        export LIBGL_ALWAYS_SOFTWARE=1

        glxinfo -B || true


    # ============================================================
    # 17. GENERATE VNC PASSWORD
    #
    # x11vnc only uses the first 8 characters of a traditional
    # VNC password.
    #
    # We therefore generate exactly 8 safe characters.
    # ============================================================

    - name: Generate VNC password
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "$CLOUDCRAFT_DIR"

        VNC_PASSWORD="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 8 || true)"

        if [ "${#VNC_PASSWORD}" -ne 8 ]; then
          VNC_PASSWORD="$(openssl rand -hex 4)"
        fi

        printf '%s\n' "$VNC_PASSWORD" > "$CLOUDCRAFT_DIR/vnc-password.txt"

        chmod 600 "$CLOUDCRAFT_DIR/vnc-password.txt"

        x11vnc -storepasswd \
          "$VNC_PASSWORD" \
          "$CLOUDCRAFT_DIR/vnc-passwd"

        chmod 600 "$CLOUDCRAFT_DIR/vnc-passwd"

        echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

        {
          echo ""
          echo "## ? CloudCraft VNC"
          echo ""
          echo "**VNC password:** \`$VNC_PASSWORD\`"
          echo ""
          echo "Password is exactly 8 characters."
        } >> "$GITHUB_STEP_SUMMARY"


    # ============================================================
    # 18. START X11VNC
    #
    # IMPORTANT:
    #
    # We intentionally DO NOT use:
    #
    #   -encodings tight
    #
    # because x11vnc 0.9.16 on the runner rejected that syntax.
    #
    # Tight is already negotiated by VNC clients.
    # ============================================================

    - name: Start x11vnc
      shell: bash
      run: |
        set -euxo pipefail

        export DISPLAY=:99

        pkill x11vnc || true

        x11vnc \
          -display "$DISPLAY" \
          -rfbport "$VNC_PORT" \
          -rfbauth "$CLOUDCRAFT_DIR/vnc-passwd" \
          -forever \
          -shared \
          -repeat \
          -noxdamage \
          -noxfixes \
          -noxrecord \
          -cursor arrow \
          -wait 2 \
          -defer 2 \
          -threads \
          -localhost \
          > "$CLOUDCRAFT_DIR/logs/x11vnc.log" 2>&1 &

        X11VNC_PID=$!

        echo "$X11VNC_PID" > "$CLOUDCRAFT_DIR/x11vnc.pid"

        sleep 3

        if ! kill -0 "$X11VNC_PID" 2>/dev/null; then
          echo "x11vnc failed to start."
          cat "$CLOUDCRAFT_DIR/logs/x11vnc.log"
          exit 1
        fi

        echo "x11vnc started."

        ss -lntp | grep ":$VNC_PORT" || true


    # ============================================================
    # 19. INSTALL noVNC
    #
    # noVNC is browser-side VNC.
    #
    # We clone the official repository and use its included
    # novnc_proxy.
    #
    # This avoids the previous "novnc_proxy: command not found"
    # problem.
    # ============================================================

    - name: Install noVNC
      shell: bash
      run: |
        set -euxo pipefail

        rm -rf "$CLOUDCRAFT_DIR/novnc"

        git clone \
          --depth 1 \
          --branch v1.7.0 \
          https://github.com/novnc/noVNC.git \
          "$CLOUDCRAFT_DIR/novnc"

        test -x "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy"

        echo "noVNC installed."

        "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy" --help | head -40 || true


    # ============================================================
    # 20. START noVNC
    #
    # Listen only on localhost.
    #
    # Cloudflare will expose port 6080.
    # ============================================================

    - name: Start noVNC
      shell: bash
      run: |
        set -euxo pipefail

        export DISPLAY=:99

        pkill -f "novnc_proxy.*6080" || true

        "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy" \
          --vnc 127.0.0.1:5900 \
          --listen 127.0.0.1:6080 \
          > "$CLOUDCRAFT_DIR/logs/novnc.log" 2>&1 &

        NOVNC_PID=$!

        echo "$NOVNC_PID" > "$CLOUDCRAFT_DIR/novnc.pid"

        sleep 5

        if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
          echo "noVNC failed to start."
          cat "$CLOUDCRAFT_DIR/logs/novnc.log"
          exit 1
        fi

        echo "noVNC started."

        ss -lntp | grep ":6080" || true


    # ============================================================
    # 21. VERIFY noVNC HTTP
    # ============================================================

    - name: Verify noVNC
      shell: bash
      run: |
        set -euxo pipefail

        for i in {1..20}; do

          if curl \
            --silent \
            --fail \
            --max-time 3 \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null
          then
            echo "noVNC is responding."
            exit 0
          fi

          sleep 1

        done

        echo "noVNC did not respond."

        cat "$CLOUDCRAFT_DIR/logs/novnc.log"

        exit 1


    # ============================================================
    # 22. DOWNLOAD CLOUDFLARED
    # ============================================================

    - name: Install cloudflared
      shell: bash
      run: |
        set -euxo pipefail

        CLOUDflared="$CLOUDCRAFT_DIR/cloudflared"

        curl \
          --fail \
          --location \
          --retry 5 \
          --retry-delay 2 \
          -o "$CLOUDflared" \
          "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"

        chmod +x "$CLOUDflared"

        "$CLOUDflared" --version


    # ============================================================
    # 23. START CLOUDFLARE QUICK TUNNEL
    #
    # Cloudflare officially supports:
    #
    # cloudflared tunnel --url http://localhost:8080
    #
    # It generates a random:
    #
    # https://xxxx.trycloudflare.com
    #
    # ============================================================

    - name: Start Cloudflare Quick Tunnel
      shell: bash
      run: |
        set -euo pipefail

        rm -f "$CLOUDCRAFT_DIR/cloudflare-url.txt"

        "$CLOUDCRAFT_DIR/cloudflared" \
          tunnel \
          --no-autoupdate \
          --url http://127.0.0.1:6080 \
          > "$CLOUDCRAFT_DIR/logs/cloudflared.log" 2>&1 &

        CLOUDFLARED_PID=$!

        echo "$CLOUDFLARED_PID" > "$CLOUDCRAFT_DIR/cloudflared.pid"

        echo "Waiting for Cloudflare Quick Tunnel..."

        TUNNEL_URL=""

        for i in {1..60}; do

          if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
            echo "cloudflared exited unexpectedly."
            cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"
            exit 1
          fi

          TUNNEL_URL="$(
            grep -Eo \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$CLOUDCRAFT_DIR/logs/cloudflared.log" \
              | head -n 1 \
              || true
          )"

          if [ -n "$TUNNEL_URL" ]; then
            break
          fi

          sleep 2

        done

        if [ -z "$TUNNEL_URL" ]; then

          echo "Cloudflare Quick Tunnel URL was not found."

          echo
          echo "===== CLOUDFLARED LOG ====="

          cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"

          exit 1
        fi

        echo "$TUNNEL_URL" > "$CLOUDCRAFT_DIR/cloudflare-url.txt"

        echo
        echo "======================================"
        echo " CLOUDCRAFT WEB URL"
        echo "======================================"
        echo
        echo "$TUNNEL_URL"
        echo

        {
          echo ""
          echo "## ? CloudCraft Browser Access"
          echo ""
          echo "### ? Open Minecraft"
          echo ""
          echo "[$TUNNEL_URL]($TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0)"
          echo ""
          echo "**Direct URL:** $TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0"
          echo ""
          echo "### ? VNC password"
          echo ""
          echo "\`$VNC_PASSWORD\`"
          echo ""
          echo "### ?? Display"
          echo ""
          echo "- Resolution: $SCREEN_SIZE"
          echo "- VNC: localhost:$VNC_PORT"
          echo "- noVNC: localhost:$NOVNC_PORT"
          echo "- Cloudflare Quick Tunnel: enabled"
          echo "- Tailscale tag: \`tag:cloudcraft-runner\`"
          echo ""
          echo "> Keep this workflow running while using CloudCraft."
        } >> "$GITHUB_STEP_SUMMARY"


    # ============================================================
    # 24. DOWNLOAD TLAUNCHER V17
    # ============================================================

    - name: Download TLauncher v17
      shell: bash
      run: |
        set -euxo pipefail

        cd "$CLOUDCRAFT_DIR/tlauncher"

        rm -f TLauncher.v17.zip

        curl \
          --fail \
          --location \
          --retry 5 \
          --retry-delay 2 \
          -o TLauncher.v17.zip \
          "$TLAUNCHER_URL"

        ls -lh TLauncher.v17.zip


    # ============================================================
    # 25. EXTRACT TLAUNCHER
    # ============================================================

    - name: Extract TLauncher
      shell: bash
      run: |
        set -euxo pipefail

        cd "$CLOUDCRAFT_DIR/tlauncher"

        rm -rf extracted

        mkdir -p extracted

        unzip -o \
          TLauncher.v17.zip \
          -d extracted

        echo "===== TLauncher files ====="

        find extracted \
          -maxdepth 3 \
          -type f \
          -print


    # ============================================================
    # 26. FIND TLAUNCHER JAR
    # ============================================================

    - name: Find TLauncher JAR
      shell: bash
      run: |
        set -euxo pipefail

        TLAUNCHER_JAR="$(
          find "$CLOUDCRAFT_DIR/tlauncher/extracted" \
            -type f \
            -iname 'TLauncher.jar' \
            | head -n 1
        )"

        if [ -z "$TLAUNCHER_JAR" ]; then
          echo "TLauncher.jar not found."

          find "$CLOUDCRAFT_DIR/tlauncher/extracted" \
            -type f \
            -print

          exit 1
        fi

        echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" >> "$GITHUB_ENV"

        echo "Found:"
        echo "$TLAUNCHER_JAR"


    # ============================================================
    # 27. LAUNCH TLAUNCHER
    #
    # TLauncher is started as a normal GUI application.
    #
    # Minecraft version / Fabric profile can be selected from
    # TLauncher's own interface.
    #
    # We do not bypass authentication.
    # ============================================================

    - name: Launch TLauncher
      shell: bash
      run: |
        set -euxo pipefail

        export DISPLAY=:99

        export LIBGL_ALWAYS_SOFTWARE=1

        export MESA_GL_VERSION_OVERRIDE=4.5

        export MESA_GLSL_VERSION_OVERRIDE=450

        mkdir -p "$HOME/.tlauncher"
        mkdir -p "$HOME/.minecraft"

        echo "Launching TLauncher..."

        cd "$(dirname "$TLAUNCHER_JAR")"

        java \
          -Dfile.encoding=UTF-8 \
          -jar "$TLAUNCHER_JAR" \
          > "$CLOUDCRAFT_DIR/logs/tlauncher.log" 2>&1 &

        TLAUNCHER_PID=$!

        echo "$TLAUNCHER_PID" > "$CLOUDCRAFT_DIR/tlauncher.pid"

        echo "TLauncher PID: $TLAUNCHER_PID"

        sleep 10

        if ! kill -0 "$TLAUNCHER_PID" 2>/dev/null; then

          echo "TLauncher exited."

          cat "$CLOUDCRAFT_DIR/logs/tlauncher.log"

          exit 1

        fi

        echo "TLauncher is running."


    # ============================================================
    # 28. SHOW TLAUNCHER LOG
    # ============================================================

    - name: Show TLauncher status
      shell: bash
      run: |
        set +e

        echo "===== TLauncher process ====="

        ps aux | grep -i tlauncher | grep -v grep || true

        echo
        echo "===== TLauncher log ====="

        tail -100 \
          "$CLOUDCRAFT_DIR/logs/tlauncher.log" \
          || true


    # ============================================================
    # 29. START PERIODIC MINIO BACKUP
    #
    # Every 5 minutes:
    #
    # .minecraft
    # .tlauncher
    #
    # gets synchronized to MinIO.
    #
    # This is intentionally best-effort.
    # ============================================================

    - name: Start MinIO backup loop
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      run: |
        set -euo pipefail

        cat > "$CLOUDCRAFT_DIR/backup-loop.sh" <<'BACKUP'
        #!/usr/bin/env bash

        set -euo pipefail

        while true; do

          echo
          echo "======================================"
          echo "CloudCraft periodic backup"
          echo "$(date)"
          echo "======================================"

          aws s3 sync \
            "$HOME/.minecraft/" \
            "s3://cloudcraft/minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --no-progress \
            || true

          aws s3 sync \
            "$HOME/.tlauncher/" \
            "s3://cloudcraft/tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --no-progress \
            || true

          echo "Backup completed."

          sleep 300

        done
        BACKUP

        chmod +x "$CLOUDCRAFT_DIR/backup-loop.sh"

        export MINIO_ENDPOINT="$MINIO_ENDPOINT"

        nohup "$CLOUDCRAFT_DIR/backup-loop.sh" \
          > "$CLOUDCRAFT_DIR/logs/backup.log" 2>&1 &

        BACKUP_PID=$!

        echo "$BACKUP_PID" > "$CLOUDCRAFT_DIR/backup.pid"

        echo "Backup loop PID: $BACKUP_PID"


    # ============================================================
    # 30. FINAL SUMMARY
    # ============================================================

    - name: CloudCraft ready
      shell: bash
      run: |
        set -euo pipefail

        TUNNEL_URL="$(cat "$CLOUDCRAFT_DIR/cloudflare-url.txt")"

        {
          echo ""
          echo "# ?? CloudCraft is READY"
          echo ""
          echo "## ? Browser"
          echo ""
          echo "### [? OPEN CLOUDCRAFT](<$TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0>)"
          echo ""
          echo "## ? VNC Password"
          echo ""
          echo "\`$VNC_PASSWORD\`"
          echo ""
          echo "## ?? Connection"
          echo ""
          echo "| Component | Status |"
          echo "|---|---|"
          echo "| Xvfb | ? |"
          echo "| Fluxbox | ? |"
          echo "| OpenGL / Mesa | ? |"
          echo "| x11vnc | ? |"
          echo "| noVNC | ? |"
          echo "| Cloudflare QT | ? |"
          echo "| Tailscale | ? |"
          echo "| MinIO | ? |"
          echo "| TLauncher | ? |"
          echo ""
          echo "## ? Latency settings"
          echo ""
          echo "- Resolution: 1280ï¿½720"
          echo "- Local VNC binding"
          echo "- noVNC WebSocket"
          echo "- Cloudflare edge tunnel"
          echo "- Software OpenGL via Mesa/llvmpipe"
          echo ""
          echo "## ? Minecraft"
          echo ""
          echo "Use TLauncher to select Minecraft **1.21.11 + Fabric**."
          echo ""
          echo "> The Minecraft client itself is running natively on the GitHub Actions Linux runner; the browser is only displaying/controling the remote desktop."
        } >> "$GITHUB_STEP_SUMMARY"


    # ============================================================
    # 31. KEEP RUNNER ALIVE
    #
    # GitHub Actions must continue running or the VM disappears.
    #
    # The workflow therefore waits here.
    # ============================================================

    - name: Keep CloudCraft alive
      shell: bash
      run: |
        set -euo pipefail

        echo
        echo "======================================"
        echo "?? CLOUDCRAFT IS RUNNING"
        echo "======================================"
        echo

        echo "Browser:"
        cat "$CLOUDCRAFT_DIR/cloudflare-url.txt"

        echo
        echo "VNC password:"
        echo "$VNC_PASSWORD"

        echo
        echo "Minecraft client is running on the GitHub Actions runner."
        echo "Use the Cloudflare URL above."

        echo
        echo "The runner will remain alive until:"
        echo "1. You cancel the workflow"
        echo "2. GitHub Actions reaches the job time limit"
        echo "3. The runner encounters a fatal error"

        echo

        while true; do

          echo
          echo "===== $(date) ====="

          echo "Processes:"
          ps -eo pid,comm,%cpu,%mem \
            | grep -E 'java|Xvfb|x11vnc|cloudflared' \
            | grep -v grep \
            || true

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h "$HOME"

          echo
          echo "Backup log:"
          tail -5 "$CLOUDCRAFT_DIR/logs/backup.log" \
            2>/dev/null \
            || true

          sleep 60

        done


    # ============================================================
    # 32. FINAL BACKUP
    #
    # This normally runs if the job is stopped gracefully.
    # Periodic backups are still the primary protection.
    # ============================================================

    - name: Final MinIO backup
      if: always()
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      run: |
        set +e

        echo "Starting final backup..."

        aws s3 sync \
          "$HOME/.minecraft/" \
          "s3://cloudcraft/minecraft/" \
          --endpoint-url "$MINIO_ENDPOINT" \
          --no-progress

        aws s3 sync \
          "$HOME/.tlauncher/" \
          "s3://cloudcraft/tlauncher/" \
          --endpoint-url "$MINIO_ENDPOINT" \
          --no-progress

        echo "Final backup complete."


    # ============================================================
    # 33. DEBUG LOGS
    # ============================================================

    - name: Show CloudCraft logs
      if: always()
      shell: bash
      run: |
        set +e

        echo "===== Xvfb ====="
        cat "$CLOUDCRAFT_DIR/logs/xvfb.log" || true

        echo
        echo "===== x11vnc ====="
        tail -100 "$CLOUDCRAFT_DIR/logs/x11vnc.log" || true

        echo
        echo "===== noVNC ====="
        tail -100 "$CLOUDCRAFT_DIR/logs/novnc.log" || true

        echo
        echo "===== Cloudflare ====="
        tail -100 "$CLOUDCRAFT_DIR/logs/cloudflared.log" || true

        echo
        echo "===== TLauncher ====="
        tail -100 "$CLOUDCRAFT_DIR/logs/tlauncher.log" || true

        echo
        echo "===== Backup ====="
        tail -100 "$CLOUDCRAFT_DIR/logs/backup.log" || tr
