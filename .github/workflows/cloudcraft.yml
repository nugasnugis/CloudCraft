name: CloudCraft Minecraft Client

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DISPLAY: :99
  SCREEN_SIZE: 1280x720x24
  CLOUDCRAFT_DIR: ${{ github.workspace }}/cloudcraft
  MINIO_BUCKET: cloudcraft
  TLAUNCHER_URL: "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip"
  MINECRAFT_VERSION: "1.21.11"
  VNC_PORT: "5900"
  NOVNC_PORT: "6080"
  AWS_MAX_ATTEMPTS: "4"

jobs:
  cloudcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check system
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          echo "CPU: $(nproc)"
          free -h
          df -h

      - name: Install Java 21
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-21-jdk
          java -version

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11vnc fluxbox xterm mesa-utils \
            libgl1-mesa-dri libglx-mesa0 libglu1-mesa \
            libx11-6 libxext6 libxrender1 libxrandr2 libxi6 \
            libxfixes3 libxcursor1 libxinerama1 libxdamage1 \
            libxcomposite1 libxtst6 libxkbcommon0 libxkbcommon-x11-0 \
            libasound2t64 libpulse0 unzip zip curl wget git \
            ca-certificates jq openssl zstd tar

      - name: Prepare CloudCraft directories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CLOUDCRAFT_DIR"/{logs,state,tlauncher,novnc,tmp}
          touch "$CLOUDCRAFT_DIR/logs/"{xvfb,x11vnc,novnc,cloudflared,fluxbox,tlauncher,backup}.log

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner
          version: latest
          use-cache: true

      - name: Verify Tailscale
        shell: bash
        run: |
          set -euxo pipefail
          tailscale status || true
          tailscale ip -4 || true

      - name: Check MinIO
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euxo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "$MINIO_ENDPOINT/minio/health/live"
          echo "MinIO is reachable."

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euxo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi
          cd "$CLOUDCRAFT_DIR/tmp"
          curl --fail --location --retry 5 --retry-delay 2 \
            -o awscliv2.zip \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
          rm -rf aws
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Configure MinIO credentials
        shell: bash
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.aws"
          cat > "$HOME/.aws/credentials" <<EOF
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat > "$HOME/.aws/config" <<EOF
          [default]
          region=us-east-1
          EOF
          chmod 600 "$HOME/.aws/credentials"

      - name: Prepare MinIO bucket
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euxo pipefail
          if ! aws s3api head-bucket --bucket "$MINIO_BUCKET" \
            --endpoint-url "$MINIO_ENDPOINT" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket "$MINIO_BUCKET" \
              --endpoint-url "$MINIO_ENDPOINT"
          fi

      - name: Restore latest CloudCraft snapshot
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.minecraft" "$HOME/.tlauncher"
          SNAPSHOT=""

          if aws s3api get-object \
            --bucket "$MINIO_BUCKET" \
            --key state/latest.txt \
            --endpoint-url "$MINIO_ENDPOINT" \
            "$CLOUDCRAFT_DIR/state/latest.txt" >/dev/null 2>&1; then
            SNAPSHOT="$(tr -d '\r\n' < "$CLOUDCRAFT_DIR/state/latest.txt")"
          fi

          if [ -n "$SNAPSHOT" ] && aws s3api head-object \
            --bucket "$MINIO_BUCKET" \
            --key "backups/$SNAPSHOT/COMPLETE" \
            --endpoint-url "$MINIO_ENDPOINT" >/dev/null 2>&1; then
            echo "Restoring committed snapshot: $SNAPSHOT"
            aws s3api get-object \
              --bucket "$MINIO_BUCKET" \
              --key "backups/$SNAPSHOT/minecraft.tar.zst" \
              --endpoint-url "$MINIO_ENDPOINT" \
              "$CLOUDCRAFT_DIR/tmp/minecraft.tar.zst" >/dev/null
            aws s3api get-object \
              --bucket "$MINIO_BUCKET" \
              --key "backups/$SNAPSHOT/tlauncher.tar.zst" \
              --endpoint-url "$MINIO_ENDPOINT" \
              "$CLOUDCRAFT_DIR/tmp/tlauncher.tar.zst" >/dev/null
            rm -rf "$HOME/.minecraft" "$HOME/.tlauncher"
            mkdir -p "$HOME/.minecraft" "$HOME/.tlauncher"
            tar --zstd -xf "$CLOUDCRAFT_DIR/tmp/minecraft.tar.zst" -C "$HOME/.minecraft"
            tar --zstd -xf "$CLOUDCRAFT_DIR/tmp/tlauncher.tar.zst" -C "$HOME/.tlauncher"
            echo "Snapshot restore complete."
          else
            echo "No committed snapshot found; starting with local/empty state."
          fi

      - name: Start virtual display
        shell: bash
        run: |
          set -euxo pipefail
          pkill Xvfb || true
          Xvfb "$DISPLAY" -screen 0 "$SCREEN_SIZE" -ac \
            +extension GLX +extension RANDR +extension RENDER -noreset \
            > "$CLOUDCRAFT_DIR/logs/xvfb.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/xvfb.pid"
          sleep 3
          kill -0 "$(cat "$CLOUDCRAFT_DIR/xvfb.pid")" 2>/dev/null
          xdpyinfo >/dev/null

      - name: Start Fluxbox
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          fluxbox > "$CLOUDCRAFT_DIR/logs/fluxbox.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/fluxbox.pid"
          sleep 2

      - name: Check OpenGL
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          glxinfo -B || true

      - name: Generate VNC password
        shell: bash
        run: |
          set -euo pipefail
          VNC_PASSWORD="$(openssl rand -hex 4)"
          printf '%s\n' "$VNC_PASSWORD" > "$CLOUDCRAFT_DIR/vnc-password.txt"
          chmod 600 "$CLOUDCRAFT_DIR/vnc-password.txt"
          x11vnc -storepasswd "$VNC_PASSWORD" "$CLOUDCRAFT_DIR/vnc-passwd" >/dev/null
          chmod 600 "$CLOUDCRAFT_DIR/vnc-passwd"
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "## CloudCraft VNC"
            echo "**VNC password:** \`$VNC_PASSWORD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start x11vnc
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          pkill x11vnc || true
          x11vnc -display "$DISPLAY" -rfbport "$VNC_PORT" \
            -rfbauth "$CLOUDCRAFT_DIR/vnc-passwd" \
            -forever -shared -repeat \
            -noxdamage -noxfixes -noxrecord -cursor arrow \
            -wait 2 -defer 2 -threads -localhost \
            > "$CLOUDCRAFT_DIR/logs/x11vnc.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/x11vnc.pid"
          sleep 3
          kill -0 "$(cat "$CLOUDCRAFT_DIR/x11vnc.pid")" 2>/dev/null || {
            cat "$CLOUDCRAFT_DIR/logs/x11vnc.log"
            exit 1
          }

      - name: Install noVNC
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$CLOUDCRAFT_DIR/novnc"
          git clone --depth 1 --branch v1.7.0 \
            https://github.com/novnc/noVNC.git "$CLOUDCRAFT_DIR/novnc"
          test -x "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy"

      - name: Start noVNC
        shell: bash
        run: |
          set -euxo pipefail
          "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy" \
            --vnc 127.0.0.1:5900 --listen 127.0.0.1:6080 \
            > "$CLOUDCRAFT_DIR/logs/novnc.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/novnc.pid"
          for i in {1..20}; do
            if curl --silent --fail --max-time 3 \
              http://127.0.0.1:6080/vnc.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$CLOUDCRAFT_DIR/logs/novnc.log"
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            -o "$CLOUDCRAFT_DIR/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x "$CLOUDCRAFT_DIR/cloudflared"
          "$CLOUDCRAFT_DIR/cloudflared" --version

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CLOUDCRAFT_DIR/cloudflare-url.txt"
          "$CLOUDCRAFT_DIR/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$CLOUDCRAFT_DIR/logs/cloudflared.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/cloudflared.pid"
          TUNNEL_URL=""
          for i in {1..60}; do
            PID="$(cat "$CLOUDCRAFT_DIR/cloudflared.pid")"
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"
              exit 1
            fi
            TUNNEL_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$CLOUDCRAFT_DIR/logs/cloudflared.log" | head -n 1 || true)"
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"
            exit 1
          fi
          printf '%s\n' "$TUNNEL_URL" > "$CLOUDCRAFT_DIR/cloudflare-url.txt"
          {
            echo "## CloudCraft Browser Access"
            echo "[OPEN CLOUDCRAFT]($TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0)"
            echo "**Direct URL:** $TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0"
            echo "**VNC password:** \`$VNC_PASSWORD\`"
            echo "- Tailscale tag: \`tag:cloudcraft-runner\`"
            echo "- Cloudflare Quick Tunnel: enabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download TLauncher v17
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CLOUDCRAFT_DIR/tlauncher"
          curl --fail --location --retry 5 --retry-delay 2 \
            -o TLauncher.v17.zip "$TLAUNCHER_URL"
          rm -rf extracted
          mkdir -p extracted
          unzip -o TLauncher.v17.zip -d extracted

      - name: Find TLauncher JAR
        shell: bash
        run: |
          set -euxo pipefail
          TLAUNCHER_JAR="$(find "$CLOUDCRAFT_DIR/tlauncher/extracted" \
            -type f -iname 'TLauncher.jar' | head -n 1)"
          [ -n "$TLAUNCHER_JAR" ] || exit 1
          echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" >> "$GITHUB_ENV"

      - name: Launch TLauncher manually
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          export MESA_GLSL_VERSION_OVERRIDE=450
          mkdir -p "$HOME/.tlauncher" "$HOME/.minecraft"
          cd "$(dirname "$TLAUNCHER_JAR")"
          java -Dfile.encoding=UTF-8 -jar "$TLAUNCHER_JAR" \
            > "$CLOUDCRAFT_DIR/logs/tlauncher.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/tlauncher.pid"
          sleep 10
          kill -0 "$(cat "$CLOUDCRAFT_DIR/tlauncher.pid")" 2>/dev/null || {
            cat "$CLOUDCRAFT_DIR/logs/tlauncher.log"
            exit 1
          }

      - name: Show TLauncher status
        shell: bash
        run: |
          set +e
          ps aux | grep -i tlauncher | grep -v grep || true
          tail -100 "$CLOUDCRAFT_DIR/logs/tlauncher.log" || true

      - name: Prepare archive backup script
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euxo pipefail
          cat > "$CLOUDCRAFT_DIR/backup-once.sh" <<'BACKUP'
          #!/usr/bin/env bash
          set -u

          BACKUP_ROOT="s3://$MINIO_BUCKET/backups"
          STATE_ROOT="s3://$MINIO_BUCKET/state"
          LOCK_FILE="$CLOUDCRAFT_DIR/backup.lock"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID:-manual}"
          PREFIX="$BACKUP_ROOT/$STAMP"
          TMP="$CLOUDCRAFT_DIR/tmp/backup-$STAMP"
          mkdir -p "$TMP"

          exec 9>"$LOCK_FILE"
          if ! flock -n 9; then
            echo "[$(date -u)] Backup already running; skipping."
            exit 0
          fi

          echo "[$(date -u)] Starting archive backup $STAMP"
          sync

          make_archive() {
            local source="$1"
            local output="$2"
            shift 2
            echo "Creating $output from $source"
            set +e
            tar --zstd -cf "$output" "$@" -C "$source" .
            local rc=$?
            set -e
            if [ "$rc" -gt 1 ]; then
              echo "tar failed for $output with exit code $rc"
              return "$rc"
            fi
            if [ "$rc" -eq 1 ]; then
              echo "tar reported files changing during backup; archive kept."
            fi
            test -s "$output"
            ls -lh "$output"
          }

          make_archive "$HOME/.minecraft" "$TMP/minecraft.tar.zst" \
            --exclude='./assets' \
            --exclude='./assets/*' \
            --exclude='./logs' \
            --exclude='./logs/*' \
            --exclude='./crash-reports' \
            --exclude='./crash-reports/*' \
            --warning=no-file-changed \
            --warning=no-file-removed

          make_archive "$HOME/.tlauncher" "$TMP/tlauncher.tar.zst" \
            --exclude='./logs' \
            --exclude='./logs/*' \
            --exclude='./temp' \
            --exclude='./temp/*' \
            --exclude='./cache' \
            --exclude='./cache/*' \
            --warning=no-file-changed \
            --warning=no-file-removed

          put_object() {
            local file="$1"
            local key="$2"
            local size
            size="$(stat -c '%s' "$file")"
            echo "PUT $key ($(numfmt --to=iec "$size"))"
            if [ "$size" -ge 5368709120 ]; then
              echo "ERROR: $key is >= 5 GiB; single PutObject is not supported."
              return 1
            fi
            local attempt
            for attempt in 1 2 3 4; do
              if aws s3api put-object \
                --bucket "$MINIO_BUCKET" \
                --key "${PREFIX#s3://$MINIO_BUCKET/}/$key" \
                --body "$file" \
                --content-length "$size" \
                --endpoint-url "$MINIO_ENDPOINT" \
                --no-cli-pager >/dev/null; then
                echo "PUT OK: $key"
                return 0
              fi
              echo "PUT failed for $key; retry $attempt/4"
              sleep $((attempt * 5))
            done
            echo "PUT FAILED: $key"
            return 1
          }

          put_object "$TMP/minecraft.tar.zst" minecraft.tar.zst || exit 1
          put_object "$TMP/tlauncher.tar.zst" tlauncher.tar.zst || exit 1

          printf '%s\n' "$STAMP" > "$TMP/COMPLETE"
          put_object "$TMP/COMPLETE" COMPLETE || exit 1

          OLD_LATEST=""
          OLD_PREVIOUS=""
          if aws s3api get-object \
            --bucket "$MINIO_BUCKET" --key state/latest.txt \
            --endpoint-url "$MINIO_ENDPOINT" \
            "$TMP/old-latest.txt" >/dev/null 2>&1; then
            OLD_LATEST="$(tr -d '\r\n' < "$TMP/old-latest.txt")"
          fi
          if aws s3api get-object \
            --bucket "$MINIO_BUCKET" --key state/previous.txt \
            --endpoint-url "$MINIO_ENDPOINT" \
            "$TMP/old-previous.txt" >/dev/null 2>&1; then
            OLD_PREVIOUS="$(tr -d '\r\n' < "$TMP/old-previous.txt")"
          fi

          printf '%s\n' "$STAMP" > "$TMP/latest.txt"
          put_object "$TMP/latest.txt" state/latest.txt || exit 1

          if [ -n "$OLD_LATEST" ]; then
            printf '%s\n' "$OLD_LATEST" > "$TMP/previous.txt"
            put_object "$TMP/previous.txt" state/previous.txt || exit 1
          fi

          if [ -n "$OLD_PREVIOUS" ] && [ "$OLD_PREVIOUS" != "$STAMP" ] && [ "$OLD_PREVIOUS" != "$OLD_LATEST" ]; then
            for key in minecraft.tar.zst tlauncher.tar.zst COMPLETE; do
              aws s3api delete-object \
                --bucket "$MINIO_BUCKET" \
                --key "backups/$OLD_PREVIOUS/$key" \
                --endpoint-url "$MINIO_ENDPOINT" >/dev/null 2>&1 || true
            done
          fi

          rm -rf "$TMP"
          echo "[$(date -u)] Backup $STAMP committed successfully."
          BACKUP
          chmod +x "$CLOUDCRAFT_DIR/backup-once.sh"

      - name: Run initial MinIO backup
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -u
          if ! "$CLOUDCRAFT_DIR/backup-once.sh" 2>&1 | tee "$CLOUDCRAFT_DIR/logs/backup.log"; then
            echo "## Initial MinIO backup FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -100 "$CLOUDCRAFT_DIR/logs/backup.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Start periodic MinIO backup loop
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euo pipefail
          cat > "$CLOUDCRAFT_DIR/backup-loop.sh" <<'LOOP'
          #!/usr/bin/env bash
          set -u
          while true; do
            sleep 300
            echo "===== CloudCraft periodic backup $(date -u) =====" >> "$CLOUDCRAFT_DIR/logs/backup.log"
            "$CLOUDCRAFT_DIR/backup-once.sh" >> "$CLOUDCRAFT_DIR/logs/backup.log" 2>&1 || true
          done
          LOOP
          chmod +x "$CLOUDCRAFT_DIR/backup-loop.sh"
          nohup "$CLOUDCRAFT_DIR/backup-loop.sh" >/dev/null 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/backup.pid"
          echo "Periodic backup loop started."

      - name: CloudCraft ready
        shell: bash
        run: |
          set -euo pipefail
          TUNNEL_URL="$(cat "$CLOUDCRAFT_DIR/cloudflare-url.txt")"
          {
            echo "# CloudCraft is READY"
            echo "## Browser"
            echo "[OPEN CLOUDCRAFT]($TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0)"
            echo ""
            echo "**Direct URL:** $TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0"
            echo "**VNC password:** \`$VNC_PASSWORD\`"
            echo ""
            echo "- Tailscale tag: \`tag:cloudcraft-runner\`"
            echo "- Cloudflare Quick Tunnel: enabled"
            echo "- Persistence: archive-based MinIO snapshots"
            echo "- Minecraft assets/logs/cache: excluded from backup"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep CloudCraft alive
        shell: bash
        run: |
          set -u
          while true; do
            sleep 300
            echo "===== CloudCraft heartbeat $(date -u) ====="
            ps -eo pid,etime,cmd | grep -E 'java|TLauncher|Xvfb|x11vnc|novnc|cloudflared' | grep -v grep || true
            free -h
            df -h /
            tail -20 "$CLOUDCRAFT_DIR/logs/backup.log" || true
          done
