name: CloudCraft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudcraft:
    name: CloudCraft Minecraft
    runs-on: ubuntu-24.04

    timeout-minutes: 350

    env:
      DISPLAY: :99
      SCREEN_WIDTH: 1280
      SCREEN_HEIGHT: 720
      SCREEN_DEPTH: 24

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. BASIC SYSTEM INFORMATION
      # ============================================================

      - name: Check system
        run: |
          echo "========================================"
          echo " CloudCraft System"
          echo "========================================"

          uname -a
          echo

          echo "CPU:"
          nproc
          echo

          echo "Memory:"
          free -h
          echo

          echo "Disk:"
          df -h
          echo


      # ============================================================
      # 3. JAVA 21
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      - name: Verify Java
        run: |
          echo "Java:"
          java -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ============================================================
      # 4. INSTALL GUI / X11 / OPENGL DEPENDENCIES
      # ============================================================

      - name: Install GUI dependencies
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            fluxbox \
            xterm \
            x11-utils \
            x11-xserver-utils \
            mesa-utils \
            mesa-utils-extra \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libglu1-mesa \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libxext6 \
            libxrandr2 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libgtk-3-0 \
            libnss3 \
            libasound2t64 \
            libpulse0 \
            unzip \
            wget \
            curl \
            jq \
            psmisc \
            procps \
            ca-certificates

          echo "GUI dependencies installed."


      # ============================================================
      # 5. TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner
          version: latest
          ping: ${{ secrets.MINIO_TAILSCALE_IP }}


      - name: Verify Tailscale
        run: |
          echo "========================================"
          echo " Tailscale"
          echo "========================================"

          tailscale status

          echo
          echo "Tailscale IP:"
          tailscale ip -4


      # ============================================================
      # 6. TEST RASPBERRY PI / MINIO NETWORK
      # ============================================================

      - name: Test MinIO connectivity
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          echo "Testing MinIO:"
          echo "http://${MINIO_ENDPOINT}/minio/health/live"

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            "http://${MINIO_ENDPOINT}/minio/health/live"

          echo
          echo "MinIO connectivity OK."


      # ============================================================
      # 7. INSTALL AWS CLI V2
      # ============================================================

      - name: Install AWS CLI
        run: |
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed."
            aws --version
            exit 0
          fi

          cd "$RUNNER_TEMP"

          rm -f awscliv2.zip

          curl \
            --fail \
            --silent \
            --show-error \
            -L \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o awscliv2.zip

          rm -rf aws

          unzip -q awscliv2.zip

          sudo ./aws/install

          aws --version


      # ============================================================
      # 8. CONFIGURE MINIO CREDENTIALS
      # ============================================================

      - name: Configure MinIO credentials
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}"
            echo "AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}"
            echo "AWS_DEFAULT_REGION=us-east-1"
          } >> "$GITHUB_ENV"

          echo "MinIO credentials configured."


      # ============================================================
      # 9. TEST MINIO AUTHENTICATION
      # ============================================================

      - name: Test MinIO authentication
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          echo "Testing MinIO authentication..."

          aws s3 ls \
            "s3://${MINIO_BUCKET}/" \
            --endpoint-url "http://${MINIO_ENDPOINT}"

          echo "MinIO authentication OK."


      # ============================================================
      # 10. PREPARE MINECRAFT DIRECTORY
      # ============================================================

      - name: Prepare Minecraft directory
        run: |
          mkdir -p "$HOME/.minecraft"

          echo "Minecraft directory:"
          ls -la "$HOME/.minecraft"


      # ============================================================
      # 11. RESTORE MINECRAFT FROM MINIO
      # ============================================================

      - name: Restore Minecraft from MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          echo "========================================"
          echo " Restoring Minecraft"
          echo "========================================"

          aws s3 sync \
            "s3://${MINIO_BUCKET}/minecraft/" \
            "$HOME/.minecraft/" \
            --endpoint-url "http://${MINIO_ENDPOINT}" \
            --only-show-errors

          echo
          echo "Restore completed."

          echo
          echo "Restored Minecraft files:"
          find "$HOME/.minecraft" \
            -maxdepth 2 \
            -type f \
            | head -100 || true


      # ============================================================
      # 12. START Xvfb
      # ============================================================

      - name: Start virtual display
        run: |
          echo "Starting Xvfb..."

          Xvfb "$DISPLAY" \
            -screen 0 "${SCREEN_WIDTH}x${SCREEN_HEIGHT}x${SCREEN_DEPTH}" \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > "$HOME/xvfb.log" 2>&1 &

          XVFB_PID=$!

          echo "$XVFB_PID" > "$HOME/xvfb.pid"

          sleep 3

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "Xvfb failed to start."
            cat "$HOME/xvfb.log"
            exit 1
          fi

          echo "Xvfb started."


      # ============================================================
      # 13. START FLUXBOX
      # ============================================================

      - name: Start window manager
        run: |
          fluxbox \
            > "$HOME/fluxbox.log" 2>&1 &

          echo $! > "$HOME/fluxbox.pid"

          sleep 2

          echo "Fluxbox started."


      # ============================================================
      # 14. VERIFY DISPLAY
      # ============================================================

      - name: Check virtual display
        run: |
          echo "DISPLAY=$DISPLAY"

          xdpyinfo >/dev/null

          echo "Virtual display is working."


      # ============================================================
      # 15. CHECK OPENGL
      # ============================================================

      - name: Check OpenGL
        run: |
          echo "OpenGL information:"

          glxinfo -B || true


      # ============================================================
      # 16. DOWNLOAD TLAUNCHER
      # ============================================================

      - name: Download TLauncher v17
        run: |
          mkdir -p "$HOME/tlauncher"

          cd "$HOME/tlauncher"

          echo "Downloading TLauncher..."

          curl \
            --fail \
            --silent \
            --show-error \
            -L \
            "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip" \
            -o tlauncher.zip

          ls -lh tlauncher.zip


      # ============================================================
      # 17. EXTRACT TLAUNCHER
      # ============================================================

      - name: Extract TLauncher
        run: |
          cd "$HOME/tlauncher"

          rm -rf extracted

          mkdir extracted

          unzip -q tlauncher.zip -d extracted

          echo "TLauncher files:"
          find extracted -maxdepth 3 -type f | head -100


      # ============================================================
      # 18. FIND TLAUNCHER JAR
      # ============================================================

      - name: Find TLauncher JAR
        run: |
          TLAUNCHER_JAR="$(find "$HOME/tlauncher/extracted" \
            -type f \
            -iname 'TLauncher.jar' \
            -o \
            -type f \
            -iname 'tlauncher.jar' \
            | head -1)"

          if [ -z "$TLAUNCHER_JAR" ]; then
            echo "TLauncher.jar not found."

            echo
            echo "Available JAR files:"
            find "$HOME/tlauncher/extracted" \
              -type f \
              -iname '*.jar'

            exit 1
          fi

          echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$TLAUNCHER_JAR"


      # ============================================================
      # 19. START TLAUNCHER
      # ============================================================

      - name: Start TLauncher
        run: |
          echo "Starting TLauncher..."

          cd "$(dirname "$TLAUNCHER_JAR")"

          nohup java \
            -Xms512M \
            -Xmx2048M \
            -Djava.awt.headless=false \
            -Dprism.order=sw \
            -jar "$TLAUNCHER_JAR" \
            > "$HOME/tlauncher.log" 2>&1 &

          TLAUNCHER_PID=$!

          echo "$TLAUNCHER_PID" > "$HOME/tlauncher.pid"

          sleep 15

          if ! kill -0 "$TLAUNCHER_PID" 2>/dev/null; then
            echo "TLauncher failed to start."

            echo
            echo "TLauncher log:"
            cat "$HOME/tlauncher.log"

            exit 1
          fi

          echo "TLauncher started."


      # ============================================================
      # 20. START x11vnc
      # ============================================================

      - name: Generate VNC password
        run: |
          # x11vnc password files are limited to 8 significant chars.
          VNC_PASSWORD="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 8)"

          if [ -z "$VNC_PASSWORD" ]; then
            echo "Failed to generate VNC password."
            exit 1
          fi

          printf '%s\n' "$VNC_PASSWORD" \
            > "$HOME/vnc-password-display.txt"

          x11vnc -storepasswd \
            "$VNC_PASSWORD" \
            "$HOME/vnc-password.txt"

          chmod 600 \
            "$HOME/vnc-password.txt" \
            "$HOME/vnc-password-display.txt"

          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

          echo "VNC password generated."


      - name: Start x11vnc
        run: |
          echo "Starting x11vnc..."

          x11vnc \
            -display "$DISPLAY" \
            -rfbport 5900 \
            -rfbauth "$HOME/vnc-password.txt" \
            -forever \
            -shared \
            -noxdamage \
            -noxfixes \
            -noxrecord \
            -noxkb \
            -cursor arrow \
            -noscr \
            -wait 10 \
            -defer 10 \
            -ncache 0 \
            > "$HOME/x11vnc.log" 2>&1 &

          X11VNC_PID=$!

          echo "$X11VNC_PID" > "$HOME/x11vnc.pid"

          sleep 4

          if ! kill -0 "$X11VNC_PID" 2>/dev/null; then
            echo "x11vnc failed to start."
            cat "$HOME/x11vnc.log"
            exit 1
          fi

          echo "x11vnc started."


      # ============================================================
      # 21. START NOVNC
      # ============================================================

      - name: Start noVNC
        run: |
          echo "Starting noVNC..."

          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            localhost:5900 \
            > "$HOME/novnc.log" 2>&1 &

          NOVNC_PID=$!

          echo "$NOVNC_PID" > "$HOME/novnc.pid"

          sleep 3

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
            echo "noVNC failed to start."

            cat "$HOME/novnc.log"

            exit 1
          fi

          echo "noVNC started."


      # ============================================================
      # 22. TEST NOVNC
      # ============================================================

      - name: Check noVNC
        run: |
          echo "Testing noVNC..."

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:6080/ \
            > /dev/null

          echo "noVNC is working."


      # ============================================================
      # 23. INSTALL CLOUDFLARED
      # ============================================================

      - name: Install cloudflared
        run: |
          if command -v cloudflared >/dev/null 2>&1; then
            echo "cloudflared already installed."
            cloudflared version
            exit 0
          fi

          cd "$RUNNER_TEMP"

          curl \
            --fail \
            --silent \
            --show-error \
            -L \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o cloudflared

          chmod +x cloudflared

          sudo mv cloudflared /usr/local/bin/cloudflared

          cloudflared version


      # ============================================================
      # 24. START CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: Start Cloudflare Quick Tunnel
        run: |
          echo "Starting Cloudflare Quick Tunnel..."

          rm -f "$HOME/cloudflared.log"

          nohup cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > "$HOME/cloudflared.log" 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" > "$HOME/cloudflared.pid"

          echo "Waiting for Cloudflare tunnel..."

          for i in $(seq 1 30); do

            if grep -Eo \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              "$HOME/cloudflared.log" \
              > "$HOME/cloudflare-url.txt"; then

              break
            fi

            sleep 2

          done

          if [ ! -s "$HOME/cloudflare-url.txt" ]; then
            echo "Cloudflare tunnel URL was not found."

            echo
            echo "cloudflared log:"
            cat "$HOME/cloudflared.log"

            exit 1
          fi

          CLOUDFLARE_URL="$(head -1 "$HOME/cloudflare-url.txt")"

          echo "CLOUDFLARE_URL=$CLOUDFLARE_URL" >> "$GITHUB_ENV"

          echo
          echo "Cloudflare URL:"
          echo "$CLOUDFLARE_URL"


      # ============================================================
      # 25. GITHUB ACTIONS SUMMARY
      # ============================================================

      - name: Show CloudCraft connection information
        run: |
          {
            echo "# ? CloudCraft"
            echo
            echo "## ? Browser Access"
            echo
            echo "[Open CloudCraft Minecraft](https://${CLOUDFLARE_URL#https://})"
            echo
            echo "**URL:** ${CLOUDFLARE_URL}"
            echo
            echo "## ? VNC Password"
            echo
            echo "\`\`\`"
            echo "$VNC_PASSWORD"
            echo "\`\`\`"
            echo
            echo "## ?? Display"
            echo
            echo "- Resolution: ${SCREEN_WIDTH}x${SCREEN_HEIGHT}"
            echo "- Display: ${DISPLAY}"
            echo "- VNC: localhost:5900"
            echo "- noVNC: localhost:6080"
            echo
            echo "## ? Tailscale"
            echo
            tailscale ip -4
            echo
            echo "## ? Minecraft"
            echo
            echo "- Launcher: TLauncher"
            echo "- Minecraft: 1.21.11"
            echo "- Loader: Fabric"
            echo
            echo "> Keep this Actions job running while using CloudCraft."
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 26. SHOW CURRENT STATUS
      # ============================================================

      - name: CloudCraft status
        run: |
          echo "========================================"
          echo " CloudCraft is READY"
          echo "========================================"

          echo
          echo "Browser:"
          echo "$CLOUDFLARE_URL"

          echo
          echo "VNC password:"
          echo "$VNC_PASSWORD"

          echo
          echo "Processes:"
          ps aux | grep -E \
            'TLauncher|Xvfb|x11vnc|websockify|cloudflared' \
            | grep -v grep || true

          echo
          echo "Cloudflare:"
          tail -30 "$HOME/cloudflared.log" || true


      # ============================================================
      # 27. KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep CloudCraft alive
        run: |
          echo "========================================"
          echo " CloudCraft is running"
          echo "========================================"

          echo
          echo "Browser URL:"
          echo "$CLOUDFLARE_URL"

          echo
          echo "VNC Password:"
          echo "$VNC_PASSWORD"

          echo
          echo "Minecraft/TLauncher must be launched manually"
          echo "through the browser GUI."

          echo

          # Keep the job alive.
          # GitHub Actions timeout will eventually terminate the runner.

          while true; do

            echo
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CloudCraft heartbeat"

            if [ -f "$HOME/tlauncher.pid" ]; then
              if kill -0 "$(cat "$HOME/tlauncher.pid")" 2>/dev/null; then
                echo "TLauncher: RUNNING"
              else
                echo "TLauncher: STOPPED"
              fi
            fi

            if [ -f "$HOME/x11vnc.pid" ]; then
              if kill -0 "$(cat "$HOME/x11vnc.pid")" 2>/dev/null; then
                echo "x11vnc: RUNNING"
              else
                echo "x11vnc: STOPPED"
              fi
            fi

            if [ -f "$HOME/novnc.pid" ]; then
              if kill -0 "$(cat "$HOME/novnc.pid")" 2>/dev/null; then
                echo "noVNC: RUNNING"
              else
                echo "noVNC: STOPPED"
              fi
            fi

            if [ -f "$HOME/cloudflared.pid" ]; then
              if kill -0 "$(cat "$HOME/cloudflared.pid")" 2>/dev/null; then
                echo "Cloudflare: RUNNING"
              else
                echo "Cloudflare: STOPPED"
              fi
            fi

            sleep 60

          done


      # ============================================================
      # 28. BACKUP MINECRAFT
      # ============================================================

      - name: Backup Minecraft to MinIO
        if: always()
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          echo "========================================"
          echo " CloudCraft Minecraft Backup"
          echo "========================================"

          if [ ! -d "$HOME/.minecraft" ]; then
            echo "Minecraft directory does not exist."
            exit 0
          fi

          aws s3 sync \
            "$HOME/.minecraft/" \
            "s3://${MINIO_BUCKET}/minecraft/" \
            --endpoint-url "http://${MINIO_ENDPOINT}" \
            --exclude "assets/*" \
            --exclude "libraries/*" \
            --exclude "versions/*" \
            --exclude "logs/*" \
            --exclude "crash-reports/*" \
            --exclude "screenshots/*" \
            --only-show-errors

          echo
          echo "Minecraft backup completed."


      # ============================================================
      # 29. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up CloudCraft..."

          for FILE in \
            "$HOME/cloudflared.pid" \
            "$HOME/novnc.pid" \
            "$HOME/x11vnc.pid" \
            "$HOME/tlauncher.pid" \
            "$HOME/fluxbox.pid" \
            "$HOME/xvfb.pid"
          do

            if [ -f "$FILE" ]; then
              PID="$(cat "$FILE")"

              if kill -0 "$PID" 2>/dev/null; then
                kill "$PID" 2>/dev/null || true
              fi
            fi

          done

          echo "Cleanup complete."
