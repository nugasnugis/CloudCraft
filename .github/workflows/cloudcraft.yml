name: CloudCraft Minecraft Client

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DISPLAY: :99
  SCREEN_SIZE: 1280x720x24
  CLOUDCRAFT_DIR: ${{ github.workspace }}/cloudcraft
  MINIO_BUCKET: cloudcraft
  TLAUNCHER_URL: "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip"
  MINECRAFT_VERSION: "1.21.11"
  VNC_PORT: "5900"
  NOVNC_PORT: "6080"

  # MinIO/S3 compatibility: avoid optional checksum streaming that caused IncompleteBody.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_RETRY_MODE: standard
  AWS_MAX_ATTEMPTS: "10"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  cloudcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check system
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          nproc
          free -h
          df -h
          lspci | grep -Ei 'vga|3d|display' || true

      - name: Install Java 21
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk
          java -version

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11vnc fluxbox xterm x11-utils mesa-utils \
            libgl1-mesa-dri libglx-mesa0 libglu1-mesa \
            libx11-6 libxext6 libxrender1 libxrandr2 libxi6 \
            libxfixes3 libxcursor1 libxinerama1 libxdamage1 \
            libxcomposite1 libxtst6 libxkbcommon0 libxkbcommon-x11-0 \
            libasound2t64 libpulse0 unzip zip curl wget git \
            ca-certificates jq openssl

      - name: Prepare CloudCraft directories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CLOUDCRAFT_DIR"/{logs,state,tlauncher,novnc,tmp}
          touch "$CLOUDCRAFT_DIR/logs"/{xvfb,x11vnc,novnc,cloudflared,fluxbox,tlauncher,backup}.log

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner
          version: latest
          use-cache: true
          log-mode: normal

      - name: Verify Tailscale
        shell: bash
        run: |
          set -euxo pipefail
          tailscale status || true
          tailscale ip -4 || true

      - name: Check MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --silent --show-error --max-time 10 \
            "$MINIO_ENDPOINT/minio/health/live"
          echo
          echo "MinIO is reachable."

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euxo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi
          cd "$CLOUDCRAFT_DIR/tmp"
          curl --fail --location --retry 5 --retry-delay 2 \
            -o awscliv2.zip \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Configure AWS CLI for MinIO
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.aws"
          cat > "$HOME/.aws/credentials" <<EOF
          [default]
          aws_access_key_id=${MINIO_ACCESS_KEY}
          aws_secret_access_key=${MINIO_SECRET_KEY}
          EOF
          cat > "$HOME/.aws/config" <<EOF
          [default]
          region=us-east-1
          request_checksum_calculation=when_required
          response_checksum_validation=when_required
          retries =
            mode = standard
            max_attempts = 10
          s3 =
            addressing_style = path
            payload_signing_enabled = false
            max_concurrent_requests = 5
            multipart_threshold = 64MB
            multipart_chunksize = 16MB
          EOF
          chmod 600 "$HOME/.aws/credentials"
          aws configure list

      - name: Prepare MinIO bucket
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        shell: bash
        run: |
          set -euxo pipefail
          aws s3api head-bucket \
            --bucket "$MINIO_BUCKET" \
            --endpoint-url "$MINIO_ENDPOINT" \
            >/dev/null 2>&1 || \
          aws s3api create-bucket \
            --bucket "$MINIO_BUCKET" \
            --endpoint-url "$MINIO_ENDPOINT"

      # Only persistent Minecraft data is restored.
      # assets/libraries/versions are regenerable cache/runtime data.
      - name: Restore persistent Minecraft data
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.minecraft"
          aws s3 sync \
            "s3://$MINIO_BUCKET/minecraft/" \
            "$HOME/.minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --no-progress \
            --exclude 'assets/*' \
            --exclude 'libraries/*' \
            --exclude 'versions/*' || true
          du -sh "$HOME/.minecraft" || true

      # TLauncher itself is downloaded every run, so only keep useful state/config.
      - name: Restore TLauncher persistent data
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.tlauncher"
          aws s3 sync \
            "s3://$MINIO_BUCKET/tlauncher/" \
            "$HOME/.tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --no-progress \
            --exclude 'logs/*' \
            --exclude 'cache/*' \
            --exclude 'starter/dependencies/*' || true
          du -sh "$HOME/.tlauncher" || true

      - name: Start virtual display
        shell: bash
        run: |
          set -euxo pipefail
          pkill Xvfb || true
          Xvfb "$DISPLAY" \
            -screen 0 "$SCREEN_SIZE" \
            -ac +extension GLX +extension RANDR +extension RENDER \
            -noreset \
            > "$CLOUDCRAFT_DIR/logs/xvfb.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/xvfb.pid"
          sleep 3
          kill -0 "$(cat "$CLOUDCRAFT_DIR/xvfb.pid")"

      - name: Verify display and OpenGL
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          xdpyinfo >/dev/null
          glxinfo -B || true

      - name: Start Fluxbox
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          fluxbox > "$CLOUDCRAFT_DIR/logs/fluxbox.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/fluxbox.pid"
          sleep 2

      - name: Generate VNC password
        shell: bash
        run: |
          set -euo pipefail
          VNC_PASSWORD="$(openssl rand -hex 4)"
          printf '%s\n' "$VNC_PASSWORD" > "$CLOUDCRAFT_DIR/vnc-password.txt"
          chmod 600 "$CLOUDCRAFT_DIR/vnc-password.txt"
          x11vnc -storepasswd "$VNC_PASSWORD" "$CLOUDCRAFT_DIR/vnc-passwd" >/dev/null
          chmod 600 "$CLOUDCRAFT_DIR/vnc-passwd"
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "## CloudCraft VNC"
            echo
            echo "**VNC password:** \`$VNC_PASSWORD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start x11vnc
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          pkill x11vnc || true
          x11vnc \
            -display "$DISPLAY" \
            -rfbport "$VNC_PORT" \
            -rfbauth "$CLOUDCRAFT_DIR/vnc-passwd" \
            -forever -shared -repeat \
            -noxdamage -noxfixes -noxrecord \
            -cursor arrow -wait 2 -defer 2 -threads -localhost \
            > "$CLOUDCRAFT_DIR/logs/x11vnc.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/x11vnc.pid"
          sleep 3
          kill -0 "$(cat "$CLOUDCRAFT_DIR/x11vnc.pid")"
          ss -lntp | grep ":$VNC_PORT"

      - name: Install noVNC
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$CLOUDCRAFT_DIR/novnc"
          git clone --depth 1 --branch v1.7.0 \
            https://github.com/novnc/noVNC.git \
            "$CLOUDCRAFT_DIR/novnc"
          test -x "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy"

      - name: Start noVNC
        shell: bash
        run: |
          set -euxo pipefail
          "$CLOUDCRAFT_DIR/novnc/utils/novnc_proxy" \
            --vnc 127.0.0.1:5900 \
            --listen 127.0.0.1:6080 \
            > "$CLOUDCRAFT_DIR/logs/novnc.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/novnc.pid"
          for i in {1..20}; do
            if curl -fsS --max-time 3 \
              http://127.0.0.1:6080/vnc.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$CLOUDCRAFT_DIR/logs/novnc.log"
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            -o "$CLOUDCRAFT_DIR/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$CLOUDCRAFT_DIR/cloudflared"
          "$CLOUDCRAFT_DIR/cloudflared" --version

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          "$CLOUDCRAFT_DIR/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$CLOUDCRAFT_DIR/logs/cloudflared.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/cloudflared.pid"
          TUNNEL_URL=""
          for i in {1..60}; do
            if ! kill -0 "$(cat "$CLOUDCRAFT_DIR/cloudflared.pid")" 2>/dev/null; then
              cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"
              exit 1
            fi
            TUNNEL_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$CLOUDCRAFT_DIR/logs/cloudflared.log" | head -n1 || true)"
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"
            exit 1
          fi
          printf '%s\n' "$TUNNEL_URL" > "$CLOUDCRAFT_DIR/cloudflare-url.txt"
          {
            echo "## CloudCraft Browser Access"
            echo
            echo "[Open CloudCraft]($TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0)"
            echo
            echo "Direct: $TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and launch TLauncher v17
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CLOUDCRAFT_DIR/tlauncher"
          curl --fail --location --retry 5 --retry-delay 2 \
            -o TLauncher.v17.zip "$TLAUNCHER_URL"
          rm -rf extracted
          mkdir -p extracted
          unzip -o TLauncher.v17.zip -d extracted
          TLAUNCHER_JAR="$(find extracted -type f -iname 'TLauncher.jar' | head -n1)"
          if [ -z "$TLAUNCHER_JAR" ]; then
            find extracted -type f -print
            exit 1
          fi
          TLAUNCHER_JAR="$PWD/$TLAUNCHER_JAR"
          echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" >> "$GITHUB_ENV"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          export MESA_GLSL_VERSION_OVERRIDE=450
          mkdir -p "$HOME/.tlauncher" "$HOME/.minecraft"
          cd "$(dirname "$TLAUNCHER_JAR")"
          java -Dfile.encoding=UTF-8 -jar "$TLAUNCHER_JAR" \
            > "$CLOUDCRAFT_DIR/logs/tlauncher.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/tlauncher.pid"
          sleep 10
          kill -0 "$(cat "$CLOUDCRAFT_DIR/tlauncher.pid")"

      - name: Start MinIO smart backup loop
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$CLOUDCRAFT_DIR/backup-loop.sh" <<'BACKUP'
          #!/usr/bin/env bash
          set -u
          while true; do
            echo "===== $(date -u) periodic backup ====="

            aws s3 sync "$HOME/.minecraft/" "s3://cloudcraft/minecraft/" \
              --endpoint-url "$MINIO_ENDPOINT" \
              --no-progress \
              --exclude 'assets/*' \
              --exclude 'libraries/*' \
              --exclude 'versions/*' || true

            aws s3 sync "$HOME/.tlauncher/" "s3://cloudcraft/tlauncher/" \
              --endpoint-url "$MINIO_ENDPOINT" \
              --no-progress \
              --exclude 'logs/*' \
              --exclude 'cache/*' \
              --exclude 'starter/dependencies/*' || true

            echo "Backup cycle finished."
            sleep 300
          done
          BACKUP
          chmod +x "$CLOUDCRAFT_DIR/backup-loop.sh"
          nohup "$CLOUDCRAFT_DIR/backup-loop.sh" \
            > "$CLOUDCRAFT_DIR/logs/backup.log" 2>&1 &
          echo $! > "$CLOUDCRAFT_DIR/backup.pid"

      - name: CloudCraft ready
        shell: bash
        run: |
          set -euo pipefail
          TUNNEL_URL="$(cat "$CLOUDCRAFT_DIR/cloudflare-url.txt")"
          {
            echo "# CloudCraft is READY"
            echo
            echo "### [OPEN CLOUDCRAFT]($TUNNEL_URL/vnc.html?autoconnect=1&resize=scale&view_only=0)"
            echo
            echo "VNC password: \`$VNC_PASSWORD\`"
            echo
            echo "Tailscale tag: \`tag:cloudcraft-runner\`"
            echo
            echo "Minecraft: select 1.21.11 + Fabric manually in TLauncher."
            echo
            echo "Smart backup excludes regenerable assets/libraries/versions cache."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep CloudCraft alive
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            echo "===== $(date -u) ====="
            ps -eo pid,comm,%cpu,%mem | grep -E 'java|Xvfb|x11vnc|cloudflared' | grep -v grep || true
            tail -5 "$CLOUDCRAFT_DIR/logs/backup.log" 2>/dev/null || true
            sleep 60
          done

      - name: Final MinIO smart backup
        if: always()
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        shell: bash
        run: |
          set +e
          aws s3 sync "$HOME/.minecraft/" "s3://cloudcraft/minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" --no-progress \
            --exclude 'assets/*' --exclude 'libraries/*' --exclude 'versions/*'
          aws s3 sync "$HOME/.tlauncher/" "s3://cloudcraft/tlauncher/" \
            --endpoint-url "$MINIO_ENDPOINT" --no-progress \
            --exclude 'logs/*' --exclude 'cache/*' --exclude 'starter/dependencies/*'

      - name: Show CloudCraft logs
        if: always()
        shell: bash
        run: |
          set +e
          echo "===== Xvfb ====="; cat "$CLOUDCRAFT_DIR/logs/xvfb.log"
          echo "===== x11vnc ====="; tail -100 "$CLOUDCRAFT_DIR/logs/x11vnc.log"
          echo "===== noVNC ====="; tail -100 "$CLOUDCRAFT_DIR/logs/novnc.log"
          echo "===== Cloudflare ====="; tail -100 "$CLOUDCRAFT_DIR/logs/cloudflared.log"
          echo "===== TLauncher ====="; tail -100 "$CLOUDCRAFT_DIR/logs/tlauncher.log"
          echo "===== Backup ====="; tail -100 "$CLOUDCRAFT_DIR/logs/backup.log"
