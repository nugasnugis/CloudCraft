name: CloudCraft - Minecraft Cloud Client

on:
  workflow_dispatch:

# GitHub token hanya perlu read access.
permissions:
  contents: read

# Jangan sampai dua CloudCraft session berjalan bersamaan.
concurrency:
  group: cloudcraft-main
  cancel-in-progress: false

jobs:
  cloudcraft:
    name: CloudCraft Minecraft Client
    runs-on: ubuntu-24.04

    # GitHub-hosted runner maksimal 6 jam.
    timeout-minutes: 350

    env:
      # ==========================================================
      # CLOUDFRAFT CONFIG
      # ==========================================================

      CLOUDFRAFT_DIR: /home/runner/cloudcraft
      CLOUDFRAFT_DATA: /home/runner/cloudcraft/data
      CLOUDFRAFT_LOGS: /home/runner/cloudcraft/logs

      # Minecraft
      MINECRAFT_VERSION: "1.21.11"

      # TLauncher v17
      TLAUNCHER_URL: "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip"

      # Display
      DISPLAY: ":99"
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "720"
      SCREEN_DEPTH: "24"

      # VNC
      VNC_PORT: "5900"

      # Browser VNC
      NOVNC_PORT: "6080"

      # Cloudflare Quick Tunnel
      CLOUDFLARE_TARGET: "http://127.0.0.1:6080"

      # MinIO
      MINIO_BUCKET: "cloudcraft"

      # Change this ONLY if your MinIO is reachable through
      # another Tailscale IP/hostname.
      MINIO_ENDPOINT: "http://100.100.100.100:9000"

      # Data inside MinIO
      MINIO_PREFIX: "cloudcraft/"

      # Backup interval
      BACKUP_INTERVAL: "300"

      # Minecraft RAM
      # ubuntu-latest currently has enough RAM for this.
      MINECRAFT_MIN_RAM: "2G"
      MINECRAFT_MAX_RAM: "6G"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. CREATE ALL DIRECTORIES FIRST
      # ==========================================================

      - name: Initialize CloudCraft directories
        shell: bash
        run: |
          set -e

          mkdir -p "$CLOUDFRAFT_DIR"
          mkdir -p "$CLOUDFRAFT_DATA"
          mkdir -p "$CLOUDFRAFT_LOGS"

          mkdir -p "$CLOUDFRAFT_DIR/tlauncher"
          mkdir -p "$CLOUDFRAFT_DIR/.minecraft"
          mkdir -p "$CLOUDFRAFT_DIR/backups"

          touch "$CLOUDFRAFT_LOGS/cloudcraft.log"
          touch "$CLOUDFRAFT_LOGS/xvfb.log"
          touch "$CLOUDFRAFT_LOGS/x11vnc.log"
          touch "$CLOUDFRAFT_LOGS/novnc.log"
          touch "$CLOUDFRAFT_LOGS/cloudflared.log"
          touch "$CLOUDFRAFT_LOGS/backup.log"

          echo "CloudCraft directories:"
          find "$CLOUDFRAFT_DIR" -maxdepth 2 -type d | sort


      # ==========================================================
      # 3. SYSTEM INFO
      # ==========================================================

      - name: Check system
        shell: bash
        run: |
          set -e

          echo "===== CPU ====="
          nproc

          echo "===== MEMORY ====="
          free -h

          echo "===== DISK ====="
          df -h /

          echo "===== OS ====="
          cat /etc/os-release


      # ==========================================================
      # 4. INSTALL GUI + VIRTUAL DISPLAY
      #
      # IMPORTANT:
      # Do NOT install libgl1-mesa-glx.
      # Ubuntu 24.04 does not provide it.
      # ==========================================================

      - name: Install GUI dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb \
            x11vnc \
            openbox \
            xterm \
            dbus-x11 \
            xauth \
            x11-utils \
            x11-xserver-utils \
            mesa-utils \
            libgl1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libegl1-mesa \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxi6 \
            libxrandr2 \
            libxcursor1 \
            libxinerama1 \
            libfreetype6 \
            libfontconfig1 \
            libasound2t64 \
            curl \
            wget \
            unzip \
            jq \
            openssl \
            procps \
            net-tools

          echo "GUI dependencies installed."


      # ==========================================================
      # 5. INSTALL JAVA 21
      #
      # IMPORTANT:
      # NO cache: gradle
      # because this repository is not a Gradle project.
      # ==========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      - name: Verify Java
        shell: bash
        run: |
          set -e

          java -version
          javac -version


      # ==========================================================
      # 6. INSTALL AWS CLI
      #
      # Used as S3 client for MinIO.
      # ==========================================================

      - name: Install AWS CLI
        shell: bash
        run: |
          set -e

          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed."
            aws --version
            exit 0
          fi

          cd "$RUNNER_TEMP"

          curl -fsSL \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o awscliv2.zip

          rm -rf aws

          unzip -q awscliv2.zip

          sudo ./aws/install \
            --update \
            --bin-dir /usr/local/bin \
            --install-dir /usr/local/aws-cli

          aws --version


      # ==========================================================
      # 7. CONNECT TO TAILSCALE
      #
      # Your tag:
      # tag:cloudcraft-runner
      #
      # Required GitHub secrets:
      #
      # TS_OAUTH_CLIENT_ID
      # TS_OAUTH_SECRET
      #
      # ==========================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner
          version: latest


      - name: Check Tailscale
        shell: bash
        run: |
          set -e

          echo "===== TAILSCALE STATUS ====="
          tailscale status

          echo
          echo "===== TAILSCALE IP ====="
          tailscale ip -4 || true


      # ==========================================================
      # 8. TEST MINIO CONNECTION
      # ==========================================================

      - name: Configure MinIO credentials
        shell: bash
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -e

          mkdir -p "$HOME/.aws"

          cat > "$HOME/.aws/credentials" <<EOF
          [default]
          aws_access_key_id = ${MINIO_ACCESS_KEY}
          aws_secret_access_key = ${MINIO_SECRET_KEY}
          EOF

          cat > "$HOME/.aws/config" <<EOF
          [default]
          region = us-east-1
          output = json
          EOF

          chmod 600 "$HOME/.aws/credentials"


      - name: Test MinIO
        shell: bash
        run: |
          set -e

          echo "Testing MinIO:"
          echo "$MINIO_ENDPOINT"

          aws s3api list-buckets \
            --endpoint-url "$MINIO_ENDPOINT"

          echo "MinIO connection OK."


      # ==========================================================
      # 9. CREATE BUCKET IF NEEDED
      # ==========================================================

      - name: Ensure MinIO bucket exists
        shell: bash
        run: |
          set -e

          if aws s3api head-bucket \
            --bucket "$MINIO_BUCKET" \
            --endpoint-url "$MINIO_ENDPOINT" \
            >/dev/null 2>&1; then

            echo "Bucket exists: $MINIO_BUCKET"

          else

            echo "Creating bucket: $MINIO_BUCKET"

            aws s3api create-bucket \
              --bucket "$MINIO_BUCKET" \
              --endpoint-url "$MINIO_ENDPOINT"

          fi


      # ==========================================================
      # 10. RESTORE CLOUDCRAFT DATA FROM MINIO
      #
      # Everything from:
      #
      # s3://cloudcraft/cloudcraft/
      #
      # is restored into:
      #
      # /home/runner/cloudcraft/data/
      # ==========================================================

      - name: Restore CloudCraft data from MinIO
        shell: bash
        run: |
          set -e

          echo "Restoring CloudCraft data..."

          aws s3 sync \
            "s3://${MINIO_BUCKET}/${MINIO_PREFIX}" \
            "$CLOUDFRAFT_DATA/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          echo
          echo "Restored files:"
          du -sh "$CLOUDFRAFT_DATA" || true
          find "$CLOUDFRAFT_DATA" -maxdepth 3 -type f | head -100 || true


      # ==========================================================
      # 11. LINK PERSISTENT MINECRAFT DIRECTORY
      #
      # TLauncher normally expects:
      #
      # ~/.minecraft
      #
      # We store it inside CloudCraft data.
      # ==========================================================

      - name: Prepare persistent Minecraft directory
        shell: bash
        run: |
          set -e

          mkdir -p "$CLOUDFRAFT_DATA/minecraft"

          rm -rf "$HOME/.minecraft"

          ln -s \
            "$CLOUDFRAFT_DATA/minecraft" \
            "$HOME/.minecraft"

          echo "Minecraft directory:"
          readlink -f "$HOME/.minecraft"


      # ==========================================================
      # 12. START Xvfb
      #
      # FIXED:
      # directories are already created before this step.
      # ==========================================================

      - name: Start virtual display
        shell: bash
        run: |
          set -e

          mkdir -p "$CLOUDFRAFT_DIR"
          mkdir -p "$CLOUDFRAFT_LOGS"

          rm -f "$CLOUDFRAFT_DIR/xvfb.pid"

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 "${SCREEN_WIDTH}x${SCREEN_HEIGHT}x${SCREEN_DEPTH}" \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > "$CLOUDFRAFT_LOGS/xvfb.log" 2>&1 &

          XVFB_PID=$!

          echo "$XVFB_PID" \
            > "$CLOUDFRAFT_DIR/xvfb.pid"

          sleep 3

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "Xvfb failed to start."
            cat "$CLOUDFRAFT_LOGS/xvfb.log"
            exit 1
          fi

          echo "Xvfb started:"
          echo "PID=$XVFB_PID"
          echo "DISPLAY=$DISPLAY"


      # ==========================================================
      # 13. START OPENBOX
      # ==========================================================

      - name: Start Openbox
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          openbox \
            > "$CLOUDFRAFT_LOGS/openbox.log" 2>&1 &

          echo $! > "$CLOUDFRAFT_DIR/openbox.pid"

          sleep 2

          echo "Openbox started."


      # ==========================================================
      # 14. CHECK DISPLAY
      # ==========================================================

      - name: Check virtual display
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          xdpyinfo >/dev/null

          echo "Virtual display is working."

          echo
          echo "===== DISPLAY ====="
          xdpyinfo | grep -E \
            "dimensions|depth of root window"


      # ==========================================================
      # 15. CHECK OPENGL
      # ==========================================================

      - name: Check OpenGL
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          LIBGL_ALWAYS_SOFTWARE=1 \
            glxinfo -B || true


      # ==========================================================
      # 16. CREATE VNC PASSWORD
      #
      # x11vnc VNC password is limited to 8 characters.
      #
      # We generate exactly 8 characters.
      # ==========================================================

      - name: Generate VNC password
        shell: bash
        run: |
          set -e

          mkdir -p "$CLOUDFRAFT_DIR"

          VNC_PASSWORD="$(
            openssl rand -hex 4
          )"

          echo "$VNC_PASSWORD" \
            > "$CLOUDFRAFT_DIR/vnc-password.txt"

          chmod 600 \
            "$CLOUDFRAFT_DIR/vnc-password.txt"

          x11vnc \
            -storepasswd \
            "$VNC_PASSWORD" \
            "$CLOUDFRAFT_DIR/vncpasswd"

          chmod 600 \
            "$CLOUDFRAFT_DIR/vncpasswd"

          # Put password in GitHub summary.
          # Do NOT use ::add-mask here, otherwise the summary
          # would hide the password we need to actually use.
          {
            echo "## ? CloudCraft VNC"
            echo
            echo "**VNC password:** \`$VNC_PASSWORD\`"
            echo
            echo "> Keep this password private."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "VNC password file created."


      # ==========================================================
      # 17. START x11vnc
      #
      # IMPORTANT:
      # NO "-encodings tight"
      #
      # Older x11vnc on Ubuntu rejects that option.
      # ==========================================================

      - name: Start x11vnc
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          rm -f "$CLOUDFRAFT_DIR/x11vnc.pid"

          x11vnc \
            -display :99 \
            -rfbport 5900 \
            -rfbauth "$CLOUDFRAFT_DIR/vncpasswd" \
            -forever \
            -shared \
            -noxdamage \
            -repeat \
            -cursor arrow \
            -noxfixes \
            -noscr \
            -bg \
            -o "$CLOUDFRAFT_LOGS/x11vnc.log"

          sleep 3

          if ! ss -lntp | grep -q ":5900"; then
            echo "x11vnc failed to start."
            cat "$CLOUDFRAFT_LOGS/x11vnc.log" || true
            exit 1
          fi

          echo "x11vnc is listening on port 5900."


      # ==========================================================
      # 18. INSTALL / START NOVNC
      #
      # We intentionally use system noVNC + websockify.
      # ==========================================================

      - name: Install noVNC and websockify
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            novnc \
            websockify

          echo "noVNC installed."

          command -v websockify
          test -d /usr/share/novnc


      # ==========================================================
      # 19. START noVNC
      # ==========================================================

      - name: Start noVNC
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          rm -f "$CLOUDFRAFT_DIR/novnc.pid"

          websockify \
            --web=/usr/share/novnc \
            --heartbeat=30 \
            6080 \
            127.0.0.1:5900 \
            > "$CLOUDFRAFT_LOGS/novnc.log" 2>&1 &

          NOVNC_PID=$!

          echo "$NOVNC_PID" \
            > "$CLOUDFRAFT_DIR/novnc.pid"

          sleep 3

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
            echo "noVNC/websockify failed."
            cat "$CLOUDFRAFT_LOGS/novnc.log"
            exit 1
          fi

          if ! curl -fsS \
            "http://127.0.0.1:6080/" \
            >/dev/null; then

            echo "noVNC HTTP server is not responding."
            cat "$CLOUDFRAFT_LOGS/novnc.log"
            exit 1
          fi

          echo "noVNC is running on port 6080."


      # ==========================================================
      # 20. DOWNLOAD TLAUNCHER v17
      # ==========================================================

      - name: Download TLauncher v17
        shell: bash
        run: |
          set -e

          rm -rf "$CLOUDFRAFT_DIR/tlauncher"
          mkdir -p "$CLOUDFRAFT_DIR/tlauncher"

          cd "$CLOUDFRAFT_DIR/tlauncher"

          curl -fL \
            "$TLAUNCHER_URL" \
            -o TLauncher.zip

          unzip -o \
            TLauncher.zip \
            >/dev/null

          echo "TLauncher files:"
          find . -maxdepth 3 -type f | sort


      # ==========================================================
      # 21. FIND TLAUNCHER JAR
      # ==========================================================

      - name: Find TLauncher JAR
        shell: bash
        run: |
          set -e

          TLAUNCHER_JAR="$(
            find "$CLOUDFRAFT_DIR/tlauncher" \
              -type f \
              -iname "*.jar" \
              | head -n 1
          )"

          if [ -z "$TLAUNCHER_JAR" ]; then
            echo "TLauncher JAR not found."
            find "$CLOUDFRAFT_DIR/tlauncher" -type f
            exit 1
          fi

          echo "TLauncher JAR:"
          echo "$TLAUNCHER_JAR"

          echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" \
            >> "$GITHUB_ENV"


      # ==========================================================
      # 22. START TLAUNCHER GUI
      #
      # IMPORTANT:
      # TLauncher remains a GUI application.
      #
      # You can control it through the noVNC browser.
      #
      # Select:
      #
      # Fabric 1.21.11
      #
      # directly from TLauncher.
      #
      # No external Fabric installer is required.
      # ==========================================================

      - name: Start TLauncher
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          cd "$CLOUDFRAFT_DIR/tlauncher"

          echo "Starting TLauncher:"
          echo "$TLAUNCHER_JAR"

          nohup java \
            -Xms512M \
            -Xmx1G \
            -Dprism.order=sw \
            -Djava.awt.headless=false \
            -jar "$TLAUNCHER_JAR" \
            > "$CLOUDFRAFT_LOGS/tlauncher.log" 2>&1 &

          TLAUNCHER_PID=$!

          echo "$TLAUNCHER_PID" \
            > "$CLOUDFRAFT_DIR/tlauncher.pid"

          sleep 8

          if ! kill -0 "$TLAUNCHER_PID" 2>/dev/null; then
            echo "TLauncher exited unexpectedly."

            tail -200 \
              "$CLOUDFRAFT_LOGS/tlauncher.log" || true

            exit 1
          fi

          echo "TLauncher is running."


      # ==========================================================
      # 23. START CLOUDFLARE QUICK TUNNEL
      #
      # Quick Tunnel:
      #
      # https://xxxx.trycloudflare.com
      #
      # -> noVNC
      #
      # Cloudflare officially documents:
      #
      # cloudflared tunnel --url http://localhost:8080
      #
      # ==========================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -e

          if command -v cloudflared >/dev/null 2>&1; then
            echo "cloudflared already installed."
            cloudflared --version
            exit 0
          fi

          curl -L \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o "$CLOUDFRAFT_DIR/cloudflared"

          chmod +x \
            "$CLOUDFRAFT_DIR/cloudflared"

          "$CLOUDFRAFT_DIR/cloudflared" \
            --version


      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -e

          rm -f \
            "$CLOUDFRAFT_DIR/cloudflare-url.txt"

          rm -f \
            "$CLOUDFRAFT_LOGS/cloudflared.log"

          touch \
            "$CLOUDFRAFT_LOGS/cloudflared.log"

          "$CLOUDFRAFT_DIR/cloudflared" \
            tunnel \
            --no-autoupdate \
            --url "$CLOUDFLARE_TARGET" \
            > "$CLOUDFRAFT_LOGS/cloudflared.log" 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" \
            > "$CLOUDFRAFT_DIR/cloudflared.pid"

          echo "Waiting for Cloudflare Quick Tunnel..."

          CLOUDFLARE_URL=""

          for i in $(seq 1 60); do

            sleep 2

            # Search normal cloudflared output.
            CLOUDFLARE_URL="$(
              grep -Eo \
                'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                "$CLOUDFRAFT_LOGS/cloudflared.log" \
                | head -n 1 \
                || true
            )"

            if [ -n "$CLOUDFLARE_URL" ]; then
              break
            fi

            # Make sure process is still alive.
            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "cloudflared exited unexpectedly."
              cat "$CLOUDFRAFT_LOGS/cloudflared.log"
              exit 1
            fi

          done

          if [ -z "$CLOUDFLARE_URL" ]; then
            echo "Cloudflare Quick Tunnel URL was not found."
            echo
            echo "===== cloudflared log ====="
            cat "$CLOUDFRAFT_LOGS/cloudflared.log"
            echo
            exit 1
          fi

          echo "$CLOUDFLARE_URL" \
            > "$CLOUDFRAFT_DIR/cloudflare-url.txt"

          echo
          echo "============================================"
          echo " CLOUDCRAFT BROWSER URL"
          echo "============================================"
          echo
          echo "$CLOUDFLARE_URL"
          echo
          echo "============================================"

          {
            echo "## ? CloudCraft Browser"
            echo
            echo "### noVNC"
            echo
            echo "[$CLOUDFLARE_URL]($CLOUDFLARE_URL)"
            echo
            echo "**VNC password:** check the VNC section above."
            echo
            echo "Open the URL in your browser."
            echo
            echo "Cloudflare Quick Tunnel is being used."
          } >> "$GITHUB_STEP_SUMMARY"


      # ==========================================================
      # 24. VERIFY EVERYTHING
      # ==========================================================

      - name: Verify CloudCraft services
        shell: bash
        run: |
          set -e

          echo "===== PORTS ====="

          ss -lntp | grep -E \
            ":5900|:6080" \
            || true

          echo
          echo "===== PROCESSES ====="

          ps aux | grep -E \
            "Xvfb|x11vnc|websockify|cloudflared|TLauncher" \
            | grep -v grep \
            || true

          echo
          echo "===== CLOUDFLARE URL ====="

          cat "$CLOUDFRAFT_DIR/cloudflare-url.txt"


      # ==========================================================
      # 25. PERIODIC MINIO BACKUP
      #
      # This is VERY important.
      #
      # GitHub-hosted runners disappear after the job ends.
      # We therefore save continuously.
      # ==========================================================

      - name: Start continuous MinIO backup
        shell: bash
        run: |
          set -e

          cat > "$CLOUDFRAFT_DIR/backup-loop.sh" <<'BACKUP_SCRIPT'
          #!/usr/bin/env bash

          set -u

          while true; do

            echo "[$(date -Is)] Starting CloudCraft backup..." \
              >> "$CLOUDFRAFT_LOGS/backup.log"

            aws s3 sync \
              "$CLOUDFRAFT_DATA/" \
              "s3://${MINIO_BUCKET}/${MINIO_PREFIX}" \
              --endpoint-url "$MINIO_ENDPOINT" \
              --only-show-errors \
              >> "$CLOUDFRAFT_LOGS/backup.log" 2>&1 \
              || true

            echo "[$(date -Is)] Backup finished." \
              >> "$CLOUDFRAFT_LOGS/backup.log"

            sleep "$BACKUP_INTERVAL"

          done
          BACKUP_SCRIPT

          chmod +x \
            "$CLOUDFRAFT_DIR/backup-loop.sh"

          nohup \
            "$CLOUDFRAFT_DIR/backup-loop.sh" \
            >/dev/null 2>&1 &

          BACKUP_PID=$!

          echo "$BACKUP_PID" \
            > "$CLOUDFRAFT_DIR/backup.pid"

          echo "Continuous MinIO backup started."
          echo "PID=$BACKUP_PID"


      # ==========================================================
      # 26. INITIAL BACKUP
      # ==========================================================

      - name: Initial MinIO backup
        shell: bash
        run: |
          set -e

          aws s3 sync \
            "$CLOUDFRAFT_DATA/" \
            "s3://${MINIO_BUCKET}/${MINIO_PREFIX}" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors

          echo "Initial backup completed."


      # ==========================================================
      # 27. SHOW FINAL INFORMATION
      # ==========================================================

      - name: CloudCraft connection information
        shell: bash
        run: |
          echo
          echo "================================================"
          echo "              CLOUDCRAFT READY"
          echo "================================================"
          echo

          echo "Browser:"
          cat "$CLOUDFRAFT_DIR/cloudflare-url.txt"

          echo
          echo "VNC password:"
          cat "$CLOUDFRAFT_DIR/vnc-password.txt"

          echo
          echo "Tailscale:"
          tailscale status || true

          echo
          echo "Minecraft:"
          echo "Minecraft $MINECRAFT_VERSION"
          echo "Fabric is selected from TLauncher."

          echo
          echo "MinIO:"
          echo "$MINIO_ENDPOINT"

          echo
          echo "================================================"


      # ==========================================================
      # 28. KEEP RUNNER ALIVE
      #
      # This is the actual "server" loop.
      #
      # GitHub will terminate the job at its execution limit.
      # ==========================================================

      - name: Keep CloudCraft alive
        shell: bash
        run: |
          set +e

          echo
          echo "================================================"
          echo " CloudCraft is running!"
          echo "================================================"
          echo
          echo "Open the Cloudflare URL from the Summary."
          echo
          echo "Use noVNC to control TLauncher/Minecraft."
          echo
          echo "Backups run every ${BACKUP_INTERVAL} seconds."
          echo
          echo "================================================"

          while true; do

            # Keep output alive and monitor services.

            if ! kill -0 \
              "$(cat "$CLOUDFRAFT_DIR/xvfb.pid" 2>/dev/null)" \
              2>/dev/null; then

              echo "WARNING: Xvfb stopped."

            fi

            if ! ss -lntp | grep -q ":6080"; then
              echo "WARNING: noVNC stopped."
            fi

            if ! pgrep -f cloudflared >/dev/null 2>&1; then
              echo "WARNING: cloudflared stopped."
            fi

            sleep 30

          done


      # ==========================================================
      # 29. FINAL BACKUP
      #
      # Usually runs only on graceful completion.
      # The periodic backup above is the important one.
      # ==========================================================

      - name: Final MinIO backup
        if: always()
        shell: bash
        run: |
          set +e

          echo "Final backup..."

          aws s3 sync \
            "$CLOUDFRAFT_DATA/" \
            "s3://${MINIO_BUCKET}/${MINIO_PREFIX}" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --only-show-errors \
            || true

          echo "Final backup attempt completed."


      # ==========================================================
      # 30. SAVE LOGS
      # ==========================================================

      - name: Upload CloudCraft logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcraft-logs
          path: /home/runner/cloudcraft/logs/
          if-no-files-found: ignore
          retention-days: 3
