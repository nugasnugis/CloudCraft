name: CloudCraft

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # ============================================================
  # CLOUDCRAFT
  # ============================================================
  DISPLAY: ":99"

  SCREEN_WIDTH: "1280"
  SCREEN_HEIGHT: "720"
  SCREEN_DEPTH: "24"

  # ============================================================
  # MINECRAFT
  # ============================================================
  MINECRAFT_VERSION: "1.21.11"
  MINECRAFT_FABRIC_VERSION: "Fabric 1.21.11"

  # ============================================================
  # PORTS
  # ============================================================
  VNC_PORT: "5900"
  NOVNC_PORT: "6080"

  # ============================================================
  # PATHS
  # ============================================================
  CLOUDCRAFT_DIR: "/home/runner/cloudcraft"
  TLAUNCHER_DIR: "/home/runner/tlauncher"

jobs:

  cloudcraft:
    name: CloudCraft Minecraft
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. BASIC SYSTEM INFORMATION
      # ========================================================

      - name: Check system
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " CloudCraft System Information"
          echo "======================================"

          echo "OS:"
          lsb_release -a || true

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Kernel:"
          uname -a


      # ========================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ========================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl \
            wget \
            unzip \
            p7zip-full \
            xz-utils \
            ca-certificates \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            xauth \
            x11-utils \
            x11-xserver-utils \
            xdotool \
            dbus-x11 \
            libxtst6 \
            libxi6 \
            libxrender1 \
            libxrandr2 \
            libxinerama1 \
            libxcursor1 \
            libxext6 \
            libxfixes3 \
            libgl1 \
            libglu1-mesa \
            mesa-utils \
            pulseaudio \
            pulseaudio-utils \
            python3 \
            python3-pip \
            jq

          echo
          echo "Dependencies installed."


      # ========================================================
      # 4. JAVA 21
      # ========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version

          echo
          echo "JAVA_HOME=$JAVA_HOME"


      # ========================================================
      # 5. CREATE CLOUDCRAFT DIRECTORIES
      # ========================================================

      - name: Prepare CloudCraft directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CLOUDCRAFT_DIR"
          mkdir -p "$CLOUDCRAFT_DIR/logs"
          mkdir -p "$CLOUDCRAFT_DIR/runtime"

          mkdir -p "$TLAUNCHER_DIR"

          echo "Directories:"
          find "$CLOUDCRAFT_DIR" -maxdepth 2 -type d
          echo
          echo "TLauncher directory:"
          ls -la "$TLAUNCHER_DIR"


      # ========================================================
      # 6. CONNECT TAILSCALE
      # ========================================================

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner
          version: latest


      - name: Verify Tailscale
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " Tailscale"
          echo "======================================"

          tailscale version

          echo
          echo "Tailscale status:"
          tailscale status || true

          echo
          echo "Tailscale IP:"
          tailscale ip -4 || true


      # ========================================================
      # 7. RESTORE MINECRAFT DATA FROM MINIO
      # ========================================================

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed."
            aws --version
            exit 0
          fi

          cd "$RUNNER_TEMP"

          curl -fsSL \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o awscliv2.zip

          rm -rf aws

          unzip -q awscliv2.zip

          sudo ./aws/install

          aws --version


      - name: Configure MinIO connection
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          set -euo pipefail

          if [ -z "${MINIO_ENDPOINT:-}" ]; then
            echo "MINIO_ENDPOINT secret is not configured."
            exit 1
          fi

          if [ -z "${MINIO_ACCESS_KEY:-}" ]; then
            echo "MINIO_ACCESS_KEY secret is not configured."
            exit 1
          fi

          if [ -z "${MINIO_SECRET_KEY:-}" ]; then
            echo "MINIO_SECRET_KEY secret is not configured."
            exit 1
          fi

          if [ -z "${MINIO_BUCKET:-}" ]; then
            echo "MINIO_BUCKET secret is not configured."
            exit 1
          fi

          {
            echo "AWS_ACCESS_KEY_ID=$MINIO_ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$MINIO_SECRET_KEY"
            echo "AWS_DEFAULT_REGION=us-east-1"
          } >> "$GITHUB_ENV"

          echo "::add-mask::$MINIO_ACCESS_KEY"
          echo "::add-mask::$MINIO_SECRET_KEY"

          echo "MinIO configuration loaded."


      - name: Restore CloudCraft data
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo " Restoring CloudCraft data"
          echo "======================================"

          mkdir -p "$CLOUDCRAFT_DIR/minecraft"

          echo "Endpoint: $MINIO_ENDPOINT"
          echo "Bucket:   $MINIO_BUCKET"

          aws s3 sync \
            "s3://$MINIO_BUCKET/cloudcraft/" \
            "$CLOUDCRAFT_DIR/minecraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --no-progress

          echo
          echo "Restored files:"
          find "$CLOUDCRAFT_DIR/minecraft" \
            -maxdepth 3 \
            -type f \
            -printf '%p %s bytes\n' \
            | head -200 || true


      # ========================================================
      # 8. DOWNLOAD TLAUNCHER
      # ========================================================

      - name: Download TLauncher
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"

          rm -rf tlauncher-download
          mkdir -p tlauncher-download

          cd tlauncher-download

          echo "Downloading TLauncher v17..."

          curl -fL \
            "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip" \
            -o TLauncher.v17.zip

          test -s TLauncher.v17.zip

          echo
          echo "Downloaded:"
          ls -lh TLauncher.v17.zip


      - name: Extract TLauncher
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$TLAUNCHER_DIR"
          mkdir -p "$TLAUNCHER_DIR"

          cd "$RUNNER_TEMP/tlauncher-download"

          unzip -q TLauncher.v17.zip \
            -d "$TLAUNCHER_DIR" || \
          7z x TLauncher.v17.zip \
            -o"$TLAUNCHER_DIR"

          echo "TLauncher files:"
          find "$TLAUNCHER_DIR" -maxdepth 3 -type f \
            -printf '%p\n' \
            | head -100


      # ========================================================
      # 9. FIND TLAUNCHER JAR
      # ========================================================

      - name: Find TLauncher JAR
        id: tlauncher
        shell: bash
        run: |
          set -euo pipefail

          TLAUNCHER_JAR="$(find "$TLAUNCHER_DIR" \
            -type f \
            -iname 'TLauncher*.jar' \
            -print -quit)"

          if [ -z "$TLAUNCHER_JAR" ]; then
            TLAUNCHER_JAR="$(find "$TLAUNCHER_DIR" \
              -type f \
              -iname '*.jar' \
              -print -quit)"
          fi

          if [ -z "$TLAUNCHER_JAR" ]; then
            echo "ERROR: TLauncher JAR not found."
            find "$TLAUNCHER_DIR" -type f
            exit 1
          fi

          echo "TLauncher JAR:"
          echo "$TLAUNCHER_JAR"

          echo "jar=$TLAUNCHER_JAR" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 10. START VIRTUAL DISPLAY
      # ========================================================

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Xvfb..."

          Xvfb "$DISPLAY" \
            -screen 0 "${SCREEN_WIDTH}x${SCREEN_HEIGHT}x${SCREEN_DEPTH}" \
            -ac \
            +extension GLX \
            +extension RANDR \
            +render \
            -noreset \
            > "$CLOUDCRAFT_DIR/logs/xvfb.log" 2>&1 &

          XVFB_PID=$!

          echo "$XVFB_PID" \
            > "$CLOUDCRAFT_DIR/runtime/xvfb.pid"

          sleep 3

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "Xvfb failed to start."
            cat "$CLOUDCRAFT_DIR/logs/xvfb.log"
            exit 1
          fi

          echo "Xvfb started."
          echo "DISPLAY=$DISPLAY"


      - name: Check virtual display
        shell: bash
        run: |
          set -euo pipefail

          export DISPLAY=:99

          xdpyinfo >/dev/null

          echo "Virtual display is working."

          xdpyinfo | grep dimensions || true


      # ========================================================
      # 11. OPENGL
      # ========================================================

      - name: Check OpenGL
        shell: bash
        run: |
          set -euo pipefail

          export DISPLAY=:99

          glxinfo -B || true


      # ========================================================
      # 12. CREATE VNC PASSWORD
      # ========================================================

      - name: Generate VNC password
        id: vnc_password
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CLOUDCRAFT_DIR"

          VNC_PASSWORD="$(
            python3 -c '
          import secrets
          import string

          chars = string.ascii_letters + string.digits
          print("".join(secrets.choice(chars) for _ in range(12)))
          '
          )"

          echo "::add-mask::$VNC_PASSWORD"

          printf '%s\n' "$VNC_PASSWORD" \
            > "$CLOUDCRAFT_DIR/vnc-password.txt"

          chmod 600 "$CLOUDCRAFT_DIR/vnc-password.txt"

          x11vnc \
            -storepasswd \
            "$VNC_PASSWORD" \
            "$CLOUDCRAFT_DIR/vnc-auth"

          chmod 600 "$CLOUDCRAFT_DIR/vnc-auth"

          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

          {
            echo "## 🖥️ CloudCraft VNC"
            echo
            echo "**Password:** \`$VNC_PASSWORD\`"
            echo
            echo "VNC is intended as a fallback/debug connection."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "VNC password generated."


      # ========================================================
      # 13. START X11VNC
      # ========================================================

      - name: Start x11vnc
        shell: bash
        run: |
          set -euo pipefail

          export DISPLAY=:99

          echo "Starting x11vnc..."

          x11vnc \
            -display "$DISPLAY" \
            -rfbport "$VNC_PORT" \
            -rfbauth "$CLOUDCRAFT_DIR/vnc-auth" \
            -forever \
            -shared \
            -noxdamage \
            -repeat \
            -noxkb \
            -cursor arrow \
            > "$CLOUDCRAFT_DIR/logs/x11vnc.log" 2>&1 &

          VNC_PID=$!

          echo "$VNC_PID" \
            > "$CLOUDCRAFT_DIR/runtime/x11vnc.pid"

          sleep 3

          if ! kill -0 "$VNC_PID" 2>/dev/null; then
            echo "x11vnc failed to start."
            cat "$CLOUDCRAFT_DIR/logs/x11vnc.log"
            exit 1
          fi

          if ! (echo > /dev/tcp/127.0.0.1/"$VNC_PORT") \
              >/dev/null 2>&1; then
            echo "VNC port is not listening."
            cat "$CLOUDCRAFT_DIR/logs/x11vnc.log"
            exit 1
          fi

          echo "x11vnc is running."


      # ========================================================
      # 14. INSTALL / VERIFY NOVNC
      # ========================================================

      - name: Verify noVNC installation
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking noVNC..."

          command -v websockify || true
          command -v novnc || true

          echo
          echo "noVNC files:"

          find /usr/share/novnc \
            -maxdepth 3 \
            -type f \
            2>/dev/null \
            | head -100 || true

          echo
          echo "novnc_proxy locations:"

          find /usr \
            -type f \
            -name 'novnc_proxy' \
            -print \
            2>/dev/null \
            | head -20 || true


      # ========================================================
      # 15. START NOVNC
      # ========================================================

      - name: Start noVNC
        shell: bash
        run: |
          set -euo pipefail

          NOVNC_PROXY=""

          for candidate in \
            "/usr/share/novnc/utils/novnc_proxy" \
            "/usr/share/novnc/novnc_proxy" \
            "/usr/bin/novnc_proxy"
          do
            if [ -x "$candidate" ]; then
              NOVNC_PROXY="$candidate"
              break
            fi
          done

          if [ -z "$NOVNC_PROXY" ]; then
            echo "novnc_proxy executable was not found."

            echo
            echo "Installed noVNC files:"
            find /usr/share/novnc \
              -maxdepth 3 \
              -type f \
              -print \
              2>/dev/null || true

            echo
            echo "Installed commands:"
            command -v websockify || true
            command -v novnc || true

            exit 1
          fi

          echo "Using noVNC proxy:"
          echo "$NOVNC_PROXY"

          "$NOVNC_PROXY" \
            --vnc "127.0.0.1:$VNC_PORT" \
            --listen "127.0.0.1:$NOVNC_PORT" \
            > "$CLOUDCRAFT_DIR/logs/novnc.log" 2>&1 &

          NOVNC_PID=$!

          echo "$NOVNC_PID" \
            > "$CLOUDCRAFT_DIR/runtime/novnc.pid"

          echo "Waiting for noVNC..."

          for i in $(seq 1 20); do

            if curl \
              --silent \
              --fail \
              "http://127.0.0.1:$NOVNC_PORT/" \
              >/dev/null 2>&1
            then
              echo "noVNC is running."
              break
            fi

            if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
              echo
              echo "noVNC process died."

              cat "$CLOUDCRAFT_DIR/logs/novnc.log"

              exit 1
            fi

            sleep 1

          done

          if ! curl \
            --silent \
            --fail \
            "http://127.0.0.1:$NOVNC_PORT/" \
            >/dev/null 2>&1
          then

            echo "noVNC failed to start."

            echo
            echo "noVNC log:"
            cat "$CLOUDCRAFT_DIR/logs/novnc.log"

            exit 1
          fi

          echo "noVNC listening on localhost:$NOVNC_PORT"


      # ========================================================
      # 16. DOWNLOAD CLOUDFLARED
      # ========================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64)
              CLOUDFLARED_ARCH="amd64"
              ;;
            arm64)
              CLOUDFLARED_ARCH="arm64"
              ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          curl -fL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CLOUDFLARED_ARCH}" \
            -o "$RUNNER_TEMP/cloudflared"

          chmod +x "$RUNNER_TEMP/cloudflared"

          sudo install \
            -m 0755 \
            "$RUNNER_TEMP/cloudflared" \
            /usr/local/bin/cloudflared

          cloudflared --version


      # ========================================================
      # 17. START CLOUDFLARE QUICK TUNNEL
      # ========================================================

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Cloudflare Quick Tunnel..."

          cloudflared tunnel \
            --no-autoupdate \
            --url "http://127.0.0.1:$NOVNC_PORT" \
            > "$CLOUDCRAFT_DIR/logs/cloudflared.log" 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" \
            > "$CLOUDCRAFT_DIR/runtime/cloudflared.pid"

          echo "Waiting for Quick Tunnel URL..."

          TUNNEL_URL=""

          for i in $(seq 1 30); do

            TUNNEL_URL="$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                "$CLOUDCRAFT_DIR/logs/cloudflared.log" \
                | head -n 1 \
                || true
            )"

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "cloudflared exited."

              cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"

              exit 1
            fi

            sleep 1

          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Could not find Quick Tunnel URL."

            cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"

            exit 1
          fi

          echo "CLOUDFLARE_URL=$TUNNEL_URL" \
            >> "$GITHUB_ENV"

          {
            echo
            echo "## 🌐 CloudCraft Web"
            echo
            echo "**noVNC:** $TUNNEL_URL"
            echo
            echo "Open the URL above in your browser."
            echo
            echo "### Connection"
            echo
            echo "- Display: ${SCREEN_WIDTH}×${SCREEN_HEIGHT}"
            echo "- VNC: localhost:${VNC_PORT}"
            echo "- noVNC: localhost:${NOVNC_PORT}"
            echo "- Tailscale tag: \`tag:cloudcraft-runner\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "======================================"
          echo " CLOUDCRAFT URL"
          echo "======================================"
          echo "$TUNNEL_URL"
          echo "======================================"


      # ========================================================
      # 18. LAUNCH TLAUNCHER
      # ========================================================

      - name: Launch TLauncher
        shell: bash
        env:
          TLAUNCHER_JAR: ${{ steps.tlauncher.outputs.jar }}
        run: |
          set -euo pipefail

          export DISPLAY=:99

          cd "$TLAUNCHER_DIR"

          echo "Launching TLauncher:"
          echo "$TLAUNCHER_JAR"

          java \
            -Xms512M \
            -Xmx2G \
            -Djava.awt.headless=false \
            -jar "$TLAUNCHER_JAR" \
            > "$CLOUDCRAFT_DIR/logs/tlauncher.log" 2>&1 &

          TLAUNCHER_PID=$!

          echo "$TLAUNCHER_PID" \
            > "$CLOUDCRAFT_DIR/runtime/tlauncher.pid"

          echo "TLauncher PID: $TLAUNCHER_PID"

          sleep 5

          if ! kill -0 "$TLAUNCHER_PID" 2>/dev/null; then
            echo "TLauncher exited unexpectedly."

            cat "$CLOUDCRAFT_DIR/logs/tlauncher.log"

            exit 1
          fi

          echo "TLauncher is running."


      # ========================================================
      # 19. TLAUNCHER LOG
      # ========================================================

      - name: Show TLauncher startup log
        shell: bash
        run: |
          set -euo pipefail

          sleep 5

          echo "======================================"
          echo " TLauncher log"
          echo "======================================"

          tail -n 100 \
            "$CLOUDCRAFT_DIR/logs/tlauncher.log" \
            || true


      # ========================================================
      # 20. FINAL STATUS
      # ========================================================

      - name: CloudCraft status
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " CloudCraft Status"
          echo "======================================"

          echo
          echo "Processes:"

          ps aux | grep -E \
            'Xvfb|x11vnc|websockify|novnc|cloudflared|TLauncher|java' \
            | grep -v grep \
            || true

          echo
          echo "Listening ports:"

          ss -lntp \
            | grep -E \
              ':5900|:6080' \
            || true

          echo
          echo "======================================"
          echo " CloudCraft is ready"
          echo "======================================"

          echo
          echo "Browser:"
          echo "${CLOUDFLARE_URL:-NOT_AVAILABLE}"


      # ========================================================
      # 21. KEEP RUNNER ALIVE
      # ========================================================

      - name: Keep CloudCraft alive
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo " CloudCraft is running"
          echo "======================================"

          echo
          echo "Web:"
          echo "${CLOUDFLARE_URL:-NOT_AVAILABLE}"

          echo
          echo "VNC password is available in the job summary."

          echo
          echo "The runner will stay alive until the"
          echo "GitHub Actions job reaches its timeout."

          while true; do

            if [ -f "$CLOUDCRAFT_DIR/runtime/tlauncher.pid" ]; then
              TLAUNCHER_PID="$(cat "$CLOUDCRAFT_DIR/runtime/tlauncher.pid")"

              if ! kill -0 "$TLAUNCHER_PID" 2>/dev/null; then
                echo "TLauncher stopped."

                tail -n 100 \
                  "$CLOUDCRAFT_DIR/logs/tlauncher.log" \
                  || true

                exit 1
              fi
            fi

            if [ -f "$CLOUDCRAFT_DIR/runtime/cloudflared.pid" ]; then
              CLOUDFLARED_PID="$(cat "$CLOUDCRAFT_DIR/runtime/cloudflared.pid")"

              if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
                echo "cloudflared stopped."

                cat "$CLOUDCRAFT_DIR/logs/cloudflared.log" \
                  || true

                exit 1
              fi
            fi

            sleep 30

          done


      # ========================================================
      # 22. SAVE CLOUDCRAFT DATA
      # ========================================================

      - name: Save CloudCraft data to MinIO
        if: always()
        shell: bash
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          set +e

          echo "======================================"
          echo " Saving CloudCraft data"
          echo "======================================"

          if [ -z "${MINIO_ENDPOINT:-}" ]; then
            echo "MINIO_ENDPOINT is missing."
            exit 0
          fi

          if [ -z "${MINIO_BUCKET:-}" ]; then
            echo "MINIO_BUCKET is missing."
            exit 0
          fi

          if [ ! -d "$CLOUDCRAFT_DIR/minecraft" ]; then
            echo "Minecraft data directory does not exist."
            exit 0
          fi

          echo "Syncing Minecraft data to MinIO..."

          aws s3 sync \
            "$CLOUDCRAFT_DIR/minecraft/" \
            "s3://$MINIO_BUCKET/cloudcraft/" \
            --endpoint-url "$MINIO_ENDPOINT" \
            --no-progress

          echo
          echo "CloudCraft data saved."


      # ========================================================
      # 23. UPLOAD LOGS
      # ========================================================

      - name: Upload CloudCraft logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcraft-logs
          path: |
            /home/runner/cloudcraft/logs/
          if-no-files-found: ignore
          retention-days: 3
