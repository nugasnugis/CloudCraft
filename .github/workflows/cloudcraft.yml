name: CloudCraft Minecraft Cloud Client

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  cloudcraft:
    name: CloudCraft Runner
    runs-on: ubuntu-latest

    # GitHub-hosted runner has a maximum job execution time.
    # We save the Minecraft data periodically to MinIO so the
    # next runner can restore it.
    timeout-minutes: 350

    env:
      DISPLAY: :99
      SCREEN_WIDTH: 1280
      SCREEN_HEIGHT: 720
      SCREEN_DEPTH: 24

      # -----------------------------
      # CloudCraft paths
      # -----------------------------
      CLOUDCRAFT_DIR: /home/runner/cloudcraft
      MINECRAFT_DIR: /home/runner/.minecraft
      TLAUNCHER_DIR: /home/runner/.tlauncher

      # -----------------------------
      # MinIO
      # -----------------------------
      MINIO_BUCKET: cloudcraft

      # -----------------------------
      # VNC
      # -----------------------------
      VNC_PORT: 5900
      NOVNC_PORT: 6080

    steps:

      # ============================================================
      # 1. BASIC SYSTEM CHECK
      # ============================================================

      - name: Check runner
        run: |
          set -eux

          echo "=== OS ==="
          cat /etc/os-release

          echo
          echo "=== CPU ==="
          nproc

          echo
          echo "=== MEMORY ==="
          free -h

          echo
          echo "=== DISK ==="
          df -h


      # ============================================================
      # 2. JAVA 21
      #
      # IMPORTANT:
      # NO cache: gradle
      #
      # CloudCraft is not a Gradle project.
      # This prevents setup-java from searching for Gradle files.
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: ''


      - name: Verify Java
        run: |
          set -eux

          java -version
          javac -version


      # ============================================================
      # 3. GUI / OPENGL DEPENDENCIES
      #
      # Ubuntu 24.04 compatible.
      #
      # DO NOT USE:
      # libgl1-mesa-glx
      #
      # It is obsolete/unavailable on the current runner.
      # ============================================================

      - name: Install GUI dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11vnc \
            fluxbox \
            mesa-utils \
            libgl1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libgbm1 \
            libglu1-mesa \
            libosmesa6 \
            libx11-xcb1 \
            libxcb1 \
            libxrandr2 \
            libxinerama1 \
            libxcursor1 \
            libxi6 \
            libxtst6 \
            libxrender1 \
            libxfixes3 \
            libxdamage1 \
            libxcomposite1 \
            libasound2t64 \
            libpulse0 \
            unzip \
            curl \
            wget \
            jq \
            openssl \
            python3 \
            python3-pip


      # ============================================================
      # 4. TAILSCALE
      #
      # Secrets required:
      #
      # TS_OAUTH_CLIENT_ID
      # TS_OAUTH_SECRET
      #
      # Tag:
      # tag:cloudcraft-runner
      # ============================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cloudcraft-runner


      - name: Verify Tailscale
        run: |
          set -eux

          tailscale version
          tailscale status


      # ============================================================
      # 5. TEST CONNECTION TO MINIO
      #
      # Required secret:
      #
      # MINIO_ENDPOINT
      #
      # Example:
      #
      # http://100.x.x.x:9000
      #
      # Do NOT include /bucket at the end.
      # ============================================================

      - name: Test MinIO connection
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -eux

          echo "Testing MinIO..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            "http://${MINIO_ENDPOINT}:9000/minio/health/live"

          echo
          echo "MinIO is reachable."


      # ============================================================
      # 6. INSTALL AWS CLI
      #
      # We use AWS CLI because MinIO exposes an S3-compatible API.
      #
      # Do NOT use:
      #
      # sudo apt install awscli
      #
      # because ubuntu-latest repositories may not provide it.
      # ============================================================

      - name: Install AWS CLI
        run: |
          set -eux

          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed."
            aws --version
            exit 0
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o /tmp/awscliv2.zip

          rm -rf /tmp/aws

          unzip -q /tmp/awscliv2.zip -d /tmp

          sudo /tmp/aws/install --update

          aws --version


      # ============================================================
      # 7. PREPARE CLOUDCRAFT DIRECTORIES
      # ============================================================

      - name: Prepare CloudCraft directories
        run: |
          set -eux

          mkdir -p "$CLOUDCRAFT_DIR"

          mkdir -p "$MINECRAFT_DIR"

          mkdir -p "$TLAUNCHER_DIR"

          mkdir -p "$CLOUDCRAFT_DIR/backups"

          mkdir -p "$CLOUDCRAFT_DIR/logs"


      # ============================================================
      # 8. CONFIGURE AWS CLI FOR MINIO
      # ============================================================

      - name: Configure MinIO S3
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          set -eux

          mkdir -p "$HOME/.aws"

          cat > "$HOME/.aws/credentials" <<EOF
          [default]
          aws_access_key_id = ${MINIO_ACCESS_KEY}
          aws_secret_access_key = ${MINIO_SECRET_KEY}
          EOF

          cat > "$HOME/.aws/config" <<EOF
          [default]
          region = us-east-1
          EOF

          chmod 600 "$HOME/.aws/credentials"

          echo "MinIO AWS credentials configured."


      # ============================================================
      # 9. CHECK / CREATE MINIO BUCKET
      # ============================================================

      - name: Prepare MinIO bucket
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -eux

          aws \
            --endpoint-url "$MINIO_ENDPOINT" \
            s3api head-bucket \
            --bucket "$MINIO_BUCKET" \
            2>/dev/null || \
          aws \
            --endpoint-url "$MINIO_ENDPOINT" \
            s3 mb \
            "s3://$MINIO_BUCKET"

          echo "MinIO bucket ready."


      # ============================================================
      # 10. RESTORE PREVIOUS CLOUDCRAFT DATA
      #
      # This restores:
      #
      # ~/.minecraft
      # ~/.tlauncher
      #
      # The runner starts clean every time, so this is important.
      # ============================================================

      - name: Restore Minecraft data
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -eux

          echo "Restoring Minecraft data from MinIO..."

          aws \
            --endpoint-url "$MINIO_ENDPOINT" \
            s3 sync \
            "s3://$MINIO_BUCKET/minecraft/" \
            "$MINECRAFT_DIR/" \
            --only-show-errors \
            || true

          echo "Restoring TLauncher data..."

          aws \
            --endpoint-url "$MINIO_ENDPOINT" \
            s3 sync \
            "s3://$MINIO_BUCKET/tlauncher/" \
            "$TLAUNCHER_DIR/" \
            --only-show-errors \
            || true

          echo
          echo "Restore complete."


      # ============================================================
      # 11. DOWNLOAD TLaucher v17
      #
      # Official URL supplied for the CloudCraft project.
      #
      # This workflow uses TLauncher as the Minecraft launcher.
      # Authentication/login remains the launcher's responsibility.
      # ============================================================

      - name: Download TLauncher v17
        run: |
          set -eux

          cd "$CLOUDCRAFT_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            "https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip" \
            -o TLauncher.v17.zip

          ls -lh TLauncher.v17.zip


      # ============================================================
      # 12. EXTRACT TLAUNCHER
      # ============================================================

      - name: Extract TLauncher
        run: |
          set -eux

          rm -rf "$CLOUDCRAFT_DIR/tlauncher"

          mkdir -p "$CLOUDCRAFT_DIR/tlauncher"

          unzip -q \
            "$CLOUDCRAFT_DIR/TLauncher.v17.zip" \
            -d "$CLOUDCRAFT_DIR/tlauncher"

          find "$CLOUDCRAFT_DIR/tlauncher" \
            -maxdepth 3 \
            -type f \
            -name "*.jar" \
            -print


      # ============================================================
      # 13. FIND TLAUNCHER JAR
      # ============================================================

      - name: Find TLauncher JAR
        run: |
          set -eux

          TLAUNCHER_JAR="$(find \
            "$CLOUDCRAFT_DIR/tlauncher" \
            -type f \
            -iname "*.jar" \
            | head -n 1)"

          if [ -z "$TLAUNCHER_JAR" ]; then
            echo "::error::TLauncher JAR was not found."
            exit 1
          fi

          echo "TLAUNCHER_JAR=$TLAUNCHER_JAR" \
            >> "$GITHUB_ENV"

          echo "TLauncher JAR:"
          echo "$TLAUNCHER_JAR"


      # ============================================================
      # 14. START VIRTUAL DISPLAY
      # ============================================================

      - name: Start Xvfb
        run: |
          set -eux

          Xvfb "$DISPLAY" \
            -screen 0 "${SCREEN_WIDTH}x${SCREEN_HEIGHT}x${SCREEN_DEPTH}" \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > "$CLOUDCRAFT_DIR/logs/xvfb.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/xvfb.pid"

          sleep 3


      # ============================================================
      # 15. START FLUXBOX
      # ============================================================

      - name: Start Fluxbox
        run: |
          set -eux

          fluxbox \
            > "$CLOUDCRAFT_DIR/logs/fluxbox.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/fluxbox.pid"

          sleep 2


      # ============================================================
      # 16. CHECK X DISPLAY
      # ============================================================

      - name: Check virtual display
        run: |
          set -eux

          xdpyinfo >/dev/null

          echo "Virtual display is working."


      # ============================================================
      # 17. CHECK OPENGL
      #
      # GitHub runner normally has software rendering:
      #
      # llvmpipe
      #
      # This is expected.
      # ============================================================

      - name: Check OpenGL
        run: |
          set -eux

          glxinfo -B || true


      # ============================================================
      # 18. CREATE VNC PASSWORD
      #
      # x11vnc password files have a short password limit.
      #
      # We generate 8 random alphanumeric characters.
      #
      # Password is written to GitHub Step Summary.
      # ============================================================

      - name: Generate VNC password
        shell: bash
        run: |
          set -euo pipefail

          VNC_PASSWORD="$(
            tr -dc 'A-Za-z0-9' \
              < /dev/urandom \
              | head -c 8 \
              || true
          )"

          if [ "${#VNC_PASSWORD}" -ne 8 ]; then
            VNC_PASSWORD="$(openssl rand -hex 4)"
          fi

          printf '%s\n' "$VNC_PASSWORD" \
            > "$CLOUDCRAFT_DIR/vnc-password-plain.txt"

          chmod 600 \
            "$CLOUDCRAFT_DIR/vnc-password-plain.txt"

          x11vnc \
            -storepasswd \
            "$VNC_PASSWORD" \
            "$CLOUDCRAFT_DIR/vnc-password.txt"

          chmod 600 \
            "$CLOUDCRAFT_DIR/vnc-password.txt"

          {
            echo "## ? CloudCraft VNC"
            echo
            echo "**VNC password:**"
            echo
            echo '```'
            echo "$VNC_PASSWORD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 19. START X11VNC
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT use:
      #
      # -encodings tight
      #
      # because the x11vnc build on the runner rejected it.
      #
      # Instead we use x11vnc's own performance options.
      # ============================================================

      - name: Start x11vnc
        run: |
          set -eux

          x11vnc \
            -display "$DISPLAY" \
            -rfbport "$VNC_PORT" \
            -rfbauth "$CLOUDCRAFT_DIR/vnc-password.txt" \
            -forever \
            -shared \
            -repeat \
            -noxdamage \
            -noxfixes \
            -noxrecord \
            -noxkb \
            -cursor arrow \
            -wait 5 \
            -defer 5 \
            -threads \
            > "$CLOUDCRAFT_DIR/logs/x11vnc.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/x11vnc.pid"

          sleep 3

          if ! kill -0 "$(cat "$CLOUDCRAFT_DIR/x11vnc.pid")" 2>/dev/null; then
            echo "::error::x11vnc failed to start."
            cat "$CLOUDCRAFT_DIR/logs/x11vnc.log"
            exit 1
          fi

          echo "x11vnc is running."


      # ============================================================
      # 20. INSTALL noVNC
      #
      # We install directly from the official noVNC repository
      # instead of relying on Ubuntu's noVNC package.
      #
      # This avoids the previous:
      #
      # novnc_proxy: command not found
      #
      # problem.
      # ============================================================

      - name: Install noVNC
        run: |
          set -eux

          cd "$CLOUDCRAFT_DIR"

          rm -rf noVNC

          git clone \
            --depth 1 \
            https://github.com/novnc/noVNC.git \
            noVNC

          cd noVNC

          if [ -f utils/novnc_proxy ]; then
            chmod +x utils/novnc_proxy
          fi

          if [ -f utils/novnc_proxy ]; then
            echo "noVNC installed."
          else
            echo "::error::novnc_proxy was not found."
            exit 1
          fi


      # ============================================================
      # 21. START noVNC / WEBSOCKIFY
      # ============================================================

      - name: Start noVNC
        run: |
          set -eux

          cd "$CLOUDCRAFT_DIR/noVNC"

          ./utils/novnc_proxy \
            --vnc "127.0.0.1:${VNC_PORT}" \
            --listen "${NOVNC_PORT}" \
            > "$CLOUDCRAFT_DIR/logs/novnc.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/novnc.pid"

          sleep 5

          if ! curl \
            --fail \
            --silent \
            --max-time 5 \
            "http://127.0.0.1:${NOVNC_PORT}/vnc.html" \
            >/dev/null; then

            echo "::error::noVNC failed to start."

            cat "$CLOUDCRAFT_DIR/logs/novnc.log"

            exit 1
          fi

          echo "noVNC is running."


      # ============================================================
      # 22. CLOUDFLARE QUICK TUNNEL
      #
      # This exposes noVNC:
      #
      # localhost:6080
      #
      # to:
      #
      # https://xxxxx.trycloudflare.com
      # ============================================================

      - name: Install cloudflared
        run: |
          set -eux

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64)
              CLOUDFLARED_ARCH="amd64"
              ;;
            arm64)
              CLOUDFLARED_ARCH="arm64"
              ;;
            *)
              echo "::error::Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          curl \
            --fail \
            --location \
            --retry 5 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CLOUDFLARED_ARCH}" \
            -o "$CLOUDCRAFT_DIR/cloudflared"

          chmod +x \
            "$CLOUDCRAFT_DIR/cloudflared"

          "$CLOUDCRAFT_DIR/cloudflared" --version


      - name: Start Cloudflare Quick Tunnel
        run: |
          set -eux

          "$CLOUDCRAFT_DIR/cloudflared" \
            tunnel \
            --no-autoupdate \
            --url "http://127.0.0.1:${NOVNC_PORT}" \
            > "$CLOUDCRAFT_DIR/logs/cloudflared.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/cloudflared.pid"

          echo "Waiting for Cloudflare tunnel..."

          for i in $(seq 1 30); do

            if grep -Eo \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$CLOUDCRAFT_DIR/logs/cloudflared.log" \
              | head -n 1 \
              > "$CLOUDCRAFT_DIR/cloudflare-url.txt"; then

              break
            fi

            sleep 2

          done

          if [ ! -s "$CLOUDCRAFT_DIR/cloudflare-url.txt" ]; then
            echo "::error::Cloudflare Quick Tunnel URL was not found."

            cat "$CLOUDCRAFT_DIR/logs/cloudflared.log"

            exit 1
          fi

          CLOUDFLARE_URL="$(cat "$CLOUDCRAFT_DIR/cloudflare-url.txt")"

          echo
          echo "=========================================="
          echo " CLOUDCRAFT WEB URL"
          echo "=========================================="
          echo "$CLOUDFLARE_URL/vnc.html"
          echo "=========================================="

          {
            echo
            echo "## ? CloudCraft Web Client"
            echo
            echo "**Browser URL:**"
            echo
            echo "$CLOUDFLARE_URL/vnc.html"
            echo
            echo "> Open the URL above in your browser."
            echo
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 23. SAVE VNC CONNECTION INFORMATION
      # ============================================================

      - name: Show CloudCraft connection information
        run: |
          set -eux

          CLOUDFLARE_URL="$(cat "$CLOUDCRAFT_DIR/cloudflare-url.txt")"

          echo
          echo "????????????????????????????????????????????"
          echo "?           CLOUDCRAFT READY               ?"
          echo "????????????????????????????????????????????"
          echo
          echo "Web:"
          echo "$CLOUDFLARE_URL/vnc.html"
          echo
          echo "VNC password:"
          cat "$CLOUDCRAFT_DIR/vnc-password-plain.txt"
          echo


      # ============================================================
      # 24. BACKGROUND SAVE LOOP
      #
      # Saves every 5 minutes.
      #
      # This is VERY important because GitHub-hosted runners are
      # temporary and a job can be terminated at the maximum limit.
      #
      # GitHub currently documents a 6-hour maximum for a hosted
      # runner job.
      # ============================================================

      - name: Start automatic MinIO backup
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set -euo pipefail

          cat > "$CLOUDCRAFT_DIR/backup-loop.sh" <<'EOF'
          #!/usr/bin/env bash

          set -euo pipefail

          while true; do

            echo "[$(date)] CloudCraft backup started."

            aws \
              --endpoint-url "$MINIO_ENDPOINT" \
              s3 sync \
              "$MINECRAFT_DIR/" \
              "s3://$MINIO_BUCKET/minecraft/" \
              --only-show-errors \
              || true

            aws \
              --endpoint-url "$MINIO_ENDPOINT" \
              s3 sync \
              "$TLAUNCHER_DIR/" \
              "s3://$MINIO_BUCKET/tlauncher/" \
              --only-show-errors \
              || true

            echo "[$(date)] CloudCraft backup finished."

            sleep 300

          done
          EOF

          chmod +x "$CLOUDCRAFT_DIR/backup-loop.sh"

          nohup \
            "$CLOUDCRAFT_DIR/backup-loop.sh" \
            > "$CLOUDCRAFT_DIR/logs/backup.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/backup-loop.pid"

          echo "Automatic backup started."


      # ============================================================
      # 25. START TLAUNCHER
      #
      # IMPORTANT:
      #
      # TLauncher itself is the launcher.
      #
      # Minecraft/Fabric version selection can be done from
      # TLauncher's version selector.
      #
      # We do not install Fabric separately here.
      # ============================================================

      - name: Start TLauncher
        run: |
          set -eux

          cd "$CLOUDCRAFT_DIR"

          echo "Starting TLauncher..."

          nohup \
            java \
            -Xms512M \
            -Xmx5G \
            -XX:+UseG1GC \
            -XX:+ParallelRefProcEnabled \
            -XX:MaxGCPauseMillis=50 \
            -XX:+UnlockExperimentalVMOptions \
            -XX:+DisableExplicitGC \
            -Djava.awt.headless=false \
            -jar "$TLAUNCHER_JAR" \
            > "$CLOUDCRAFT_DIR/logs/tlauncher.log" 2>&1 &

          echo $! > "$CLOUDCRAFT_DIR/tlauncher.pid"

          sleep 10

          if ! kill -0 "$(cat "$CLOUDCRAFT_DIR/tlauncher.pid")" 2>/dev/null; then
            echo "::error::TLauncher exited."

            cat "$CLOUDCRAFT_DIR/logs/tlauncher.log"

            exit 1
          fi

          echo "TLauncher is running."


      # ============================================================
      # 26. FINAL STATUS
      # ============================================================

      - name: CloudCraft status
        run: |
          set -eux

          echo "=== Processes ==="

          ps aux | grep -E \
            'Xvfb|fluxbox|x11vnc|novnc|cloudflared|TLauncher|java' \
            | grep -v grep \
            || true

          echo
          echo "=== Ports ==="

          ss -lntp \
            | grep -E \
              ':5900|:6080' \
            || true

          echo
          echo "=== Cloudflare ==="

          cat "$CLOUDCRAFT_DIR/cloudflare-url.txt"

          echo
          echo "CloudCraft is ready."


      # ============================================================
      # 27. KEEP RUNNER ALIVE
      #
      # GitHub Actions will eventually terminate the job at its
      # platform limit. Meanwhile Minecraft remains accessible.
      # ============================================================

      - name: Keep CloudCraft alive
        run: |
          set -eux

          echo
          echo "=============================================="
          echo " CloudCraft is running."
          echo "=============================================="
          echo

          CLOUDFLARE_URL="$(cat "$CLOUDCRAFT_DIR/cloudflare-url.txt")"

          echo "Browser:"
          echo "$CLOUDFLARE_URL/vnc.html"

          echo
          echo "VNC password:"
          cat "$CLOUDCRAFT_DIR/vnc-password-plain.txt"

          echo
          echo "Automatic MinIO backup:"
          echo "Every 5 minutes"

          echo
          echo "Pressing Ctrl+C is NOT recommended."
          echo

          while true; do

            if ! kill -0 \
              "$(cat "$CLOUDCRAFT_DIR/tlauncher.pid")" \
              2>/dev/null; then

              echo "::error::TLauncher stopped."

              tail -n 100 \
                "$CLOUDCRAFT_DIR/logs/tlauncher.log" \
                || true

              exit 1
            fi

            sleep 30

          done


      # ============================================================
      # 28. FINAL BACKUP
      #
      # This executes when GitHub is able to run post-job cleanup.
      # Periodic backup remains the primary protection.
      # ============================================================

      - name: Final MinIO backup
        if: always()
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
        run: |
          set +e

          echo "Final CloudCraft backup..."

          aws \
            --endpoint-url "$MINIO_ENDPOINT" \
            s3 sync \
            "$MINECRAFT_DIR/" \
            "s3://$MINIO_BUCKET/minecraft/" \
            --only-show-errors

          aws \
            --endpoint-url "$MINIO_ENDPOINT" \
            s3 sync \
            "$TLAUNCHER_DIR/" \
            "s3://$MINIO_BUCKET/tlauncher/" \
            --only-show-errors

          echo "Final backup finished."


      # ============================================================
      # 29. UPLOAD LOGS AS ARTIFACT
      # ============================================================

      - name: Upload CloudCraft logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcraft-logs
          path: |
            /home/runner/cloudcraft/logs/
          retention-days: 1
          if-no-files-found: ignore
