name: CloudCraft TLauncher Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudcraft:
    name: CloudCraft Minecraft Runtime
    runs-on: ubuntu-latest

    # GitHub-hosted runner has a maximum job runtime.
    # Leave some buffer before the hard limit.
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================

      - name: Check system
        run: |
          echo "=========================================="
          echo "       CLOUDCRAFT SYSTEM INFORMATION"
          echo "=========================================="

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "OS:"
          cat /etc/os-release


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            openjdk-21-jre \
            unzip \
            curl \
            wget \
            xvfb \
            x11-utils \
            mesa-utils \
            x11vnc \
            novnc \
            websockify \
            openssl

          echo
          echo "=========================================="
          echo "Dependencies installed successfully."
          echo "=========================================="


      # ============================================================
      # 3. VERIFY JAVA
      # ============================================================

      - name: Verify Java
        run: |
          echo "Java version:"
          java -version

          echo
          echo "JAVA_HOME:"
          echo "${JAVA_HOME:-not set}"


      # ============================================================
      # 4. START Xvfb
      # ============================================================

      - name: Start virtual display
        run: |
          echo "Starting Xvfb..."

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid

          sleep 3

          echo "Xvfb started."
          echo "PID: $(cat /tmp/xvfb.pid)"


      # ============================================================
      # 5. VERIFY DISPLAY
      # ============================================================

      - name: Check virtual display
        env:
          DISPLAY: :99
        run: |
          echo "DISPLAY=$DISPLAY"

          xdpyinfo >/dev/null

          echo
          echo "Virtual display is working."


      # ============================================================
      # 6. CHECK OPENGL
      # ============================================================

      - name: Check OpenGL
        env:
          DISPLAY: :99
        run: |
          echo "=========================================="
          echo "             OPENGL INFORMATION"
          echo "=========================================="

          glxinfo -B || true


      # ============================================================
      # 7. DOWNLOAD TLAUNCHER
      # ============================================================

      - name: Download TLauncher v17
        run: |
          mkdir -p "$HOME/tlauncher"

          cd "$HOME/tlauncher"

          echo "Downloading TLauncher v17..."

          curl \
            -fL \
            --retry 3 \
            --retry-delay 2 \
            -o TLauncher.v17.zip \
            'https://dl1.tlauncher.org/f.php?f=files%2FTLauncher.v17.zip'

          echo
          echo "Downloaded file:"
          ls -lh TLauncher.v17.zip

          echo
          echo "File information:"
          file TLauncher.v17.zip


      # ============================================================
      # 8. EXTRACT TLAUNCHER
      # ============================================================

      - name: Extract TLauncher
        run: |
          cd "$HOME/tlauncher"

          echo "Extracting TLauncher..."

          unzip -o TLauncher.v17.zip

          echo
          echo "TLauncher directory:"
          find . -maxdepth 3 -type f -print


      # ============================================================
      # 9. FIND TLAUNCHER JAR
      # ============================================================

      - name: Find launcher JAR
        id: launcher
        run: |
          cd "$HOME/tlauncher"

          echo "Searching for TLauncher JAR..."

          JAR=$(find . -type f -name "TLauncher.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "TLauncher.jar was not found."

            echo
            echo "Available JAR files:"
            find . -type f -name "*.jar" -print

            exit 1
          fi

          echo
          echo "Found:"
          echo "$JAR"

          FULL_JAR="$HOME/tlauncher/${JAR#./}"

          echo "Launcher JAR:"
          echo "$FULL_JAR"

          echo "jar=$FULL_JAR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 10. CREATE VNC PASSWORD
      # ============================================================

      - name: Create VNC password
        run: |
          echo "Generating VNC password..."

          # Classic VNC/RFB authentication uses only the first
          # 8 characters of the password.
          VNC_PASSWORD=$(openssl rand -hex 4)

          # IMPORTANT:
          # Do NOT mask this variable because we intentionally
          # display it in GitHub Actions Summary for development.
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"

          x11vnc \
            -storepasswd \
            "$VNC_PASSWORD" \
            /tmp/cloudcraft-vnc.pass

          chmod 600 /tmp/cloudcraft-vnc.pass

          echo
          echo "VNC password generated."
          echo "Password length: ${#VNC_PASSWORD}"


      # ============================================================
      # 11. START x11vnc
      # ============================================================

      - name: Start VNC server
        env:
          DISPLAY: :99
        run: |
          echo "Starting x11vnc..."

          x11vnc \
            -display :99 \
            -rfbport 5900 \
            -rfbauth /tmp/cloudcraft-vnc.pass \
            -localhost \
            -forever \
            -shared \
            -noxdamage \
            -repeat \
            > /tmp/x11vnc.log 2>&1 &

          echo $! > /tmp/x11vnc.pid

          sleep 3

          echo
          echo "x11vnc started."
          echo "PID: $(cat /tmp/x11vnc.pid)"


      # ============================================================
      # 12. VERIFY VNC
      # ============================================================

      - name: Verify VNC server
        run: |
          echo "Checking VNC process..."

          if ! kill -0 "$(cat /tmp/x11vnc.pid)" 2>/dev/null; then
            echo "ERROR: x11vnc is not running."

            echo
            echo "========== x11vnc LOG =========="
            cat /tmp/x11vnc.log || true

            exit 1
          fi

          echo "x11vnc process is running."

          echo
          echo "Checking port 5900..."

          for i in {1..10}; do
            if (echo > /dev/tcp/127.0.0.1/5900) 2>/dev/null; then
              echo "VNC port 5900 is available."
              break
            fi

            echo "Waiting for VNC..."
            sleep 1
          done

          if ! (echo > /dev/tcp/127.0.0.1/5900) 2>/dev/null; then
            echo "ERROR: VNC port 5900 is not available."

            echo
            echo "========== x11vnc LOG =========="
            cat /tmp/x11vnc.log || true

            exit 1
          fi

          echo
          echo "VNC server is ready."


      # ============================================================
      # 13. START NOVNC
      # ============================================================

      - name: Start noVNC
        run: |
          echo "Starting noVNC..."

          websockify \
            --web=/usr/share/novnc/ \
            6080 \
            127.0.0.1:5900 \
            > /tmp/novnc.log 2>&1 &

          echo $! > /tmp/novnc.pid

          sleep 3

          echo
          echo "noVNC started."
          echo "PID: $(cat /tmp/novnc.pid)"


      # ============================================================
      # 14. VERIFY NOVNC
      # ============================================================

      - name: Verify noVNC
        run: |
          echo "Checking noVNC..."

          if ! kill -0 "$(cat /tmp/novnc.pid)" 2>/dev/null; then
            echo "ERROR: noVNC/websockify is not running."

            echo
            echo "========== noVNC LOG =========="
            cat /tmp/novnc.log || true

            exit 1
          fi

          echo "noVNC process is running."

          echo
          echo "Checking HTTP port 6080..."

          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:6080/ >/dev/null; then
              echo "noVNC HTTP server is ready."
              break
            fi

            echo "Waiting for noVNC..."
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:6080/ >/dev/null; then
            echo "ERROR: noVNC HTTP server is not responding."

            echo
            echo "========== noVNC LOG =========="
            cat /tmp/novnc.log || true

            exit 1
          fi

          echo
          echo "noVNC is ready."


      # ============================================================
      # 15. START TLAUNCHER
      # ============================================================

      - name: Start TLauncher
        env:
          DISPLAY: :99
        run: |
          echo "=========================================="
          echo "            STARTING TLAUNCHER"
          echo "=========================================="

          LAUNCHER="${{ steps.launcher.outputs.jar }}"

          echo
          echo "Launcher:"
          echo "$LAUNCHER"

          echo
          echo "Java:"
          java -version

          echo
          echo "Starting TLauncher..."

          nohup \
            java \
            -jar "$LAUNCHER" \
            > /tmp/tlauncher.log 2>&1 &

          echo $! > /tmp/tlauncher.pid

          sleep 10

          echo
          echo "TLauncher PID:"
          cat /tmp/tlauncher.pid

          echo
          echo "TLauncher process:"
          ps aux | grep -i TLauncher | grep -v grep || true

          echo
          echo "========== TLauncher LOG =========="
          cat /tmp/tlauncher.log || true


      # ============================================================
      # 16. INSTALL CLOUDFLARED
      # ============================================================

      - name: Install cloudflared
        run: |
          echo "Installing cloudflared..."

          ARCH=$(dpkg --print-architecture)

          echo "System architecture:"
          echo "$ARCH"

          case "$ARCH" in
            amd64)
              CLOUDFLARED_ARCH="amd64"
              ;;

            arm64)
              CLOUDFLARED_ARCH="arm64"
              ;;

            armhf)
              CLOUDFLARED_ARCH="arm"
              ;;

            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          echo
          echo "Cloudflared architecture:"
          echo "$CLOUDFLARED_ARCH"

          curl \
            --location \
            --fail \
            --retry 3 \
            -o /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CLOUDFLARED_ARCH}.deb"

          echo
          echo "Installing package..."

          sudo dpkg -i /tmp/cloudflared.deb

          echo
          echo "Cloudflared version:"
          cloudflared version


      # ============================================================
      # 17. START CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: Start Cloudflare Quick Tunnel
        run: |
          echo "=========================================="
          echo "      CLOUDFLARE QUICK TUNNEL"
          echo "=========================================="

          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          echo
          echo "cloudflared started."
          echo "PID: $(cat /tmp/cloudflared.pid)"

          echo
          echo "Waiting for Quick Tunnel URL..."

          TUNNEL_URL=""

          for i in {1..30}; do

            TUNNEL_URL=$(
              grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log \
              | head -n 1 || true
            )

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2

          done

          if [ -z "$TUNNEL_URL" ]; then
            echo
            echo "ERROR: Cloudflare Quick Tunnel URL was not found."

            echo
            echo "========== CLOUDFLARED LOG =========="
            cat /tmp/cloudflared.log || true

            exit 1
          fi

          # noVNC page
          VNC_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "VNC_URL=$VNC_URL" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "       CLOUDCRAFT BROWSER ACCESS"
          echo "=========================================="
          echo
          echo "noVNC:"
          echo "$VNC_URL"
          echo
          echo "=========================================="


      # ============================================================
      # 18. FINAL CONNECTIVITY CHECK
      # ============================================================

      - name: Verify CloudCraft services
        run: |
          echo "=========================================="
          echo "        CLOUDCRAFT SERVICE STATUS"
          echo "=========================================="

          echo
          echo "Xvfb:"
          if kill -0 "$(cat /tmp/xvfb.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "NOT RUNNING"
          fi

          echo
          echo "x11vnc:"
          if kill -0 "$(cat /tmp/x11vnc.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "NOT RUNNING"
          fi

          echo
          echo "noVNC:"
          if kill -0 "$(cat /tmp/novnc.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "NOT RUNNING"
          fi

          echo
          echo "TLauncher:"
          if kill -0 "$(cat /tmp/tlauncher.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "NOT RUNNING"
          fi

          echo
          echo "Cloudflare:"
          if kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "NOT RUNNING"
          fi

          echo
          echo "Local noVNC:"
          curl -I \
            --max-time 5 \
            http://127.0.0.1:6080/ \
            || true

          echo
          echo "=========================================="


      # ============================================================
      # 19. GITHUB ACTIONS SUMMARY
      # ============================================================

      - name: Show CloudCraft access information
        run: |
          {
            echo "# ?? CloudCraft Runtime"
            echo
            echo "## ? Browser Access"
            echo
            echo "### ?? Open CloudCraft"
            echo
            echo "$VNC_URL"
            echo
            echo "### ? VNC Password"
            echo
            echo '```text'
            echo "$VNC_PASSWORD"
            echo '```'
            echo
            echo "## ?? Runtime"
            echo
            echo "| Component | Value |"
            echo "|---|---|"
            echo "| Display | :99 |"
            echo "| Resolution | 1280x720 |"
            echo "| VNC | 5900 |"
            echo "| noVNC | 6080 |"
            echo "| Renderer | llvmpipe |"
            echo "| Java | 21 |"
            echo "| TLauncher | v17 |"
            echo "| Tunnel | Cloudflare Quick Tunnel |"
            echo
            echo "## ?? Important"
            echo
            echo "This Cloudflare Quick Tunnel is temporary."
            echo "The URL changes when the workflow is restarted."
            echo
            echo "The VNC password is intentionally shown here for development."
            echo "Do not share the URL and password publicly."
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "=========================================="
          echo "       CLOUDCRAFT READY"
          echo "=========================================="
          echo
          echo "Browser URL:"
          echo "$VNC_URL"
          echo
          echo "VNC Password:"
          echo "$VNC_PASSWORD"
          echo
          echo "=========================================="


      # ============================================================
      # 20. KEEP CLOUDCRAFT ALIVE
      # ============================================================

      - name: Keep CloudCraft running
        env:
          DISPLAY: :99
        run: |
          echo
          echo "=========================================="
          echo "        ?? CLOUDCRAFT IS RUNNING"
          echo "=========================================="
          echo
          echo "Open this URL:"
          echo
          echo "$VNC_URL"
          echo
          echo "VNC password:"
          echo "$VNC_PASSWORD"
          echo
          echo "=========================================="
          echo

          while true; do

            echo
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CloudCraft heartbeat"

            echo
            echo "TLauncher:"

            if [ -f /tmp/tlauncher.pid ] && \
               kill -0 "$(cat /tmp/tlauncher.pid)" 2>/dev/null; then
              echo "  RUNNING"
            else
              echo "  NOT RUNNING"
            fi

            echo
            echo "x11vnc:"

            if [ -f /tmp/x11vnc.pid ] && \
               kill -0 "$(cat /tmp/x11vnc.pid)" 2>/dev/null; then
              echo "  RUNNING"
            else
              echo "  NOT RUNNING"
            fi

            echo
            echo "noVNC:"

            if [ -f /tmp/novnc.pid ] && \
               kill -0 "$(cat /tmp/novnc.pid)" 2>/dev/null; then
              echo "  RUNNING"
            else
              echo "  NOT RUNNING"
            fi

            echo
            echo "Cloudflare:"

            if [ -f /tmp/cloudflared.pid ] && \
               kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "  RUNNING"
            else
              echo "  NOT RUNNING"
            fi

            echo
            echo "Memory:"
            free -h

            echo
            echo "Disk:"
            df -h /

            echo
            echo "------------------------------------------"

            sleep 60

          done


      # ============================================================
      # 21. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        run: |
          echo "=========================================="
          echo "          CLOUDCRAFT CLEANUP"
          echo "=========================================="

          if [ -f /tmp/tlauncher.pid ]; then
            kill "$(cat /tmp/tlauncher.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/novnc.pid ]; then
            kill "$(cat /tmp/novnc.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/x11vnc.pid ]; then
            kill "$(cat /tmp/x11vnc.pid)" 2>/dev/null || true
          fi

          if [ -f /tmp/xvfb.pid ]; then
            kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true
          fi

          echo
          echo "CloudCraft cleanup complete."
